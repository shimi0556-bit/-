  lens: (c = 0xff1010, o = 0.75) => once('lens' + hexKey(c) + o, () => phys({ color: c, metalness: 0, roughness: 0.08, transparent: true, opacity: o, side: THREE.DoubleSide, emissive: c, emissiveIntensity: 0.05, name: 'עדשה צבעונית' })),
  // emissive light sources; intensity is driven by the model's toggles
  light: (c = 0xffffff, i = 0.2) => once('light' + hexKey(c) + i, () => std({ color: c, emissive: c, emissiveIntensity: i, roughness: 0.3, metalness: 0, name: 'מקור אור' })),
  reflector: () => once('refl', () => std({ color: 0xdfe6ee, metalness: 1, roughness: 0.08, name: 'מחזיר אור' })),
  black: () => once('black', () => std({ color: 0x050505, metalness: 0, roughness: 0.8, name: 'שחור מט' })),
  matte: (c) => once('matte' + hexKey(c), () => std({ color: c, metalness: 0, roughness: 0.75 })),
  metal: (c, r = 0.35) => once('metal' + hexKey(c) + r, () => std({ color: c, metalness: 0.9, roughness: r })),
  emissive: (c, i = 1) => once('emis' + hexKey(c) + i, () => std({ color: c, emissive: c, emissiveIntensity: i, roughness: 0.4 })),
  // upholstery with pleats, double stitching and perforations on the centre panel.
  // dir 'v' = pleats run across the face's v axis (horizontal bands on a backrest), 'u' = the other way
  quilted: (c = 0x15171c, dir = 'v', thread = '#9c8a62', pleats = 7) => once('quilt' + hexKey(c) + dir + thread + pleats, () => {
    const base = new THREE.Color(c);
    const draw = (bump) => (g, w, h) => {
      const col = (k) => { const q = base.clone().multiplyScalar(k); return `rgb(${(q.r * 255) | 0},${(q.g * 255) | 0},${(q.b * 255) | 0})`; };
      g.fillStyle = bump ? '#808080' : col(1); g.fillRect(0, 0, w, h);
      const A = dir === 'v' ? w : h, B = dir === 'v' ? h : w; // A = across the pleats, B = along them
      const at = (a, b, fn) => (dir === 'v' ? fn(a, b) : fn(b, a));
      const p0 = 0.22 * A, p1 = 0.78 * A; // centre panel between the bolsters

        const b0 = (i / pleats) * B, b1 = ((i + 1) / pleats) * B;
        for (let k = 0; k < 12; k++) { // rounded pleat profile
          const t = k / 11, lift = Math.sin(t * Math.PI);
          g.fillStyle = bump ? `rgb(${90 + lift * 120 | 0},${90 + lift * 120 | 0},${90 + lift * 120 | 0})` : col(0.82 + lift * 0.3);
          at(p0, b0 + t * (b1 - b0), (x, y) => g.fillRect(x, y, dir === 'v' ? p1 - p0 : (b1 - b0) / 11 + 1, dir === 'v' ? (b1 - b0) / 11 + 1 : p1 - p0));
        }
        // perforations
        g.fillStyle = bump ? '#202020' : col(0.45);
        for (let a = p0 + 10; a < p1 - 6; a += 9) for (let bb = b0 + (b1 - b0) * 0.3; bb < b1 - (b1 - b0) * 0.25; bb += 8) at(a + ((bb / 8) % 2) * 4, bb, (x, y) => { g.beginPath(); g.arc(x, y, 1.3, 0, 7); g.fill(); });
        // groove + double stitching between pleats
        g.fillStyle = bump ? '#000' : col(0.35); at(p0, b0 - 1.5, (x, y) => g.fillRect(x, y, dir === 'v' ? p1 - p0 : 3, dir === 'v' ? 3 : p1 - p0));
        if (!bump) { g.fillStyle = thread; for (const off of [-5, 4]) for (let a = p0; a < p1; a += 7) at(a, b0 + off, (x, y) => g.fillRect(x, y, dir === 'v' ? 4 : 1.6, dir === 'v' ? 1.6 : 4)); }
      }
      // bolster seams with double stitching
      for (const a of [p0, p1]) {
        g.fillStyle = bump ? '#000' : col(0.35); at(a - 2, 0, (x, y) => g.fillRect(x, y, dir === 'v' ? 4 : B, dir === 'v' ? B : 4));
        if (!bump) { g.fillStyle = thread; for (const off of [-7, 6]) for (let bb = 0; bb < B; bb += 7) at(a + off, bb, (x, y) => g.fillRect(x, y, dir === 'v' ? 1.6 : 4, dir === 'v' ? 4 : 1.6)); }

    const map = canvasTexture(512, 512, draw(false));
    const bumpMap = canvasTexture(512, 512, draw(true), { linear: true });
    return new THREE.MeshPhysicalMaterial({ map, bumpMap, bumpScale: 2.2, roughness: 0.58, sheen: 0.5, sheenColor: 0x555555, sheenRoughness: 0.55, name: 'עור מקופל עם תפרים כפולים' });
  }),
  decal: (tex, o = {}) => phys({ map: tex, transparent: true, alphaTest: 0.05, roughness: o.roughness ?? 0.35, metalness: o.metalness ?? 0, clearcoat: o.clearcoat ?? 0.6, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, ...o.extra }),
  screen: (tex, i = 0.9) => std({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: i, roughness: 0.2, metalness: 0 }),

// ------------------------------------------------------------ canvas textures
function canvasTexture(w, h, draw, o = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = o.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (o.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.repeat[0], o.repeat[1]); }
  return t;
}

// deterministic PRNG so every build of a model is identical
function rng(seed = 1) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function noiseTexture(size = 256, kind = 'leather') {
  return once('noise' + kind + size, () => canvasTexture(size, size, (g, w, h) => {
    const r = rng(kind.length * 977);
    const img = g.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      let v = 128 + (r() - 0.5) * (kind === 'carpet' ? 200 : 90);
      if (kind === 'fabric') v += ((i % w) % 4 < 2 ? 30 : -30) + ((Math.floor(i / w) % 4) < 2 ? 20 : -20);
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    if (kind === 'leather') { // pebbled grain cells
      g.globalAlpha = 0.25;
      for (let k = 0; k < 900; k++) { g.fillStyle = r() > 0.5 ? '#fff' : '#000'; g.beginPath(); g.arc(r() * w, r() * h, 1 + r() * 3, 0, 7); g.fill(); }
    }
  }, { linear: true, repeat: kind === 'carpet' ? [10, 10] : [6, 6] }));
}

function woodTexture() {
  return once('woodtex', () => canvasTexture(512, 512, (g, w, h) => {
    const r = rng(7);
    g.fillStyle = '#5b2f18'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 2) {
      const k = Math.sin(y * 0.05 + Math.sin(y * 0.013) * 4) * 0.5 + 0.5;
      g.fillStyle = `rgba(${40 + k * 60},${18 + k * 25},${8 + k * 10},${0.25 + r() * 0.2})`;
      g.fillRect(0, y, w, 2);
    }
    for (let k = 0; k < 40; k++) { g.strokeStyle = 'rgba(20,8,2,0.25)'; g.beginPath(); const y = r() * h; g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + r() * 30 - 15, w * 0.6, y + r() * 30 - 15, w, y + r() * 20 - 10); g.stroke(); }
  }, { repeat: [2, 2] }));
}

// text rendered into a texture; returns {tex, aspect}
function textTexture(text, o = {}) {
  const font = o.font || '700 120px "Helvetica Neue", Arial, sans-serif';
  const pad = o.pad ?? 20;
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = font;
  const lines = String(text).split('\n');
  const lh = o.lineHeight || parseInt(font.match(/(\d+)px/)[1], 10) * 1.15;
  const w = Math.ceil(Math.max(...lines.map((l) => meas.measureText(l).width)) + pad * 2);
  const h = Math.ceil(lh * lines.length + pad * 2);
  const tex = canvasTexture(o.w || w, o.h || h, (g, W, H) => {
    if (o.bg) { g.fillStyle = o.bg; g.fillRect(0, 0, W, H); }
    g.font = font; g.fillStyle = o.color || '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (o.letterSpacing) g.letterSpacing = o.letterSpacing;
    lines.forEach((l, i) => g.fillText(l, W / 2, H / 2 + (i - (lines.length - 1) / 2) * lh));
  });
  return { tex, aspect: (o.w || w) / (o.h || h) };
}

// ---------------------------------------------------------------- geometry
const G = {
  box(w, h, d, r = 0, seg = 2) {
    if (r > 0) return new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2, h / 2, d / 2) * 0.999);
    return new THREE.BoxGeometry(w, h, d);
  },
  // cylinder along an axis ('x' | 'y' | 'z')
  cyl(rTop, rBot, h, seg = 32, axis = 'y', open = false, hseg = 1) {
    const g = new THREE.CylinderGeometry(rTop, rBot, h, seg, hseg, open);
    if (axis === 'x') g.rotateZ(-Math.PI / 2);
    if (axis === 'z') g.rotateX(Math.PI / 2);
    return g;
  },
  sphere(r, ws = 24, hs = 16) { return new THREE.SphereGeometry(r, ws, hs); },
  torus(R, r, rs = 12, ts = 48, arc = Math.PI * 2, axis = 'z') {
    const g = new THREE.TorusGeometry(R, r, rs, ts, arc);
    if (axis === 'x') g.rotateY(Math.PI / 2);
    if (axis === 'y') g.rotateX(Math.PI / 2);
    return g;
  },
  // lathe from [radius, height] pairs, revolved around an axis
  lathe(pts, seg = 48, axis = 'y', phiStart = 0, phiLen = Math.PI * 2) {
    const g = new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(Math.max(r, 0), y)), seg, phiStart, phiLen);
    if (axis === 'x') g.rotateZ(-Math.PI / 2);
    if (axis === 'z') g.rotateX(Math.PI / 2);
    return g;
  },
  tube(pts, r, segs = 64, radial = 8, closed = false, curveType = 'catmullrom', tension = 0.5) {
    const curve = new THREE.CatmullRomCurve3(pts.map((p) => (p.isVector3 ? p : V3(...p))), closed, curveType, tension);
    return new THREE.TubeGeometry(curve, segs, r, radial, closed);
  },
  // polyline tube with sharp-ish bends (pipes, brake lines)
  pipe(pts, r, radial = 8) {
    return G.tube(pts, r, Math.max(8, pts.length * 12), radial, false, 'centripetal');
  },
  shape(pts, holes = []) {
    const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
    holes.forEach((h) => s.holes.push(h.isPath ? h : new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y)))));
    return s;
  },
  roundRect(w, h, r, cx = 0, cy = 0) {
    const s = new THREE.Shape(); const x = cx - w / 2, y = cy - h / 2; r = Math.min(r, w / 2, h / 2);
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  },
  roundRectPath(w, h, r, cx = 0, cy = 0) { const s = G.roundRect(w, h, r, cx, cy); const p = new THREE.Path(); p.curves = s.curves; return p; },
  circlePath(r, cx = 0, cy = 0, cw = false) { const p = new THREE.Path(); p.absarc(cx, cy, r, 0, Math.PI * 2, cw); return p; },
  // extrude a 2D shape (XY) by depth along +Z, centred on z=0. A bevel grows the outline
  // by `bevel` unless bevelOffset: -bevel keeps the outline where the shape says
  extrude(shape, depth, o = {}) {
    const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: !!o.bevel, bevelSize: o.bevel || 0, bevelOffset: o.bevelOffset ?? 0, bevelThickness: o.bevelT ?? o.bevel ?? 0, bevelSegments: o.bevelSeg ?? 3, curveSegments: o.curveSeg ?? 16, steps: o.steps ?? 1 });
    g.translate(0, 0, -depth / 2);
    return g;
  },
  hexNut(s = 0.012, h = 0.01) { return once('hex' + s + h, () => G.cyl(s, s, h, 6, 'y')); },
  // hex bolt head + washer, standing on +Y
  bolt(s = 0.01) {
    return once('bolt' + s, () => {
      const head = G.cyl(s, s, s * 0.65, 6, 'y'); head.translate(0, s * 0.45, 0);
      const washer = G.cyl(s * 1.35, s * 1.35, s * 0.15, 16, 'y'); washer.translate(0, s * 0.075, 0);
      return mergeGeometries([head.toNonIndexed(), washer.toNonIndexed()]);
    });
  },
  rivet(r = 0.006) { return once('rivet' + r, () => { const g = new THREE.SphereGeometry(r, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2); return g; }); },
  merge(list) {
    const norm = list.filter(Boolean).map((g) => { const n = g.index ? g.toNonIndexed() : g; if (!n.attributes.uv) n.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n.attributes.position.count * 2), 2)); return n; });
    norm.forEach((g) => { for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k); });
    return mergeGeometries(norm);
  },
  // place a geometry copy with a transform (for merging many small parts)
  at(geo, pos = [0, 0, 0], rot = [0, 0, 0], scale = 1) {
    const g = geo.clone();
    const m = new THREE.Matrix4().compose(V3(...pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)), typeof scale === 'number' ? V3(scale, scale, scale) : V3(...scale));
    g.applyMatrix4(m);
    return g;
  },
};

// average normals of vertices that share a position (rounded-box face seams)
function smoothNormals(g) {
  g.computeVertexNormals();
  const pos = g.attributes.position, nor = g.attributes.normal, acc = new Map();
  const key = (i) => `${Math.round(pos.getX(i) * 2e4)},${Math.round(pos.getY(i) * 2e4)},${Math.round(pos.getZ(i) * 2e4)}`;
  for (let i = 0; i < pos.count; i++) { const k = key(i), a = acc.get(k) || [0, 0, 0]; a[0] += nor.getX(i); a[1] += nor.getY(i); a[2] += nor.getZ(i); acc.set(k, a); }
  for (let i = 0; i < pos.count; i++) { const a = acc.get(key(i)), l = Math.hypot(a[0], a[1], a[2]) || 1; nor.setXYZ(i, a[0] / l, a[1] / l, a[2] / l); }
  nor.needsUpdate = true;
  return g;
}

// Sculpted ("soft") box: a finely subdivided rounded box pushed around by
// deform(p, n), where n is the vertex position normalised to [-1, 1] on each
// axis. Used for upholstery, pillows, housings: anything that shouldn't look
// like a plain box. Keeps the 6 face groups (px, nx, py, ny, pz, nz), so a
// material array can put e.g. quilted leather on just the seating face.
G.soft = (w, h, d, o = {}) => {
  const r = Math.min(o.r ?? 0.02, (w / 2) * 0.98, (h / 2) * 0.98, (d / 2) * 0.98);
  const g = new RoundedBoxGeometry(w, h, d, o.seg ?? 5, r);
  if (o.deform) {
    const pos = g.attributes.position, p = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      p.fromBufferAttribute(pos, i); n.set(p.x / (w / 2), p.y / (h / 2), p.z / (d / 2));
      o.deform(p, n); pos.setXYZ(i, p.x, p.y, p.z);
    }
  }
  return smoothNormals(g);
};

// --------------------------------------------------------- param surfaces
// Sorted samples from a to b. `step` may be a number or a function of position;
// every value in `breaks` that falls inside (a, b) is hit exactly, so patches
// cut from the same surface line up perfectly with the holes left for them.
function samples(a, b, step, breaks = []) {
  const dir = Math.sign(b - a) || 1;
  const st = typeof step === 'function' ? step : () => step;
  const bs = [...new Set([...breaks, b])].filter((t) => (t - a) * dir > 1e-9 && (b - t) * dir >= -1e-9).sort((p, q) => (p - q) * dir);
  const out = [a]; let cur = a;
  for (const nb of bs) {
    let n = 0, t = cur;
    while ((nb - t) * dir > 1e-9 && n < 4000) { t += dir * Math.max(1e-4, st(t)); n++; }
    n = Math.max(1, n);
    for (let i = 1; i <= n; i++) out.push(cur + ((nb - cur) * i) / n);
    cur = nb;
  }
  return out;
}

// Build a surface from S(u, v) -> Vector3 over the grid us × vs.
//   skip(u, v)  -> true to leave a hole for the quad centred at (u, v)
//   out(p,u,v)  -> a vector pointing "outside" (fixes normal orientation)
//   offset      -> push the surface along its normal (negative = inward)
//   thickness   -> solidify inward, adding inner skin + rim walls around holes/edges
function surface(S, us, vs, o = {}) {
  const { skip = null, out = null, offset = 0, thickness = 0, inset = 0 } = o;
  const nu = us.length, nv = vs.length, e = 1e-4;
  const P = new Array(nu * nv), N = new Array(nu * nv);
  const idx = (i, j) => i * nv + j;
  for (let i = 0; i < nu; i++) {
    for (let j = 0; j < nv; j++) {
      const u = us[i], v = vs[j];
      const p = S(u, v);
      const du = S(u + e, v).sub(S(u - e, v));
      const dv = S(u, v + e).sub(S(u, v - e));
      let n = du.cross(dv);
      if (n.lengthSq() < 1e-18) n = null; else {
        n.normalize();
        if (out) { const h = out(p, u, v); if (n.dot(h) < 0) n.negate(); }
      }
      P[idx(i, j)] = p; N[idx(i, j)] = n;
    }
  }
  // fill degenerate normals from the nearest valid neighbour
  for (let pass = 0; pass < 4; pass++) for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    if (N[idx(i, j)]) continue;
    const nb = [[i + 1, j], [i - 1, j], [i, j + 1], [i, j - 1]].find(([a, b]) => a >= 0 && b >= 0 && a < nu && b < nv && N[idx(a, b)]);
    if (nb) N[idx(i, j)] = N[idx(nb[0], nb[1])].clone();
  }
  for (let k = 0; k < N.length; k++) if (!N[k]) N[k] = V3(0, 1, 0);

  const keep = new Uint8Array((nu - 1) * (nv - 1));
  for (let i = 0; i < nu - 1; i++) for (let j = 0; j < nv - 1; j++) {
    const uc = (us[i] + us[i + 1]) / 2, vc = (vs[j] + vs[j + 1]) / 2;
    keep[i * (nv - 1) + j] = skip && skip(uc, vc) ? 0 : 1;
  }
  const kept = (i, j) => i >= 0 && j >= 0 && i < nu - 1 && j < nv - 1 && keep[i * (nv - 1) + j] === 1;

  // uv by accumulated distance along the middle row/column
  const uAcc = [0], vAcc = [0];
  const jm = Math.floor(nv / 2), im = Math.floor(nu / 2);
  for (let i = 1; i < nu; i++) uAcc.push(uAcc[i - 1] + P[idx(i, jm)].distanceTo(P[idx(i - 1, jm)]));
  for (let j = 1; j < nv; j++) vAcc.push(vAcc[j - 1] + P[idx(im, j)].distanceTo(P[idx(im, j - 1)]));

  const pos = [], nor = [], uvs = [], ind = [];
  const push = (p, n, uu, vv) => { pos.push(p.x, p.y, p.z); nor.push(n.x, n.y, n.z); uvs.push(uu, vv); return pos.length / 3 - 1; };
  const layer = (off, flip) => {
    const base = pos.length / 3;
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
      const n = N[idx(i, j)];
      const p = P[idx(i, j)].clone().addScaledVector(n, off);
      push(p, flip ? n.clone().negate() : n, uAcc[i], vAcc[j]);
    }
    for (let i = 0; i < nu - 1; i++) for (let j = 0; j < nv - 1; j++) {
      if (!kept(i, j)) continue;
      const a = base + idx(i, j), b = base + idx(i + 1, j), c = base + idx(i + 1, j + 1), d = base + idx(i, j + 1);
      const pa = P[idx(i, j)], pb = P[idx(i + 1, j)], pc = P[idx(i + 1, j + 1)], pd = P[idx(i, j + 1)];
      const fn = pc.clone().sub(pa).cross(pd.clone().sub(pb));
      const nAvg = N[idx(i, j)].clone().add(N[idx(i + 1, j + 1)]);
      let ccw = fn.dot(nAvg) > 0;
      if (flip) ccw = !ccw;
      if (ccw) ind.push(a, b, c, a, c, d); else ind.push(a, c, b, a, d, c);
    }
  };
  const outer = offset, inner = offset - thickness;
  layer(outer, false);
  if (thickness > 0) layer(inner, true);
  const skinCount = ind.length;
  if (thickness > 0) {
    // rim walls on every boundary edge of the kept region
    const wall = (i0, j0, i1, j1, ci, cj) => {
      const k0 = idx(i0, j0), k1 = idx(i1, j1);
      const a = P[k0].clone().addScaledVector(N[k0], outer), b = P[k1].clone().addScaledVector(N[k1], outer);
      const c = P[k1].clone().addScaledVector(N[k1], inner), d = P[k0].clone().addScaledVector(N[k0], inner);
      const centre = P[idx(ci, cj)].clone().add(P[idx(ci + 1, cj + 1)]).multiplyScalar(0.5);
      const away = a.clone().add(b).multiplyScalar(0.5).sub(centre);
      const fn = b.clone().sub(a).cross(d.clone().sub(a));
      if (fn.lengthSq() < 1e-16) return;
      const n = fn.clone().normalize();

          const ps = partsOf(sid).filter((p) => !term || (p.userData.part.he + ' ' + (p.userData.part.en || '') + ' ' + (p.userData.part.desc || '')).toLowerCase().includes(term));
          if (!ps.length) continue;
          const d = h('details', { class: 'grp', open: !!term },
            h('summary', {}, h('span', { class: 'dot', style: `width:9px;height:9px;border-radius:50%;background:${accentOf(sid)}` }), sysInfo.get(sid).he, h('span', { class: 'cnt' }, ps.length)),
            ps.map((p) => h('button', { class: 'prt' + (p.userData.parentPart ? ' sub' : '') + (p === selected ? ' on' : ''), onclick: () => { select(p); focusOn(p); } }, p.userData.part.he)));
          list.append(d);
        }
      };
      q.addEventListener('input', render); render();
      pbody.append(q, list);
    }
    if (id === 'spec') {
      pbody.append(h('table', { class: 'spec' }, (meta.specs || []).map(([k, v]) => h('tr', {}, h('td', {}, k), h('td', {}, v)))));
      if (meta.specNote) pbody.append(h('div', { class: 'note' }, meta.specNote));
    }
    if (id === 'facts') {
      pbody.append(h('ul', { class: 'facts' }, (meta.facts || []).map((f) => h('li', {}, f))));
      if (meta.sources) pbody.append(h('div', { class: 'note', html: 'מקורות: ' + meta.sources.map((s) => `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join(' · ') }));
      pbody.append(h('div', { class: 'note' }, `נבנה בקוד בלבד — בלי קבצי מודל או תמונות. ${window.__stats.meshes.toLocaleString()} רשתות, ${window.__stats.triangles.toLocaleString()} משולשים, נבנה ב-${window.__stats.buildMs}ms.`));
    }
  }
  function soloSystem(sid) { for (const k of systems.keys()) visible.set(k, k === sid); refreshVisibility(); showTab('sys'); }
  function refreshVisibility() {
    root.traverse((o) => { if (o.isMesh) o.visible = visible.get(o.userData.sysId) !== false && (!isolated || isInside(o, isolated)); });
  }
  showTab('sys');

  // toolbar
  const exOut = h('output', {}, '0%'), cutOut = h('output', {}, '0%');
  const exIn = h('input', { type: 'range', min: 0, max: 1, step: 0.001, value: 0, oninput: (e) => { setExplodeTarget(+e.target.value); } });
  let zoomedForExplode = false;
  function setExplodeTarget(v) {
    explodeTarget = v; exIn.value = v; exOut.textContent = Math.round(v * 100) + '%';
    // pulling the model apart from close up: back off so the pieces stay in frame
    if (v > 0.35 && !zoomedForExplode && camera.position.distanceTo(controls.target) < radius * 3.4) { zoomedForExplode = true; goView('explode'); }
    if (v < 0.05) zoomedForExplode = false;
  }
  const cutIn = h('input', { type: 'range', min: 0, max: 1, step: 0.001, value: 0, oninput: (e) => { cut = +e.target.value; cutOut.textContent = Math.round(cut * 100) + '%'; applyClip(); } });
  const axisSeg = h('div', { class: 'seg' }, [['z', 'צד'], ['y', 'על'], ['x', 'חזית']].map(([a, he]) => h('button', { class: a === cutAxis ? 'on' : '', onclick: (e) => { cutAxis = a; axisSeg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === e.target)); applyClip(true); } }, he)));
  let explodeTarget = 0;
  const tbtn = (label, k, on, fn) => { const b = h('button', { class: 'btn' + (on ? ' on' : ''), onclick: () => b.classList.toggle('on', fn()) }, label, k ? h('span', { class: 'k' }, k) : null); return b; };
  const bX = tbtn('רנטגן', 'X', false, () => { xray = !xray; setMaterials(); return xray; });
  const bW = tbtn('שלד קווי', 'W', false, () => { wire = !wire; setMaterials(); return wire; });
  let night = false;
  const bN = tbtn('לילה', 'N', false, () => { night = !night; applyNight(); return night; });
  const bR = tbtn('סיבוב', 'R', false, () => { controls.autoRotate = !controls.autoRotate; return controls.autoRotate; });
  const toggles = K.registry.toggles;
  const tgButtons = toggles.map((t, i) => tbtn(t.he, t.key || String(i + 1), t.target > 0.5, () => { t.target = t.target > 0.5 ? 0 : 1; return t.target > 0.5; }));
  const views = buildViews();
  const viewSel = h('select', { class: 'btn', onchange: (e) => { goView(e.target.value); e.target.value = ''; } }, h('option', { value: '' }, '🎥 מבטים'), Object.entries(views).map(([k, v]) => h('option', { value: k }, v.he)));
  const bShot = h('button', { class: 'btn', onclick: screenshot }, '📷 צילום');
  const bHelp = h('button', { class: 'btn', onclick: () => help.hidden = false }, '?');
  const bar = h('div', { class: 'bar ui' },
    h('div', { class: 'row' }, h('label', { class: 'sl' }, 'פירוק', exIn, exOut), h('label', { class: 'sl' }, 'חתך', cutIn, cutOut, axisSeg)),
    h('div', { class: 'row tg' }, bX, bW, h('span', { class: 'sep' }), tgButtons, h('span', { class: 'sep' }), bN, bR, viewSel, bShot, bHelp));
  app.append(bar);

  const help = h('div', { class: 'help ui', hidden: true, onclick: () => help.hidden = true }, h('div', { html: `
    <b>איך משתמשים</b><br>
    גרירה — סיבוב · גלגלת / צביטה — זום · קליק ימני / שתי אצבעות — הזזה<br>
    ריחוף מעל חלק — שם החלק · קליק — כרטיס מידע, <kbd>F</kbd> מתמקד, <kbd>I</kbd> מבודד<br>
    <kbd>E</kbd> פירוק · <kbd>C</kbd> חתך · <kbd>X</kbd> רנטגן · <kbd>W</kbd> שלד קווי · <kbd>N</kbd> לילה · <kbd>R</kbd> סיבוב<br>
    ${toggles.map((t, i) => `<kbd>${t.key || i + 1}</kbd> ${t.he}`).join(' · ')}<br>
    <kbd>Esc</kbd> ביטול בחירה · <kbd>0</kbd> מבט פתיחה` }));
  app.append(help);

  function renderCard(p) {
    if (!p) { card.hidden = true; return; }
    const info = p.userData.part, sid = p.userData.sysId;
    const crumbs = []; for (let q = p.userData.parentPart; q; q = q.userData.parentPart) crumbs.unshift(q.userData.part.he);
    card.innerHTML = '';
    card.append(...[
      h('button', { class: 'x', onclick: () => select(null) }, '×'),
      h('span', { class: 'chip' }, h('i', { style: `background:${accentOf(sid)}` }), sysInfo.get(sid)?.he || ''),
      crumbs.length ? h('div', { class: 'crumbs' }, crumbs.join(' › ') + ' ›') : null,
      h('h3', {}, info.he), info.en ? h('div', { class: 'en' }, info.en) : null,
      info.desc ? h('p', {}, info.desc) : null,
      info.mat ? h('div', { class: 'mat' }, 'חומר: ' + info.mat) : null,
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => focusOn(p) }, 'מקד', h('span', { class: 'k' }, 'F')), h('button', { class: 'btn', onclick: () => isolate(p) }, isolated ? 'הצג הכול' : 'בודד', h('span', { class: 'k' }, 'I')))].filter(Boolean));
    card.hidden = false;
  }
  function select(p) {
    selected = p; setMaterials(); renderCard(p);
    if (tabBar.querySelector('.on')?.dataset.t === 'parts') pbody.querySelectorAll('.prt').forEach((b) => b.classList.toggle('on', b.textContent === p?.userData.part.he));
  }
  function isolate(p) {
    isolated = isolated || !p ? null : p;
    if (isolated) for (const k of systems.keys()) visible.set(k, true);
    refreshVisibility(); renderCard(selected);
  }

  // camera
  function buildViews() {
    // portrait screens need the camera further back to fit the model's length
    const c = centre, r0 = radius, r = r0 * Math.max(1, 1.45 / camera.aspect);
    const v = {
      explode: { he: 'מבט פירוק', pos: [c.x + r * 2.3, c.y + r * 1.25, c.z + r * 2.6], target: [c.x, c.y + 0.5, c.z] },
      hero: { he: 'מבט פתיחה', pos: [c.x + r * 1.55, c.y + r * 0.55, c.z + r * 1.75], target: [c.x, c.y * 0.8, c.z] },
      front: { he: 'חזית', pos: [c.x + r * 2.4, c.y + 0.2, c.z], target: [c.x, c.y, c.z] },
      side: { he: 'צד', pos: [c.x, c.y + 0.2, c.z + r * 2.4], target: [c.x, c.y, c.z] },
      rear: { he: 'אחור', pos: [c.x - r * 2.4, c.y + 0.3, c.z + 0.001], target: [c.x, c.y, c.z] },
      top: { he: 'מלמעלה', pos: [c.x + 0.001, c.y + r * 2.7, c.z], target: [c.x, c.y, c.z] },
      under: { he: 'מלמטה (שלדה)', pos: [c.x + r * 0.8, 0.12, c.z + r * 1.3], target: [c.x, 0.5, c.z] },
    };
    for (const [k, w] of Object.entries(meta.views || {})) v[k] = w;
    return v;
  }
  let camAnim = null;
  function flyTo(pos, target, ms = 900, fov = 32) {
    if (SHOT) { camera.position.set(...pos); controls.target.set(...target); camera.fov = fov; camera.updateProjectionMatrix(); controls.update(); return; }
    camAnim = { p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(...pos), t1: new THREE.Vector3(...target), f0: camera.fov, f1: fov, start: performance.now(), ms };
  }
  function goView(k) {
    const v = views[k]; if (!v) return;
    // looking at the chassis needs the camera below the floor
    controls.maxPolarAngle = k === 'under' || v.under ? Math.PI : Math.PI * 0.495;
    floor.visible = grid.visible = contact.visible = !(k === 'under' || v.under);
    // a view can open things first (e.g. the engine view opens the hood)
    (v.toggles || []).forEach((id) => { const i = toggles.findIndex((t) => t.id === id); if (i >= 0) { toggles[i].target = 1; if (SHOT) { toggles[i].t = 1; toggles[i].apply(1); } tgButtons[i]?.classList.add('on'); } });
    flyTo(v.pos, v.target, 900, v.fov || 32);
  }
  function focusOn(p) {
    const b = new THREE.Box3().setFromObject(p); if (b.isEmpty()) return;
    const c = b.getCenter(new THREE.Vector3()); const r = Math.max(b.getSize(new THREE.Vector3()).length() / 2, 0.08);
    const dir = camera.position.clone().sub(controls.target).normalize();
    const dist = r / Math.sin((camera.fov * Math.PI) / 360) * 1.25;
    flyTo(c.clone().addScaledVector(dir, dist).toArray(), c.toArray());
  }
  const startView = views[meta.startView || 'hero'] || views.hero;
  camera.position.set(...startView.pos); controls.target.set(...startView.target); controls.update();
  const viewKeys = Object.keys(views);

  // night mode: darker world, model toggles flagged night:true switch on
  function applyNight() {
    scene.background = night ? BG_NIGHT : BG_DAY;
    scene.environmentIntensity = night ? 0.22 : 0.9;
    hemi.intensity = night ? 0.12 : 0.55; key.intensity = night ? 0.25 : 2.2; rim.intensity = night ? 0.6 : 1.1; fill.intensity = night ? 0.08 : 0.5;
    key.color.set(night ? 0x9db4ff : 0xffffff);
    floor.material.color.set(night ? 0x3a3f48 : 0xffffff);
    toggles.forEach((t, i) => { if (t.night) { t.target = night ? 1 : 0; tgButtons[i].classList.toggle('on', night); } });
  }

  function screenshot() {
    renderer.render(scene, camera);
    const a = h('a', { href: renderer.domElement.toDataURL('image/png'), download: (meta.id || 'model') + '.png' }); a.click();
  }

  // hover + click
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let downAt = null, lastHover = 0, hoverPart = null;
  const pick = (e) => {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObject(root, true).filter((x) => x.object.visible && visibleChain(x.object) && x.object.material !== ghost && !(clipOn && clipPlane.distanceToPoint(x.point) < 0));
    return hits.length ? partOf(hits[0].object) : null;
  };
  const visibleChain = (o) => { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; };
  renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; tip.hidden = true; });
  renderer.domElement.addEventListener('pointermove', (e) => {
    if (e.buttons || e.pointerType === 'touch') return;
    const now = performance.now(); if (now - lastHover < 50) return; lastHover = now;
    hoverPart = pick(e);
    if (hoverPart) {
      tip.innerHTML = ''; tip.append(h('i', { style: `background:${accentOf(hoverPart.userData.sysId)}` }), hoverPart.userData.part.he);
      tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.hidden = false; renderer.domElement.style.cursor = 'pointer';
    } else { tip.hidden = true; renderer.domElement.style.cursor = ''; }
  });
  renderer.domElement.addEventListener('pointerleave', () => { tip.hidden = true; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    const p = pick(e);
    // clicking the same part again climbs to its parent assembly
    if (p && selected && p === selected && p.userData.parentPart) select(p.userData.parentPart);
    else select(p);
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    const k = e.key.toLowerCase();
    if (k === 'e') setExplodeTarget(explodeTarget > 0.5 ? 0 : 1);
    else if (k === 'c') { cut = cut > 0 ? 0 : 0.5; cutIn.value = cut; cutOut.textContent = Math.round(cut * 100) + '%'; applyClip(); }
    else if (k === 'x') bX.click(); else if (k === 'w') bW.click(); else if (k === 'n') bN.click(); else if (k === 'r') bR.click();
    else if (k === 'f' && selected) focusOn(selected); else if (k === 'i' && selected) isolate(selected);
    else if (k === 'escape') { select(null); help.hidden = true; } else if (k === '0') goView(meta.startView || 'hero');
    else { const i = toggles.findIndex((t, n) => (t.key || String(n + 1)) === k); if (i >= 0) tgButtons[i].click(); }
  });

  window.addEventListener('resize', () => {
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    camera.aspect = stage.clientWidth / stage.clientHeight; camera.updateProjectionMatrix();
  });

  // ------------------------------------------------------------ loop
  const clock = new THREE.Clock();
  let frames = 0, fpsT = 0, fps = 0;
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
    if (camAnim) {
      const k = Math.min(1, (performance.now() - camAnim.start) / camAnim.ms), s = k * k * (3 - 2 * k);
      camera.position.lerpVectors(camAnim.p0, camAnim.p1, s); controls.target.lerpVectors(camAnim.t0, camAnim.t1, s);
      if (camAnim.f0 !== camAnim.f1) { camera.fov = camAnim.f0 + (camAnim.f1 - camAnim.f0) * s; camera.updateProjectionMatrix(); }
      if (k >= 1) camAnim = null;
    }
    if (Math.abs(explode - explodeTarget) > 1e-4) { explode += (explodeTarget - explode) * Math.min(1, dt * 6); applyExplode(); }
    for (const tg of toggles) {
      if (Math.abs(tg.t - tg.target) > 1e-4) { tg.t += Math.sign(tg.target - tg.t) * Math.min(Math.abs(tg.target - tg.t), dt / (tg.seconds || 1.1)); tg.apply(tg.t); }
    }
    for (const f of K.registry.frames) f(t, dt);
    controls.update();
    renderer.render(scene, camera);
    frames++; fpsT += dt;
    if (fpsT > 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; stats.textContent = `${parts.length} חלקים · ${meshCount.toLocaleString()} רשתות · ${Math.round(triCount).toLocaleString()} משולשים · ${fps} FPS`; }
    requestAnimationFrame(tick);
  }
  const ld = $('.loading'); ld.style.opacity = 0; setTimeout(() => (ld.hidden = true), 500);
  if (SHOT) {
    // screenshot harness (tools/check.cjs): no render loop, it calls __render() per shot
    window.__render = () => { for (const f of K.registry.frames) f(1.0, 0); controls.update(); renderer.render(scene, camera); };
    window.__render();
    window.__ready = true;
  } else {
    tick();
    requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; }));
  }
  window.__viewer = { scene, camera, controls, renderer, root, goView, setExplode: (v) => { explodeTarget = explode = v; applyExplode(); }, toggles, select, focusOn, parts, setCut: (v, a = 'z') => { cutAxis = a; cut = v; applyClip(true); }, setXray: (v) => { xray = v; setMaterials(); }, setNight: (v) => { night = v; applyNight(); } };
}

main().catch(showError);

</script>
