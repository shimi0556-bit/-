const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

// ---------------------------------------------------------------- materials
const cache = new Map();
const once = (key, make) => { if (!cache.has(key)) cache.set(key, make()); return cache.get(key); };
const hexKey = (c) => (typeof c === 'number' ? c.toString(16) : String(c));

function phys(o) { return new THREE.MeshPhysicalMaterial(o); }
function std(o) { return new THREE.MeshStandardMaterial(o); }

const M = {
  // deep multi-layer car paint: metallic base + clear coat
  paint: (c = 0x07080b) => once('paint' + hexKey(c), () => phys({ color: c, metalness: 0.6, roughness: 0.38, clearcoat: 1, clearcoatRoughness: 0.035, side: THREE.DoubleSide, name: 'צבע מתכתי + שכבת לכה' })),
  paintFlat: (c = 0x111111, r = 0.6) => once('pflat' + hexKey(c) + r, () => std({ color: c, metalness: 0.1, roughness: r, name: 'צבע מט' })),
  chrome: () => once('chrome', () => std({ color: 0xffffff, metalness: 1, roughness: 0.05, name: 'כרום' })),
  satin: () => once('satin', () => std({ color: 0xcfd3d8, metalness: 1, roughness: 0.28, name: 'כרום סאטן' })),
  darkChrome: () => once('dchrome', () => std({ color: 0x55585e, metalness: 1, roughness: 0.12, name: 'כרום כהה' })),
  aluminum: () => once('alu', () => std({ color: 0xd9dde2, metalness: 1, roughness: 0.22, name: 'אלומיניום מלוטש' })),
  castAlu: () => once('calu', () => std({ color: 0xa9adb2, metalness: 0.9, roughness: 0.55, name: 'אלומיניום יצוק' })),
  steel: () => once('steel', () => std({ color: 0x8b9096, metalness: 0.95, roughness: 0.38, name: 'פלדה' })),
  darkSteel: () => once('dsteel', () => std({ color: 0x3a3d42, metalness: 0.85, roughness: 0.5, name: 'פלדה כהה' })),
  castIron: () => once('ciron', () => std({ color: 0x46484c, metalness: 0.75, roughness: 0.78, name: 'ברזל יצוק' })),
  armorSteel: () => once('asteel', () => std({ color: 0x6b7178, metalness: 0.9, roughness: 0.45, name: 'פלדת שריון מוקשית' })),
  titanium: () => once('titan', () => std({ color: 0x9a9690, metalness: 0.9, roughness: 0.32, name: 'טיטניום' })),
  ceramic: () => once('ceram', () => std({ color: 0xe8e2d4, metalness: 0, roughness: 0.6, name: 'קרמיקה בליסטית' })),
  kevlar: () => once('kevlar', () => std({ color: 0xc9a43a, metalness: 0.05, roughness: 0.8, name: 'קבלר (אראמיד)' })),
  copper: () => once('copper', () => std({ color: 0xc8764a, metalness: 1, roughness: 0.3, name: 'נחושת' })),
  brass: () => once('brass', () => std({ color: 0xd8b25a, metalness: 1, roughness: 0.3, name: 'פליז' })),
  gold: () => once('gold', () => std({ color: 0xf2c75c, metalness: 1, roughness: 0.18, name: 'זהב' })),
  rubber: () => once('rubber', () => std({ color: 0x141416, metalness: 0, roughness: 0.92, name: 'גומי' })),
  tire: () => once('tire', () => std({ color: 0x18181a, metalness: 0, roughness: 0.86, name: 'גומי צמיגים' })),
  plastic: (c = 0x15161a, r = 0.55) => once('plastic' + hexKey(c) + r, () => std({ color: c, metalness: 0, roughness: r, name: 'פלסטיק' })),
  gloss: (c = 0x0b0b0d) => once('gloss' + hexKey(c), () => phys({ color: c, metalness: 0, roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05, name: 'פלסטיק מבריק' })),
  leather: (c = 0x15171c) => once('leather' + hexKey(c), () => phys({ color: c, metalness: 0, roughness: 0.62, sheen: 0.4, sheenColor: 0x444444, sheenRoughness: 0.6, bumpMap: noiseTexture(256, 'leather'), bumpScale: 0.6, name: 'עור' })),
  fabric: (c = 0x1b1d24) => once('fabric' + hexKey(c), () => std({ color: c, metalness: 0, roughness: 0.95, bumpMap: noiseTexture(256, 'fabric'), bumpScale: 0.5, name: 'בד' })),
  carpet: (c = 0x14161d) => once('carpet' + hexKey(c), () => std({ color: c, metalness: 0, roughness: 1, bumpMap: noiseTexture(256, 'carpet'), bumpScale: 1, name: 'שטיח' })),
  wood: () => once('wood', () => phys({ color: 0x5a2e17, map: woodTexture(), roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.08, name: 'עץ מצופה לכה' })),
  glass: (c = 0x0d1418, o = 0.55) => once('glass' + hexKey(c) + o, () => phys({ color: c, metalness: 0, roughness: 0.02, transparent: true, opacity: o, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: 1.0, clearcoat: 1, name: 'זכוכית' })),
  polycarb: () => once('polyc', () => phys({ color: 0x3d5a58, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: 0.3, name: 'פוליקרבונט' })),
  clearLens: () => once('clens', () => phys({ color: 0xffffff, metalness: 0, roughness: 0.02, transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide, name: 'עדשה שקופה' })),
  lens: (c = 0xff1010, o = 0.75) => once('lens' + hexKey(c) + o, () => phys({ color: c, metalness: 0, roughness: 0.08, transparent: true, opacity: o, side: THREE.DoubleSide, emissive: c, emissiveIntensity: 0.05, name: 'עדשה צבעונית' })),
  // emissive light sources; intensity is driven by the model's toggles
  light: (c = 0xffffff, i = 0.2) => once('light' + hexKey(c) + i, () => std({ color: c, emissive: c, emissiveIntensity: i, roughness: 0.3, metalness: 0, name: 'מקור אור' })),
  reflector: () => once('refl', () => std({ color: 0xdfe6ee, metalness: 1, roughness: 0.08, name: 'מחזיר אור' })),
  black: () => once('black', () => std({ color: 0x050505, metalness: 0, roughness: 0.8, name: 'שחור מט' })),
  matte: (c) => once('matte' + hexKey(c), () => std({ color: c, metalness: 0, roughness: 0.75 })),
  metal: (c, r = 0.35) => once('metal' + hexKey(c) + r, () => std({ color: c, metalness: 0.9, roughness: r })),
  emissive: (c, i = 1) => once('emis' + hexKey(c) + i, () => std({ color: c, emissive: c, emissiveIntensity: i, roughness: 0.4 })),
  // upholstery with pleats, double stitching and perforations on the centre panel.
  // dir 'v' = pleats run across the face's v axis (horizontal bands on a backrest), 'u' = the other way
  quilted: (c = 0x15171c, dir = 'v', thread = '#9c8a62', pleats = 7) => once('quilt' + hexKey(c) + dir + thread + pleats, () => {
    const base = new THREE.Color(c);
    const draw = (bump) => (g, w, h) => {
      const col = (k) => { const q = base.clone().multiplyScalar(k); return `rgb(${(q.r * 255) | 0},${(q.g * 255) | 0},${(q.b * 255) | 0})`; };
      g.fillStyle = bump ? '#808080' : col(1); g.fillRect(0, 0, w, h);
      const A = dir === 'v' ? w : h, B = dir === 'v' ? h : w; // A = across the pleats, B = along them
      const at = (a, b, fn) => (dir === 'v' ? fn(a, b) : fn(b, a));
      const p0 = 0.22 * A, p1 = 0.78 * A; // centre panel between the bolsters
      for (let i = 0; i < pleats; i++) {
        const b0 = (i / pleats) * B, b1 = ((i + 1) / pleats) * B;
        for (let k = 0; k < 12; k++) { // rounded pleat profile
          const t = k / 11, lift = Math.sin(t * Math.PI);
          g.fillStyle = bump ? `rgb(${90 + lift * 120 | 0},${90 + lift * 120 | 0},${90 + lift * 120 | 0})` : col(0.82 + lift * 0.3);
          at(p0, b0 + t * (b1 - b0), (x, y) => g.fillRect(x, y, dir === 'v' ? p1 - p0 : (b1 - b0) / 11 + 1, dir === 'v' ? (b1 - b0) / 11 + 1 : p1 - p0));
        }
        // perforations
        g.fillStyle = bump ? '#202020' : col(0.45);
        for (let a = p0 + 10; a < p1 - 6; a += 9) for (let bb = b0 + (b1 - b0) * 0.3; bb < b1 - (b1 - b0) * 0.25; bb += 8) at(a + ((bb / 8) % 2) * 4, bb, (x, y) => { g.beginPath(); g.arc(x, y, 1.3, 0, 7); g.fill(); });
        // groove + double stitching between pleats
        g.fillStyle = bump ? '#000' : col(0.35); at(p0, b0 - 1.5, (x, y) => g.fillRect(x, y, dir === 'v' ? p1 - p0 : 3, dir === 'v' ? 3 : p1 - p0));
        if (!bump) { g.fillStyle = thread; for (const off of [-5, 4]) for (let a = p0; a < p1; a += 7) at(a, b0 + off, (x, y) => g.fillRect(x, y, dir === 'v' ? 4 : 1.6, dir === 'v' ? 1.6 : 4)); }
      }
      // bolster seams with double stitching
      for (const a of [p0, p1]) {
        g.fillStyle = bump ? '#000' : col(0.35); at(a - 2, 0, (x, y) => g.fillRect(x, y, dir === 'v' ? 4 : B, dir === 'v' ? B : 4));
        if (!bump) { g.fillStyle = thread; for (const off of [-7, 6]) for (let bb = 0; bb < B; bb += 7) at(a + off, bb, (x, y) => g.fillRect(x, y, dir === 'v' ? 1.6 : 4, dir === 'v' ? 4 : 1.6)); }
      }
    };
    const map = canvasTexture(512, 512, draw(false));
    const bumpMap = canvasTexture(512, 512, draw(true), { linear: true });
    return new THREE.MeshPhysicalMaterial({ map, bumpMap, bumpScale: 2.2, roughness: 0.58, sheen: 0.5, sheenColor: 0x555555, sheenRoughness: 0.55, name: 'עור מקופל עם תפרים כפולים' });
  }),
  decal: (tex, o = {}) => phys({ map: tex, transparent: true, alphaTest: 0.05, roughness: o.roughness ?? 0.35, metalness: o.metalness ?? 0, clearcoat: o.clearcoat ?? 0.6, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, ...o.extra }),
  screen: (tex, i = 0.9) => std({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: i, roughness: 0.2, metalness: 0 }),
};

// ------------------------------------------------------------ canvas textures
function canvasTexture(w, h, draw, o = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = o.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (o.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.repeat[0], o.repeat[1]); }
  return t;
}

// deterministic PRNG so every build of a model is identical
function rng(seed = 1) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function noiseTexture(size = 256, kind = 'leather') {
  return once('noise' + kind + size, () => canvasTexture(size, size, (g, w, h) => {
    const r = rng(kind.length * 977);
    const img = g.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      let v = 128 + (r() - 0.5) * (kind === 'carpet' ? 200 : 90);
      if (kind === 'fabric') v += ((i % w) % 4 < 2 ? 30 : -30) + ((Math.floor(i / w) % 4) < 2 ? 20 : -20);
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    if (kind === 'leather') { // pebbled grain cells
      g.globalAlpha = 0.25;
      for (let k = 0; k < 900; k++) { g.fillStyle = r() > 0.5 ? '#fff' : '#000'; g.beginPath(); g.arc(r() * w, r() * h, 1 + r() * 3, 0, 7); g.fill(); }
    }
  }, { linear: true, repeat: kind === 'carpet' ? [10, 10] : [6, 6] }));
}

function woodTexture() {
  return once('woodtex', () => canvasTexture(512, 512, (g, w, h) => {
    const r = rng(7);
    g.fillStyle = '#5b2f18'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 2) {
      const k = Math.sin(y * 0.05 + Math.sin(y * 0.013) * 4) * 0.5 + 0.5;
      g.fillStyle = `rgba(${40 + k * 60},${18 + k * 25},${8 + k * 10},${0.25 + r() * 0.2})`;
      g.fillRect(0, y, w, 2);
    }
    for (let k = 0; k < 40; k++) { g.strokeStyle = 'rgba(20,8,2,0.25)'; g.beginPath(); const y = r() * h; g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + r() * 30 - 15, w * 0.6, y + r() * 30 - 15, w, y + r() * 20 - 10); g.stroke(); }
  }, { repeat: [2, 2] }));
}

// text rendered into a texture; returns {tex, aspect}
function textTexture(text, o = {}) {
  const font = o.font || '700 120px "Helvetica Neue", Arial, sans-serif';
  const pad = o.pad ?? 20;
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = font;
  const lines = String(text).split('\n');
  const lh = o.lineHeight || parseInt(font.match(/(\d+)px/)[1], 10) * 1.15;
  const w = Math.ceil(Math.max(...lines.map((l) => meas.measureText(l).width)) + pad * 2);
  const h = Math.ceil(lh * lines.length + pad * 2);
  const tex = canvasTexture(o.w || w, o.h || h, (g, W, H) => {
    if (o.bg) { g.fillStyle = o.bg; g.fillRect(0, 0, W, H); }
    g.font = font; g.fillStyle = o.color || '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (o.letterSpacing) g.letterSpacing = o.letterSpacing;
    lines.forEach((l, i) => g.fillText(l, W / 2, H / 2 + (i - (lines.length - 1) / 2) * lh));
  });
  return { tex, aspect: (o.w || w) / (o.h || h) };
}

// ---------------------------------------------------------------- geometry
const G = {
  box(w, h, d, r = 0, seg = 2) {
    if (r > 0) return new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2, h / 2, d / 2) * 0.999);
    return new THREE.BoxGeometry(w, h, d);
  },
  // cylinder along an axis ('x' | 'y' | 'z')
  cyl(rTop, rBot, h, seg = 32, axis = 'y', open = false, hseg = 1) {
    const g = new THREE.CylinderGeometry(rTop, rBot, h, seg, hseg, open);
    if (axis === 'x') g.rotateZ(-Math.PI / 2);
    if (axis === 'z') g.rotateX(Math.PI / 2);
    return g;
  },
  sphere(r, ws = 24, hs = 16) { return new THREE.SphereGeometry(r, ws, hs); },
  torus(R, r, rs = 12, ts = 48, arc = Math.PI * 2, axis = 'z') {
    const g = new THREE.TorusGeometry(R, r, rs, ts, arc);
    if (axis === 'x') g.rotateY(Math.PI / 2);
    if (axis === 'y') g.rotateX(Math.PI / 2);
    return g;
  },
  // lathe from [radius, height] pairs, revolved around an axis
  lathe(pts, seg = 48, axis = 'y', phiStart = 0, phiLen = Math.PI * 2) {
    const g = new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(Math.max(r, 0), y)), seg, phiStart, phiLen);
    if (axis === 'x') g.rotateZ(-Math.PI / 2);
    if (axis === 'z') g.rotateX(Math.PI / 2);
    return g;
  },
  tube(pts, r, segs = 64, radial = 8, closed = false, curveType = 'catmullrom', tension = 0.5) {
    const curve = new THREE.CatmullRomCurve3(pts.map((p) => (p.isVector3 ? p : V3(...p))), closed, curveType, tension);
    return new THREE.TubeGeometry(curve, segs, r, radial, closed);
  },
  // polyline tube with sharp-ish bends (pipes, brake lines)
  pipe(pts, r, radial = 8) {
    return G.tube(pts, r, Math.max(8, pts.length * 12), radial, false, 'centripetal');
  },
  shape(pts, holes = []) {
    const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
    holes.forEach((h) => s.holes.push(h.isPath ? h : new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y)))));
    return s;
  },
  roundRect(w, h, r, cx = 0, cy = 0) {
    const s = new THREE.Shape(); const x = cx - w / 2, y = cy - h / 2; r = Math.min(r, w / 2, h / 2);
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  },
  roundRectPath(w, h, r, cx = 0, cy = 0) { const s = G.roundRect(w, h, r, cx, cy); const p = new THREE.Path(); p.curves = s.curves; return p; },
  circlePath(r, cx = 0, cy = 0, cw = false) { const p = new THREE.Path(); p.absarc(cx, cy, r, 0, Math.PI * 2, cw); return p; },
  // extrude a 2D shape (XY) by depth along +Z, centred on z=0. A bevel grows the outline
  // by `bevel` unless bevelOffset: -bevel keeps the outline where the shape says
  extrude(shape, depth, o = {}) {
    const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: !!o.bevel, bevelSize: o.bevel || 0, bevelOffset: o.bevelOffset ?? 0, bevelThickness: o.bevelT ?? o.bevel ?? 0, bevelSegments: o.bevelSeg ?? 3, curveSegments: o.curveSeg ?? 16, steps: o.steps ?? 1 });
    g.translate(0, 0, -depth / 2);
    return g;
  },
  hexNut(s = 0.012, h = 0.01) { return once('hex' + s + h, () => G.cyl(s, s, h, 6, 'y')); },
  // hex bolt head + washer, standing on +Y
  bolt(s = 0.01) {
    return once('bolt' + s, () => {
      const head = G.cyl(s, s, s * 0.65, 6, 'y'); head.translate(0, s * 0.45, 0);
      const washer = G.cyl(s * 1.35, s * 1.35, s * 0.15, 16, 'y'); washer.translate(0, s * 0.075, 0);
      return mergeGeometries([head.toNonIndexed(), washer.toNonIndexed()]);
    });
  },
  rivet(r = 0.006) { return once('rivet' + r, () => { const g = new THREE.SphereGeometry(r, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2); return g; }); },
  merge(list) {
    const norm = list.filter(Boolean).map((g) => { const n = g.index ? g.toNonIndexed() : g; if (!n.attributes.uv) n.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n.attributes.position.count * 2), 2)); return n; });
    norm.forEach((g) => { for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k); });
    return mergeGeometries(norm);
  },
  // place a geometry copy with a transform (for merging many small parts)
  at(geo, pos = [0, 0, 0], rot = [0, 0, 0], scale = 1) {
    const g = geo.clone();
    const m = new THREE.Matrix4().compose(V3(...pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)), typeof scale === 'number' ? V3(scale, scale, scale) : V3(...scale));
    g.applyMatrix4(m);
    return g;
  },
};

// average normals of vertices that share a position (rounded-box face seams)
function smoothNormals(g) {
  g.computeVertexNormals();
  const pos = g.attributes.position, nor = g.attributes.normal, acc = new Map();
  const key = (i) => `${Math.round(pos.getX(i) * 2e4)},${Math.round(pos.getY(i) * 2e4)},${Math.round(pos.getZ(i) * 2e4)}`;
  for (let i = 0; i < pos.count; i++) { const k = key(i), a = acc.get(k) || [0, 0, 0]; a[0] += nor.getX(i); a[1] += nor.getY(i); a[2] += nor.getZ(i); acc.set(k, a); }
  for (let i = 0; i < pos.count; i++) { const a = acc.get(key(i)), l = Math.hypot(a[0], a[1], a[2]) || 1; nor.setXYZ(i, a[0] / l, a[1] / l, a[2] / l); }
  nor.needsUpdate = true;
  return g;
}

// Sculpted ("soft") box: a finely subdivided rounded box pushed around by
// deform(p, n), where n is the vertex position normalised to [-1, 1] on each
// axis. Used for upholstery, pillows, housings: anything that shouldn't look
// like a plain box. Keeps the 6 face groups (px, nx, py, ny, pz, nz), so a
// material array can put e.g. quilted leather on just the seating face.
G.soft = (w, h, d, o = {}) => {
  const r = Math.min(o.r ?? 0.02, (w / 2) * 0.98, (h / 2) * 0.98, (d / 2) * 0.98);
  const g = new RoundedBoxGeometry(w, h, d, o.seg ?? 5, r);
  if (o.deform) {
    const pos = g.attributes.position, p = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      p.fromBufferAttribute(pos, i); n.set(p.x / (w / 2), p.y / (h / 2), p.z / (d / 2));
      o.deform(p, n); pos.setXYZ(i, p.x, p.y, p.z);
    }
  }
  return smoothNormals(g);
};

// --------------------------------------------------------- param surfaces
// Sorted samples from a to b. `step` may be a number or a function of position;
// every value in `breaks` that falls inside (a, b) is hit exactly, so patches
// cut from the same surface line up perfectly with the holes left for them.
function samples(a, b, step, breaks = []) {
  const dir = Math.sign(b - a) || 1;
  const st = typeof step === 'function' ? step : () => step;
  const bs = [...new Set([...breaks, b])].filter((t) => (t - a) * dir > 1e-9 && (b - t) * dir >= -1e-9).sort((p, q) => (p - q) * dir);
  const out = [a]; let cur = a;
  for (const nb of bs) {
    let n = 0, t = cur;
    while ((nb - t) * dir > 1e-9 && n < 4000) { t += dir * Math.max(1e-4, st(t)); n++; }
    n = Math.max(1, n);

// Build a surface from S(u, v) -> Vector3 over the grid us × vs.
//   skip(u, v)  -> true to leave a hole for the quad centred at (u, v)
//   out(p,u,v)  -> a vector pointing "outside" (fixes normal orientation)
//   offset      -> push the surface along its normal (negative = inward)
//   thickness   -> solidify inward, adding inner skin + rim walls around holes/edges

      const n = N[idx(i, j)];
      const p = P[idx(i, j)].clone().addScaledVector(n, off);
      push(p, flip ? n.clone().negate() : n, uAcc[i], vAcc[j]);
    }
    for (let i = 0; i < nu - 1; i++) for (let j = 0; j < nv - 1; j++) {
      if (!kept(i, j)) continue;
      const a = base + idx(i, j), b = base + idx(i + 1, j), c = base + idx(i + 1, j + 1), d = base + idx(i, j + 1);
      const pa = P[idx(i, j)], pb = P[idx(i + 1, j)], pc = P[idx(i + 1, j + 1)], pd = P[idx(i, j + 1)];

      if (!kept(i, j + 1)) wall(i, j + 1, i + 1, j + 1, i, j);
      if (!kept(i - 1, j)) wall(i, j, i, j + 1, i, j);

  // group 0 = skins, group 1 = rim walls: pass [skinMat, edgeMat] to darken panel edges
  g.addGroup(0, skinCount, 0);
  if (ind.length > skinCount) g.addGroup(skinCount, ind.length - skinCount, 1);

  return g;
}

// flat cap for a planar loop of 3D points; `normal` picks the facing side

// ------------------------------------------------------------ scene graph
const registry = { toggles: [], frames: [] };

function mesh(geo, mat, o = {}) {

function group(parent, o = {}) {
  const g = new THREE.Group();

// animated toggles (doors, lights…) — viewer renders a button per toggle

<script type="module">
// #003 — Tesla Model Y "Juniper" (2025). Built entirely in code with the library kit
// (engine/kit.js): no model files, no images. Units are metres. Axes: +x = forward,
// +y = up, +z = right (passenger side; the driver sits at -z). s = +1 right, -1 left.
//
// Body: one parametric section S(x, v) — v runs around the car from the roof centre
// (0) through the greenhouse, the shoulder, the door side and the rocker to the floor
// centre (±1). Doors, frunk lid, liftgate and every window are patches of the same
// section with shared break points, so the holes and the panels line up exactly.

window.L3D_MODEL = {

    const { M, G, V3, mesh, part, surface, samples, cap, lerp, smooth, clamp, instances } = K;

    const WHEEL_Z = 0.818;                     // track 1.636 m

    const ROOF = 1.622 - 0.5 * 0.27 * 0.27;                        // roof peak ≈ 1.62 with the crown

      if (a <= LV.glass) { const t = (a / LV.glass) * PI / 2; z = wg * Math.pow(Math.sin(t), 2 / n); y = yb + hh * Math.pow(Math.cos(t), 2 / n); }

      else if (a <= LV.side) { const t = seg(LV.shoulder, LV.side); y = lerp(yb - drop, ya + 0.05, t); z = w + 0.014 * Math.sin(PI * t * 0.8) - 0.07 * t * t; }
      else if (a <= LV.cornerB) { const t = seg(LV.side, LV.cornerB) * PI / 2; z = w - 0.07 - 0.05 * (1 - Math.cos(t)); y = ya + 0.05 - 0.05 * Math.sin(t); }
      else if (a <= LV.well) { const t = seg(LV.cornerB, LV.well); z = lerp(w - 0.12, W_IN, t); y = ya; }
      else if (a <= LV.wellIn) { const t = seg(LV.well, LV.wellIn); z = W_IN; y = lerp(ya, y0, t); }
      else { const t = seg(LV.wellIn, 1); z = lerp(W_IN, 0, t); y = y0; }
      return V3(x, y, s * z);
    };
    const out = (p, x) => V3(0, p.y - (Y0(x) + Yb(x)) / 2, p.z);
    // outward unit normal of the section at (x, v)
    const nrm = (x, v) => { const e = 1e-3; const du = sec(x + e, v).sub(sec(x - e, v)), dv = sec(x, v + e).sub(sec(x, v - e)); const n = du.cross(dv).normalize(); const p = sec(x, v); if (n.dot(out(p, x)) < 0) n.negate(); return n; };
    const onBody = (x, v, d = 0) => sec(x, v).addScaledVector(nrm(x, v), d);
    // v for a given height on the door side (s = side)
    const vAtY = (x, y, s = 1) => { const dr = 0.055 + 0.1 * smooth(1.3, XF, x); return s * (LV.shoulder + (LV.side - LV.shoulder) * clamp((Yb(x) - dr - y) / (Yb(x) - dr - YA(x) - 0.05))); };

    const inX = (x, r) => x <= Math.max(...r) && x >= Math.min(...r);
    const aP = (x) => lerp(0.165, 0.372, clamp((x - WS_TOP) / (COWL - WS_TOP)));          // A-pillar line (v at x)
    const aD = (x) => (x >= LG ? 0.165 : x >= BL_END ? lerp(0.165, 0.36, (LG - x) / (LG - BL_END)) : 0.39); // D-pillar / liftgate edge
    const fdFront = () => FD[0];
    const inFD = (x, a) => a >= GA_TOP && a <= LV.side && x <= fdFront(a) && x >= FD[1] && !(a < GA_BOT && a < aP(x) + 0.035);
    const inRD = (x, a) => a >= GA_TOP && a <= LV.side && inX(x, RD);
    const inQG = (x, a) => a >= GA_TOP && a <= GA_BOT && inX(x, QG) && (x > LG || a > aD(x) + 0.04);
    const WSA = 0.375;
    const inWS = (x, a) => a < aP(x) - 0.012 && x <= COWL && x >= WS_TOP;
    const inRoofGlass = (x, a) => a < 0.165 && x <= WS_TOP - 0.04 && x >= ROOF_END + 0.05;
    const inFrunk = (x, a) => a < 0.405 && inX(x, FR);
    const inGate = (x, a) => x <= LG && a < aD(x) + 0.03;

    // shared samplers
    const aBreaks = [0.165, GA_TOP, WSA, GA_BOT, A_G, LV.shoulder, 0.65, LV.side, LV.cornerB, LV.well, LV.wellIn];
    const arcStep = (v) => { const a = Math.abs(v); return (a > A_G && a < LV.shoulder) || (a > LV.side && a < LV.cornerB) ? 0.011 : a < A_G ? 0.009 : 0.03; };
    const vs = samples(-1, 1, arcStep, [...aBreaks, ...aBreaks.map((b) => -b), 0]);
    const xBreaks = [...FD, 0.88, ...RD, ...QG, ...FR, LG, COWL, WS_TOP, WS_TOP - 0.04, ROOF_END, ROOF_END + 0.05, BL_END, AXF - ARCH_R, AXF + ARCH_R, AXR - ARCH_R, AXR + ARCH_R];
    const xStep = (x) => (x > XF - 0.6 || x < XR + 0.32 ? 0.016 : Math.abs(x - AXF) < ARCH_R + 0.02 || Math.abs(x - AXR) < ARCH_R + 0.02 ? 0.022 : (x < COWL && x > WS_TOP) || (x < LG && x > BL_END) ? 0.012 : 0.04);
    const xs = samples(XR, XF, xStep, xBreaks);
    // sub-ranges of the shared grids, so every patch is cut on exactly the same lines as its hole
    const subX = (a, b) => { const lo = Math.min(a, b), hi = Math.max(a, b); return [lo, ...xs.filter((x) => x > lo + 1e-4 && x < hi - 1e-4), hi]; };
    const subV = (a, b) => { const lo = Math.min(a, b), hi = Math.max(a, b); return [lo, ...vs.filter((v) => v > lo + 1e-4 && v < hi - 1e-4), hi]; };

    // a patch of the section between two v-curves lo(x)..hi(x): smooth edges along the pillars
    const band = (x0, x1, lo, hi, o = {}) => surface((x, u) => sec(x, lerp(lo(x), hi(x), u)), subX(x0, x1), samples(0, 1, 0.08), { out, ...o });
    const PAINT = M.paint(0x7d838b);            // Quicksilver
    const GLOSSBLK = M.gloss(0x08090a);
    const TRIM = M.plastic(0x101113, 0.5);
    const glassMat = (o = 0.62) => M.glass(0x0b1013, o);

    // ================================================================== BODY
    const bodySys = sys('body');
    {
      const shell = part(bodySys, { he: 'מעטפת המרכב', en: 'Body shell', mat: 'פלדה ואלומיניום + צבע מתכתי Quicksilver ולכה', desc: 'המרכב החיצוני: כנפיים, עמודים, גג, ספים ופגושים. החלק האחורי שלו (מאחורי המושבים) נוצק כחתיכת אלומיניום אחת במכונת Giga Press.' });
      const skip = (x, v) => { const a = Math.abs(v); return inFD(x, a) || inRD(x, a) || inQG(x, a) || inWS(x, a) || inRoofGlass(x, a) || inFrunk(x, a) || inGate(x, a); };
      mesh(surface(sec, xs, vs, { skip, out }), [PAINT, M.black()], { parent: shell, name: 'body skin' });
      const ring = (x) => vs.map((v) => sec(x, v));
      // rear face: lower part is the bumper (body), upper part belongs to the liftgate
      const rr = ring(XR).slice(0, -1), YC = 0.66;
      const clip = (pts, keepAbove) => { const o = []; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length], pa = (p.y >= YC) === keepAbove, qa = (q.y >= YC) === keepAbove; if (pa) o.push(p); if (pa !== qa) { const t = (YC - p.y) / (q.y - p.y); o.push(p.clone().lerp(q, t)); } } return o; };
      const clipAt = (pts, yc, keepAbove) => { const o = []; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length], pa = (p.y >= yc) === keepAbove, qa = (q.y >= yc) === keepAbove; if (pa) o.push(p); if (pa !== qa) { const t = (yc - p.y) / (q.y - p.y); o.push(p.clone().lerp(q, t)); } } return o; };
      const lowerR = clip(rr, false);
      mesh(cap(clipAt(lowerR, 0.5, false), V3(-1, 0, 0)), M.plastic(0x141516, 0.6), { parent: shell, name: 'rear lower bumper (black)' });
      mesh(cap(clipAt(lowerR, 0.5, true), V3(-1, 0, 0)), PAINT, { parent: shell, name: 'rear bumper face' });
      // black lower bumper wraps around the rear corners
      for (const s2 of [1, -1]) mesh(surface(sec, subX(XR, XR + 0.32), subV(s2 * vAtY(XR + 0.2, 0.5, 1), s2 * 1), { out, offset: 0.004, skip: (x, v) => sec(x, v).y > 0.5 }), M.plastic(0x141516, 0.6), { parent: shell, name: 'rear corner cladding' });
      ctx.rearUpper = clip(rr, true);
      // B-pillar gloss-black appliqués + A-pillar trim between windshield and door glass
      const bp = part(bodySys, { he: 'עמודי B בשחור מבריק', en: 'Gloss-black B-pillar trims', mat: 'פלסטיק פסנתר שחור', desc: 'כיסוי שחור מבריק על העמוד שבין הדלתות, כדי שהחלונות ייראו כפס זכוכית אחד רציף.' });
      for (const s of [1, -1]) mesh(surface(sec, samples(RD[0] + 0.004, FD[1] - 0.004, 0.01), samples(s * GA_TOP, s * GA_BOT, 0.02), { out, offset: 0.002 }), GLOSSBLK, { parent: bp });
      // black lower body cladding + rocker
      const cl = part(bodySys, { he: 'ספים וחיפוי תחתון', en: 'Rocker panels & lower cladding', mat: 'פלסטיק מצופה + פלדה', desc: 'הסף שבין הגלגלים. הוא מחזק את המרכב ומגן על מארז הסוללה מאבנים בצד.' });
      for (const s of [1, -1]) mesh(surface(sec, samples(AXR + ARCH_R + 0.01, AXF - ARCH_R - 0.01, 0.05), samples(s * 0.75, s * LV.cornerB, 0.012), { out, offset: 0.003 }), M.plastic(0x16171a, 0.45), { parent: cl });
      // front: lower intake + grille mesh + splitter
      const fr = part(bodySys, { he: 'פגוש קדמי, פתח אוויר תחתון וספליטר', en: 'Front fascia, lower intake & splitter', mat: 'פוליפרופילן צבוע + רשת שחורה', desc: 'בחזית אין גריל כמו ברכב בנזין — רק פתח תחתון שמכניס אוויר לרדיאטור של משאבת החום, עם תריסים אקטיביים שנסגרים בנסיעה מהירה.' });
      const fxz = (z) => { let lo = XF - 0.5, hi = XF; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (W(m) > Math.abs(z)) lo = m; else hi = m; } return lo; };
      put(G.box(0.04, 0.13, 1.12, 0.03), GLOSSBLK, fr, [fxz(0.56) - 0.0, 0.34, 0], null, { name: 'lower intake' });
      instances(new THREE.BoxGeometry(0.01, 0.006, 1.06), M.plastic(0x050506, 0.6), Array.from({ length: 8 }, (_, i) => ({ pos: [fxz(0.53) + 0.018, 0.29 + i * 0.013, 0] })), { parent: fr });
      put(G.box(0.03, 0.025, 1.0, 0.01), M.plastic(0x2a2c30, 0.5), fr, [fxz(0.5) + 0.008, 0.255, 0], null, { name: 'lower lip' });
      // vertical black corner inlets (air curtains) next to the headlamps
      for (const s2 of [1, -1]) { const pts = []; for (let k = 0; k <= 8; k++) { const y = 0.3 + k * 0.05, z = s2 * 0.885; pts.push(V3(fxz(z) - 0.022, y, z)); } put(G.tube(pts, 0.022, 16, 8), GLOSSBLK, fr); }
      // rear diffuser + reflectors
      const rd = part(bodySys, { he: 'מפזר אוויר אחורי', en: 'Rear diffuser', mat: 'פלסטיק שחור מרקם', desc: 'החלק השחור התחתון בפגוש האחורי. הוא מכוון את זרימת האוויר מתחת לרכב ומקטין גרר.' });
      put(G.box(0.05, 0.05, 1.4, 0.015), M.plastic(0x141516, 0.75), rd, [XR + 0.03, Y0(XR) + 0.0, 0]);
      instances(new THREE.BoxGeometry(0.2, 0.06, 0.008), M.plastic(0x141516, 0.75), [-0.45, -0.15, 0.15, 0.45].map((z) => ({ pos: [XR + 0.09, Y0(XR) + 0.03, z] })), { parent: rd });
      // underbody aero tray
      const ut = part(bodySys, { he: 'מגש תחתון אווירודינמי', en: 'Underbody aero tray', mat: 'פלסטיק מחוזק סיבים', desc: 'כיסוי חלק לכל התחתית. הוא מגן על הסוללה ומאפשר לאוויר לזרום מתחת לרכב בלי מערבולות.' });
      put(new THREE.BoxGeometry(4.2, 0.006, 1.32), M.plastic(0x1d1e20, 0.8), ut, [0, 0.165, 0]);
      // cowl + wipers + washer jets
      const cw = part(bodySys, { he: 'אדן שמשה ומגבים', en: 'Cowl & wipers', mat: 'פלסטיק + פלדה קפיצית + גומי', desc: 'המגבים מוסתרים מתחת לקצה מכסה התא הקדמי. מגב אחד גדול מנקה כמעט את כל השמשה, ומתחתיו שני מתזי מים.' });
      put(new THREE.BoxGeometry(0.1, 0.012, 1.5), TRIM, cw, [COWL + 0.03, Yb(COWL) + 0.035, 0]);
      for (const v0 of [-0.22, 0.08]) { const pts = []; for (let k = 0; k <= 6; k++) pts.push(onBody(COWL - 0.03 - k * 0.055, v0 - k * 0.018, 0.014)); put(G.tube(pts, 0.007, 24, 6), M.rubber(), cw); put(G.cyl(0.015, 0.015, 0.02, 12, 'y'), TRIM, cw, onBody(COWL - 0.02, v0, 0.01).toArray()); }
      for (const z of [-0.3, 0.3]) put(G.cyl(0.008, 0.01, 0.015, 8, 'y'), TRIM, cw, [COWL + 0.08, Yb(COWL) + 0.04, z]);
    }

    // ================================================================== FRUNK + LIFTGATE
    {
      // frunk lid: hinged at its rear edge, opens nose-up
      const fp = V3(FR[0], Yt(FR[0]) - 0.012, 0);
      const fl = part(bodySys, { he: 'מכסה תא המטען הקדמי (frunk)', en: 'Frunk lid', mat: 'אלומיניום + צבע', desc: 'במקום מכסה מנוע: מכסה אלומיניום קל מעל תא מטען קדמי של כ־117 ליטר. נפתח מהמסך, מהאפליקציה או בלחיצה כפולה על המפתח.' });
      fl.position.copy(fp);
      const lg = surface(sec, subX(FR[0] + GAP, FR[1] - GAP), subV(-0.405, 0.405), { out, thickness: 0.014 });
      lg.translate(-fp.x, -fp.y, 0); mesh(lg, [PAINT, M.black()], { parent: fl, name: 'lid skin' });
      const li = surface(sec, samples(FR[0] + 0.07, FR[1] - 0.08, 0.06), samples(-0.33, 0.33, 0.03, [0]), { out, offset: -0.03, thickness: 0.01 }); li.translate(-fp.x, -fp.y, 0);
      mesh(li, M.plastic(0x1a1b1e, 0.8), { parent: fl, name: 'lid liner' });
      for (const z of [-0.3, 0.3]) put(G.box(0.05, 0.02, 0.02, 0.005), M.steel(), fl, [0.02, -0.02, z]);
      ctx.frunk = fl;
      K.toggle('frunk', { he: 'תא מטען קדמי', key: 'f', seconds: 1.4 }, (t) => { fl.rotation.z = 1.0 * Math.sin((t * PI) / 2); });
      const tub = part(bodySys, { he: 'אמבט תא המטען הקדמי', en: 'Frunk tub', mat: 'פלסטיק יצוק עמיד מים', desc: 'אמבט פלסטיק עמוק עם ניקוז. מתחתיו: מצבר 16V, משאבת החום ומיכל נוזל השמשות.' });
      const tb = M.plastic(0x16171a, 0.85);
      put(new THREE.BoxGeometry(0.72, 0.02, 0.84), tb, tub, [1.56, 0.56, 0]);
      put(new THREE.BoxGeometry(0.02, 0.3, 0.84), tb, tub, [1.2, 0.71, 0]); put(new THREE.BoxGeometry(0.02, 0.2, 0.84), tb, tub, [1.92, 0.66, 0]);
      for (const z of [-0.42, 0.42]) put(new THREE.BoxGeometry(0.72, 0.22, 0.02), tb, tub, [1.56, 0.67, z]);
      put(G.box(0.6, 0.012, 0.7, 0.004), M.carpet(0x1c1d21), tub, [1.56, 0.572, 0]);
      put(G.cyl(0.012, 0.012, 0.02, 10, 'y'), M.rubber(), tub, [1.56, 0.55, 0.3]);

      // liftgate: hinged at the roof, carries the backlight and the upper tail face
      const gp = V3(LG, Yt(LG) - 0.01, 0);
      const gate = part(bodySys, { he: 'דלת תא המטען האחורית', en: 'Power liftgate', mat: 'אלומיניום/פלדה + צבע', desc: 'דלת אחורית חשמלית שנפתחת עם שני בוכנות חשמליות. נושאת את השמשה האחורית, את פס האור האחורי ואת הכיתוב TESLA.' });
      gate.position.copy(gp);
      const gx = subX(XR, LG - GAP), gv = subV(-0.43, 0.43);
      const gs = surface(sec, gx, gv, { out, thickness: 0.016, skip: (x, v) => { const a = Math.abs(v); return !inGate(x, a) || (x < LG - 0.03 && x > BL_END + 0.04 && a < aD(x) - 0.025); } }); gs.translate(-gp.x, -gp.y, 0);
      mesh(gs, [PAINT, M.black()], { parent: gate, name: 'gate skin' });
      const ru = ctx.rearUpper.map((p) => p.clone().sub(gp)); mesh(cap(ru, V3(-1, 0, 0)), PAINT, { parent: gate, name: 'gate rear face' });
      const gi = part(gate, { he: 'חיפוי פנימי של דלת תא המטען', en: 'Liftgate inner trim', mat: 'פלסטיק + בד', desc: 'חיפוי פנימי עם ידית משיכה ונורת תאורה לתא המטען.' });
      put(G.box(0.03, 0.34, 1.1, 0.01), M.plastic(0x1a1b1e, 0.8), gi, [XR - gp.x + 0.03, 0.82 - gp.y, 0]);
      put(G.tube([V3(XR - gp.x + 0.05, 0.7 - gp.y, -0.08), V3(XR - gp.x + 0.08, 0.68 - gp.y, 0), V3(XR - gp.x + 0.05, 0.7 - gp.y, 0.08)], 0.01, 10, 6), M.plastic(0x2a2b2e, 0.5), gi);
      ctx.gate = gate;
      const st = part(bodySys, { he: 'בוכנות חשמליות לדלת האחורית (2)', en: 'Liftgate power struts (×2)', mat: 'פלדה + מנוע חשמלי קטן', desc: 'שתי בוכנות עם מנוע חשמלי וקפיץ פנימי. הן מרימות את הדלת וגם עוצרות אותה בגובה שנקבע במסך.' });
      const struts = [];
      for (const s of [1, -1]) { const m1 = put(G.cyl(0.016, 0.016, 0.42, 12, 'y'), M.metal(0x2b2d31, 0.4), st, [0, 0, 0]); const m2 = put(G.cyl(0.009, 0.009, 0.4, 10, 'y'), M.chrome(), st, [0, 0, 0]); struts.push({ m1, m2, s }); }
      const strutAt = (ang) => {
        const top = V3(-1.4 - gp.x, 1.35 - gp.y, 0).applyAxisAngle(V3(0, 0, 1), ang).add(gp);
        for (const { m1, m2, s } of struts) {
          const a = V3(-1.7, 0.85, s * 0.6), b = V3(top.x, top.y, s * 0.6), d = b.clone().sub(a), L = d.length(), q = new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), d.clone().normalize());
          m1.position.copy(a).addScaledVector(d, 0.25); m1.quaternion.copy(q); m2.position.copy(a).addScaledVector(d, 0.72); m2.quaternion.copy(q); m2.scale.y = L / 0.8;
        }

      // cargo floor
      const cf = part(bodySys, { he: 'רצפת תא המטען ותא תחתון', en: 'Cargo floor & sub-trunk', mat: 'לוח מעוטף שטיח', desc: 'רצפה שטוחה שמתחתיה תא אחסון עמוק נוסף — כי אין מאחור מיכל דלק או צינור פליטה.' });
      put(G.box(0.9, 0.02, 1.1, 0.006), M.carpet(0x18191c), cf, [-1.95, 0.68, 0]);
      put(G.box(0.6, 0.25, 0.9, 0.02), M.plastic(0x16171a, 0.85), cf, [-1.95, 0.55, 0]);
      for (const z of [-0.5, 0.5]) put(G.tube([V3(-1.75, 0.7, z), V3(-1.75, 0.73, z), V3(-1.65, 0.73, z), V3(-1.65, 0.7, z)], 0.006, 8, 5), M.steel(), cf);
    }

    // ================================================================== DOORS
    const glassSys = sys('glass');
    const doors = [];
    {
      const doorsSys = sys('doors');
      for (const s of [1, -1]) for (const front of [true, false]) {
        const r = front ? FD : RD, inD = front ? inFD : inRD, x0 = r[0], x1 = r[1];
        const posHe = front ? 'קדמית' : 'אחורית', sHe = s > 0 ? 'ימנית' : 'שמאלית';
        const hp = onBody(x0, vAtY(x0, 0.75, s));
        const pivot = V3(x0 - 0.01, 0.75, hp.z - s * 0.02);
        const door = part(doorsSys, { he: `דלת ${posHe} ${sHe}`, en: `${front ? 'Front' : 'Rear'} ${sideEn(s)} door`, mat: 'פלדה/אלומיניום + צבע', desc: `דלת ${posHe} ${sHe} עם חלון ללא מסגרת: הזכוכית יורדת מעט כשפותחים כדי להשתחרר מהאטם. ${front ? 'הידית שקועה ונפתחת בלחיצת אגודל.' : 'בדלתות האחוריות ידית פנימית מכנית נוספת לחירום.'}` });

<script type="module">
// Daily 3D Library — shared viewer.
// Loads window.L3D_META (from meta.json) and window.L3D_MODEL (model.js),
// builds the model with the kit and wraps it in the studio + Hebrew UI:
// systems / parts / specs panel, exploded view, x-ray, cutaway, model toggles,
// camera presets, hover + select with part cards, screenshot.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const SHOT = new URLSearchParams(location.search).has('shot');

async function waitForModel() {
  for (let i = 0; i < 600; i++) { if (window.L3D?.kit && window.L3D_MODEL) return; await new Promise((r) => setTimeout(r, 10)); }
  throw new Error('model script did not register window.L3D_MODEL');
}

function showError(err) {
  console.error(err);
  const box = $('.loading');
  if (box) { box.style.opacity = 1; box.hidden = false; box.querySelector('div').append(h('div', { class: 'err' }, String(err && err.stack || err))); }
  window.__error = String(err);
}
window.addEventListener('error', (e) => showError(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => showError(e.reason));

// A dark photo studio with soft-box strips: dark paint and glass pick up crisp
// highlight lines instead of mirroring a bright white room.
function studioEnvironment() {
  const env = new THREE.Scene();
  const bright = (k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide });
  const room = new THREE.Mesh(new THREE.SphereGeometry(30, 48, 24), new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true }));
  const pos = room.geometry.attributes.position, cols = [];
  for (let i = 0; i < pos.count; i++) { const t = (pos.getY(i) / 30 + 1) / 2; const c = 0.06 + 0.16 * Math.pow(1 - Math.abs(t - 0.45) * 1.6, 2); cols.push(c, c * 1.03, c * 1.1); }
  room.geometry.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  env.add(room);
  const floorM = new THREE.Mesh(new THREE.CircleGeometry(30, 48), bright(0.32)); floorM.rotation.x = -Math.PI / 2; floorM.position.y = -1; env.add(floorM);
  const box = (w, h, k, pos, rot) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), bright(k)); m.position.set(...pos); m.rotation.set(...rot); env.add(m); };
  for (const z of [-3.2, 0, 3.2]) box(14, 1.4, 5.5, [0, 9, z], [Math.PI / 2, 0, 0]);   // overhead strips
  box(2.2, 7, 2.6, [0, 3, 12], [0, Math.PI, 0]); box(2.2, 7, 2.6, [0, 3, -12], [0, 0, 0]); // side strips
  box(10, 4, 1.2, [14, 3, 0], [0, -Math.PI / 2, 0]); box(10, 4, 0.8, [-14, 3, 0], [0, Math.PI / 2, 0]); // front / rear fill
  return env;
}

  const visibleChain = (o) => { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; };
  renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; tip.hidden = true; });
  renderer.domElement.addEventListener('pointermove', (e) => {
    if (e.buttons || e.pointerType === 'touch') return;
    const now = performance.now(); if (now - lastHover < 50) return; lastHover = now;
    hoverPart = pick(e);
    if (hoverPart) {
      tip.innerHTML = ''; tip.append(h('i', { style: `background:${accentOf(hoverPart.userData.sysId)}` }), hoverPart.userData.part.he);
      tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.hidden = false; renderer.domElement.style.cursor = 'pointer';
    } else { tip.hidden = true; renderer.domElement.style.cursor = ''; }
  });
  renderer.domElement.addEventListener('pointerleave', () => { tip.hidden = true; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    const p = pick(e);
    // clicking the same part again climbs to its parent assembly
    if (p && selected && p === selected && p.userData.parentPart) select(p.userData.parentPart);
    else select(p);
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    const k = e.key.toLowerCase();
    if (k === 'e') setExplodeTarget(explodeTarget > 0.5 ? 0 : 1);
    else if (k === 'c') { cut = cut > 0 ? 0 : 0.5; cutIn.value = cut; cutOut.textContent = Math.round(cut * 100) + '%'; applyClip(); }
    else if (k === 'x') bX.click(); else if (k === 'w') bW.click(); else if (k === 'n') bN.click(); else if (k === 'r') bR.click();
    else if (k === 'f' && selected) focusOn(selected); else if (k === 'i' && selected) isolate(selected);
    else if (k === 'escape') { select(null); help.hidden = true; } else if (k === '0') goView(meta.startView || 'hero');
    else { const i = toggles.findIndex((t, n) => (t.key || String(n + 1)) === k); if (i >= 0) tgButtons[i].click(); }
  });

  window.addEventListener('resize', () => {
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    camera.aspect = stage.clientWidth / stage.clientHeight; camera.updateProjectionMatrix();
  });

  // ------------------------------------------------------------ loop
  const clock = new THREE.Clock();
  let frames = 0, fpsT = 0, fps = 0;
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
    if (camAnim) {
      const k = Math.min(1, (performance.now() - camAnim.start) / camAnim.ms), s = k * k * (3 - 2 * k);
      camera.position.lerpVectors(camAnim.p0, camAnim.p1, s); controls.target.lerpVectors(camAnim.t0, camAnim.t1, s);
      if (camAnim.f0 !== camAnim.f1) { camera.fov = camAnim.f0 + (camAnim.f1 - camAnim.f0) * s; camera.updateProjectionMatrix(); }
      if (k >= 1) camAnim = null;
    }
    if (Math.abs(explode - explodeTarget) > 1e-4) { explode += (explodeTarget - explode) * Math.min(1, dt * 6); applyExplode(); }
    for (const tg of toggles) {
      if (Math.abs(tg.t - tg.target) > 1e-4) { tg.t += Math.sign(tg.target - tg.t) * Math.min(Math.abs(tg.target - tg.t), dt / (tg.seconds || 1.1)); tg.apply(tg.t); }
    }
    for (const f of K.registry.frames) f(t, dt);
    controls.update();
    renderer.render(scene, camera);
    frames++; fpsT += dt;
    if (fpsT > 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; stats.textContent = `${parts.length} חלקים · ${meshCount.toLocaleString()} רשתות · ${Math.round(triCount).toLocaleString()} משולשים · ${fps} FPS`; }
    requestAnimationFrame(tick);
  }
  const ld = $('.loading'); ld.style.opacity = 0; setTimeout(() => (ld.hidden = true), 500);
  if (SHOT) {
    // screenshot harness (tools/check.cjs): no render loop, it calls __render() per shot
    window.__render = () => { for (const f of K.registry.frames) f(1.0, 0); controls.update(); renderer.render(scene, camera); };
    window.__render();
    window.__ready = true;
  } else {
    tick();
    requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; }));
  }
  window.__viewer = { scene, camera, controls, renderer, root, goView, setExplode: (v) => { explodeTarget = explode = v; applyExplode(); }, toggles, select, focusOn, parts, setCut: (v, a = 'z') => { cutAxis = a; cut = v; applyClip(true); }, setXray: (v) => { xray = v; setMaterials(); }, setNight: (v) => { night = v; applyNight(); } };
}

main().catch(showError);

</script>
</body>
</html>
