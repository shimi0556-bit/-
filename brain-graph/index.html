<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אטלס המוח</title>
<style>
:root {
  --bg: #0b1020; --panel: #121936; --panel2: #182049; --line: #26305f; --text: #e8ecff; --mute: #98a2cf;
  --accent: #6c8cff; --hot: #ffd45e; --ok: #4ade80; --err: #ff6b6b;
  --r: 10px; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Heebo, "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 700; }
button.danger { border-color: #7a3040; color: #ff9b9b; }
button.small { padding: 2px 8px; font-size: 12px; }
input, select, textarea { background: #0d1330; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { resize: vertical; min-height: 64px; }
label.f { display: block; margin: 10px 0 4px; color: var(--mute); font-size: 12px; }

.top { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: #0d1330; flex: none; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 18px; white-space: nowrap; }
.brand small { font-weight: 400; color: var(--mute); font-size: 12px; margin-inline-start: 8px; }
.logo { color: var(--accent); }
#search { max-width: 260px; }
.actions { margin-inline-start: auto; display: flex; gap: 6px; flex-wrap: wrap; }

main { flex: 1; display: flex; min-height: 0; }
.side { width: 350px; flex: none; border-inline-end: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 10px 4px; color: var(--mute); }
.tab.on { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
.panel { display: none; padding: 12px 14px 20px; overflow: auto; flex: 1; min-height: 0; }
.panel.on { display: block; }
.panel h3 { margin: 4px 0 8px; font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.row > button { flex: none; }
.muted { color: var(--mute); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); font-size: 12px; margin: 2px; background: var(--panel2); }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.log { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.log div { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
.log .err { border-color: #7a3040; color: #ffb0b0; }
.log .ok { border-color: #1e6a3d; }
.drophint { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 14px; text-align: center; color: var(--mute); cursor: pointer; margin-top: 10px; }
.drophint:hover { border-color: var(--accent); color: var(--text); }
.hr { height: 1px; background: var(--line); margin: 14px 0; }
.links { list-style: none; margin: 0; padding: 0; }
.links li { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #1c2550; }
.links li span.rel { color: var(--mute); font-size: 12px; }
.links li a { color: var(--text); cursor: pointer; text-decoration: none; flex: 1; }
.links li a:hover { color: var(--hot); }
.region-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: var(--panel2); }
.region-row.on { border-color: var(--hot); }
.region-row b { display: block; }
.region-row i { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex: none; }
.region-row .n { margin-inline-start: auto; color: var(--mute); }

.stage { position: relative; flex: 1; min-width: 0; background: radial-gradient(ellipse at 55% 40%, #141c42 0%, #0b1020 70%); overflow: hidden; }
#stage { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
.hint { position: absolute; top: 10px; inset-inline-start: 12px; color: var(--mute); font-size: 12px; pointer-events: none; }
.cmd { position: absolute; bottom: 12px; inset-inline: 14px; display: flex; gap: 8px; background: #0d1330ee; border: 1px solid var(--line); border-radius: 12px; padding: 8px; backdrop-filter: blur(6px); }
.cmd input { border: 0; background: transparent; }
.answer { position: absolute; bottom: 66px; inset-inline: 14px; max-height: 46%; overflow: auto; background: #0f1633f2; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(6px); }
.answer h4 { margin: 0 0 6px; font-size: 13px; color: var(--hot); }
.answer p { margin: 6px 0; white-space: pre-wrap; }
.answer .acts { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.answer .acts label { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
.answer .acts input { width: auto; margin-top: 4px; }
.answer .x { position: absolute; top: 6px; inset-inline-end: 8px; border: 0; background: none; font-size: 16px; }
.drop { position: absolute; inset: 0; background: #6c8cff22; border: 3px dashed var(--accent); display: grid; place-items: center; font-size: 22px; pointer-events: none; }
.drop[hidden], .answer[hidden] { display: none; }
.scan { animation: scan 1s ease-in-out infinite alternate; }
@keyframes scan { from { opacity: .5 } to { opacity: 1 } }

.toasts { position: fixed; top: 64px; inset-inline-end: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(420px, 90vw); }
.toast { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: 0 4px 18px #0008; }
.toast.err { border-color: #7a3040; }
.toast.ok { border-color: #1e6a3d; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; width: min(520px, 94vw); max-height: 90vh; overflow: auto; }
dialog::backdrop { background: #000a; }
dialog h3 { margin-top: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.exp { text-align: start; padding: 10px 12px; }
.exp b { display: block; }
.exp span { color: var(--mute); font-size: 12px; }

@media (max-width: 860px) {
  main { flex-direction: column-reverse; }
  .side { width: 100%; max-height: 38vh; border-inline-end: 0; border-top: 1px solid var(--line); }
  .stage { min-height: 48vh; }
  .top { padding: 6px 10px; gap: 6px; }
  .actions button { padding: 4px 9px; }
  .brand small { display: none; }
  #search { max-width: none; flex: 1; min-width: 140px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .scan { animation: none; } }

</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">◐</span> אטלס המוח <small id="stats"></small></div>
  <input id="search" type="search" placeholder="חיפוש בגרף…" autocomplete="off">
  <nav class="actions">
    <button id="btnAdd" class="primary" title="הוספת מסמך, קישור או טקסט">＋ מקור</button>
    <button id="btnOrganize" title="ה-AI עובר על כל הצמתים ומציע סידור וקשרים">✨ סדר הכל</button>
    <button id="btnExport" title="ייצוא ל-Photoshop, Canva ועוד">⇩ ייצוא</button>
    <button id="btnUndo" title="ביטול הפעולה האחרונה" disabled>↶</button>
    <button id="btnFit" title="מרכז את התצוגה">⌖</button>
    <button id="btnSettings" title="הגדרות AI">⚙</button>
  </nav>
</header>
<main>
  <aside class="side" id="side">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="add">הוספה</button>
      <button class="tab" data-tab="node">צומת</button>
      <button class="tab" data-tab="regions">אזורים</button>
    </div>
    <section class="panel on" id="tab-add"></section>
    <section class="panel" id="tab-node"></section>
    <section class="panel" id="tab-regions"></section>
  </aside>
  <section class="stage" id="stageWrap">
    <svg id="stage" role="img" aria-label="גרף ידע בצורת מוח"></svg>
    <div class="hint" id="hint"></div>
    <div class="answer" id="answer" hidden></div>
    <form class="cmd" id="cmd" autocomplete="off">
      <input id="cmdInput" placeholder="בקש מה-AI: 'מה הקשר בין ההרגלים שלי לערכים?'  ·  'הוסף רגש חדש'  ·  'ייצא ל-Photoshop'" aria-label="פקודה ל-AI">
      <button class="primary" id="cmdGo" type="submit">שלח</button>
      <button type="button" id="cmdStop" hidden>עצור</button>
    </form>
    <div class="drop" id="drop" hidden>שחרר כאן מסמכים להוספה למוח</div>
  </section>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script>
// Brain geometry, regions and node kinds. Front of the brain is on the right (RTL reading side).
window.BG = window.BG || {};
(function (BG) {
  'use strict';
  BG.W = 1000;
  BG.H = 700;

  BG.CEREBRUM = 'M196,330 C160,250 200,150 320,112 C430,80 560,76 660,96 C790,114 890,180 896,280 C900,350 872,402 820,418 C780,430 745,424 712,430 C700,450 680,470 640,474 C590,480 520,478 470,462 C420,448 380,440 330,432 C270,425 215,395 196,330 Z';
  BG.CEREBELLUM = 'M226,424 C262,414 392,428 440,452 C450,500 410,548 336,552 C262,554 206,500 226,424 Z';
  BG.STEM = 'M490,450 L580,450 C586,510 588,580 572,650 L506,650 C498,580 492,510 490,450 Z';
  // Procedural gyri: seeded random walks, clipped to the cortex when drawn.
  (function () {
    let s = 7;
    const rnd = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    BG.SULCI = [];
    for (let i = 0; i < 34; i++) {
      let x = 210 + rnd() * 680, y = 100 + rnd() * 360, a = rnd() * 6.283, d = 'M' + x.toFixed(0) + ',' + y.toFixed(0);
      for (let k = 0; k < 9; k++) { a += (rnd() - 0.5) * 1.5; x += Math.cos(a) * 13; y += Math.sin(a) * 13; d += ' L' + x.toFixed(0) + ',' + y.toFixed(0); }
      BG.SULCI.push(d);
    }
  })();

  // layer: 'surface' regions are clipped to the cortex, 'deep' regions are drawn on top as an x-ray overlay.
  BG.REGIONS = [
    { id: 'pfc', name: 'קליפת המצח', en: 'Prefrontal cortex', does: 'ערכים, מטרות, תכנון, שיקול דעת, זהות עצמית, קבלת החלטות', color: '#6c8cff', cx: 800, cy: 268, rx: 92, ry: 140, rot: 0, layer: 'surface' },
    { id: 'mot', name: 'האזור המוטורי', en: 'Motor cortex', does: 'פעולות מעשיות, ביצוע, תנועה, מעשים קונקרטיים', color: '#22d3c5', cx: 690, cy: 170, rx: 56, ry: 86, rot: 14, layer: 'surface' },
    { id: 'par', name: 'האונה הקודקודית', en: 'Parietal lobe', does: 'קשב וריכוז, מרחב וניווט, מספרים, שילוב בין חושים', color: '#ffc247', cx: 510, cy: 185, rx: 135, ry: 100, rot: 0, layer: 'surface' },
    { id: 'occ', name: 'האונה העורפית', en: 'Occipital lobe', does: 'ראייה, תמונות ודימויים, עיצוב, ויזואליה, וידאו', color: '#ff6fb5', cx: 285, cy: 275, rx: 100, ry: 140, rot: 0, layer: 'surface' },
    { id: 'tem', name: 'האונה הרקתית', en: 'Temporal lobe', does: 'שפה, ידע ועובדות, משמעות ומושגים, שמיעה, אנשים ושמות', color: '#9be34d', cx: 495, cy: 398, rx: 195, ry: 68, rot: 0, layer: 'surface' },
    { id: 'bg', name: 'גרעיני הבסיס', en: 'Basal ganglia', does: 'הרגלים, שגרות, דפוסי פעולה אוטומטיים, התמכרויות', color: '#ff8a3d', cx: 600, cy: 275, rx: 64, ry: 48, rot: 0, layer: 'deep' },
    { id: 'acc', name: 'קליפת החגורה', en: 'Anterior cingulate', does: 'מוטיבציה, מאמץ, התנגשות בין רצונות, ניטור שגיאות, דחיינות', color: '#b388ff', cx: 706, cy: 212, rx: 48, ry: 26, rot: -10, layer: 'deep' },
    { id: 'amy', name: 'האמיגדלה', en: 'Amygdala', does: 'רגשות, פחד, כעס, איום, המשמעות הרגשית של דברים', color: '#ff5a5a', cx: 688, cy: 395, rx: 42, ry: 30, rot: 0, layer: 'deep' },
    { id: 'hip', name: 'ההיפוקמפוס', en: 'Hippocampus', does: 'זיכרונות, אירועים וסיפורים אישיים, למידה חדשה', color: '#4cc9ff', cx: 545, cy: 372, rx: 62, ry: 28, rot: -12, layer: 'deep' },
    { id: 'hyp', name: 'ההיפותלמוס', en: 'Hypothalamus', does: 'צרכים בסיסיים, דחפים, גוף, רעב, שינה, בריאות', color: '#d4a373', cx: 632, cy: 330, rx: 44, ry: 24, rot: 0, layer: 'deep' },
    { id: 'cer', name: 'המוחון', en: 'Cerebellum', does: 'מיומנויות, תרגול, למידה מוטורית, דיוק, שיפור מתמיד', color: '#7be0a0', cx: 328, cy: 490, rx: 86, ry: 46, rot: 8, layer: 'surface', own: true },
    { id: 'stem', name: 'גזע המוח', en: 'Brainstem', does: 'ערנות, אנרגיה, עייפות, נשימה, מצב הגוף הבסיסי', color: '#9aa5b8', cx: 538, cy: 556, rx: 34, ry: 86, rot: 4, layer: 'surface', own: true }
  ];

  BG.KINDS = [
    { id: 'value', name: 'ערך', home: 'pfc' },
    { id: 'goal', name: 'מטרה / חזון', home: 'pfc' },
    { id: 'habit', name: 'הרגל / שגרה', home: 'bg' },
    { id: 'emotion', name: 'רגש', home: 'amy' },
    { id: 'memory', name: 'זיכרון / אירוע', home: 'hip' },
    { id: 'skill', name: 'מיומנות', home: 'cer' },
    { id: 'concept', name: 'מושג', home: 'tem' },
    { id: 'fact', name: 'עובדה / ידע', home: 'tem' },
    { id: 'person', name: 'אדם', home: 'tem' },
    { id: 'image', name: 'דימוי / ויזואל', home: 'occ' },
    { id: 'need', name: 'צורך / דחף', home: 'hyp' },
    { id: 'action', name: 'פעולה', home: 'mot' },
    { id: 'space', name: 'קשב / מרחב', home: 'par' },
    { id: 'tension', name: 'מתח / מוטיבציה', home: 'acc' },
    { id: 'state', name: 'מצב גוף', home: 'stem' },
    { id: 'doc', name: 'מסמך', home: 'tem', source: true },
    { id: 'url', name: 'אתר', home: 'tem', source: true }
  ];

  // Cheap keyword lexicon for the offline (no-AI) extractor.
  BG.LEXICON = {
    pfc: ['ערך', 'ערכים', 'מטרה', 'מטרות', 'תכנון', 'החלטה', 'אחריות', 'חזון', 'עקרון', 'זהות', 'goal', 'value', 'values', 'plan', 'decision', 'vision', 'principle'],
    bg: ['הרגל', 'הרגלים', 'שגרה', 'אוטומטי', 'התמכרות', 'חזרתי', 'habit', 'habits', 'routine', 'addiction', 'automatic'],
    amy: ['פחד', 'כעס', 'חרדה', 'שמחה', 'רגש', 'רגשות', 'בושה', 'אשמה', 'עצב', 'תסכול', 'fear', 'anger', 'anxiety', 'emotion', 'joy', 'shame', 'guilt', 'sadness'],
    hip: ['זיכרון', 'זיכרונות', 'זוכר', 'ילדות', 'אירוע', 'סיפור', 'memory', 'memories', 'remember', 'childhood', 'story', 'episode'],
    cer: ['תרגול', 'מיומנות', 'אימון', 'כושר', 'דיוק', 'practice', 'skill', 'training', 'precision'],
    occ: ['תמונה', 'צבע', 'עיצוב', 'ויזואלי', 'וידאו', 'ציור', 'image', 'color', 'design', 'visual', 'video', 'drawing'],
    hyp: ['שינה', 'רעב', 'אוכל', 'גוף', 'בריאות', 'ספורט', 'צורך', 'sleep', 'hunger', 'food', 'body', 'health', 'need'],
    mot: ['לעשות', 'פעולה', 'ביצוע', 'תנועה', 'action', 'execute', 'movement', 'doing'],
    par: ['קשב', 'ריכוז', 'מספר', 'מרחב', 'מפה', 'attention', 'focus', 'space', 'map', 'number'],
    acc: ['מוטיבציה', 'מאמץ', 'קונפליקט', 'התנגשות', 'דחיינות', 'motivation', 'effort', 'conflict', 'procrastination'],
    stem: ['ערנות', 'נשימה', 'עייפות', 'אנרגיה', 'alertness', 'breathing', 'fatigue', 'energy']
  };
})(window.BG);

// Graph state, persistence, undo and small helpers.
(function (BG) {
  'use strict';
  const LS_KEY = 'brain-graph:v1';
  const S = (BG.state = { nodes: [], edges: [], seq: 1 });
  const listeners = {};
  const byId = new Map();
  const byKey = new Map();
  let batchDepth = 0;
  let pendingEmit = false;
  let saveTimer = 0;
  const undoStack = [];

  BG.on = (ev, fn) => { (listeners[ev] = listeners[ev] || []).push(fn); };
  BG.emit = (ev, a) => { (listeners[ev] || []).forEach((f) => { try { f(a); } catch (e) { console.error(e); } }); };
  BG.regionById = (id) => BG.REGIONS.find((r) => r.id === id);
  BG.kindById = (id) => BG.KINDS.find((k) => k.id === id);
  BG.clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  BG.norm = (s) => String(s || '').toLowerCase().replace(/[֑-ׇ]/g, '').replace(/["'׳״`“”‘’]/g, '').replace(/\s+/g, ' ').trim();
  BG.key = (s) => { let k = BG.norm(s); if (k.length > 3 && k[0] === 'ה') k = k.slice(1); return k; };
  const keyOf = (n) => (BG.kindById(n.kind) && BG.kindById(n.kind).source ? 'src:' : '') + BG.key(n.label);

  BG.reindex = function () {
    byId.clear(); byKey.clear();
    for (const n of S.nodes) { byId.set(n.id, n); byKey.set(keyOf(n), n); n.deg = 0; }
    for (const e of S.edges) { const a = byId.get(e.from), b = byId.get(e.to); if (a) a.deg++; if (b) b.deg++; }
  };
  BG.nodeById = (id) => byId.get(id);
  BG.findByLabel = (label) => byKey.get(BG.key(label));
  BG.findSource = (label) => byKey.get('src:' + BG.key(label));
  // Resolve an id or a label the AI wrote to a node.
  BG.getNode = (ref) => (ref == null ? null : byId.get(String(ref)) || byKey.get(BG.key(ref)) || null);

  function change() {
    BG.reindex();
    if (batchDepth) { pendingEmit = true; return; }
    BG.emit('change');
    scheduleSave();
  }
  BG.batch = function (fn) {
    batchDepth++;
    try { fn(); } finally {
      batchDepth--;
      if (!batchDepth && pendingEmit) { pendingEmit = false; BG.reindex(); BG.emit('change'); scheduleSave(); }
    }
  };
  BG.touch = change;

  BG.addNode = function (o) {
    const kind = BG.kindById(o.kind) ? o.kind : 'concept';
    const region = BG.regionById(o.region) ? o.region : BG.kindById(kind).home;
    const r = BG.regionById(region);
    const a = Math.random() * Math.PI * 2, d = Math.random() * 0.6;
    const n = {
      id: 'n' + S.seq++, label: String(o.label || 'ללא שם').trim().slice(0, 80), kind, region,
      summary: String(o.summary || '').slice(0, 500), notes: String(o.notes || ''),
      x: o.x != null ? o.x : r.cx + Math.cos(a) * r.rx * d, y: o.y != null ? o.y : r.cy + Math.sin(a) * r.ry * d,
      vx: 0, vy: 0, count: 1, created: Date.now(), deg: 0
    };
    if (o.url && /^https?:\/\//i.test(String(o.url))) n.url = String(o.url).slice(0, 500);
    if (o.excerpt) n.excerpt = String(o.excerpt).slice(0, 1800);
    S.nodes.push(n);
    change();
    return n;
  };

  BG.addEdge = function (fromId, toId, rel, w) {
    if (!fromId || !toId || fromId === toId) return null;

    const ids = order.map((o) => o.id);
    BG.fitTo(ids.length > 1 ? ids : null);
    for (const step of order) { BG.pulse(step.id, step.via, 0.55); await BG.sleep(Math.max(80, Math.min(380, 3200 / order.length))); }
  }
  async function traverseFrom(seeds, title) {
    const order = traversal(seeds, 26, 2);
    await walk(order);
    showAnswer({ title, text: 'עברתי על ' + order.length + ' צמתים מסביב לנקודת ההתחלה. האזורים שהופעלו צבועים בגרף.', visited: order.map((o) => o.id), actions: [] });
  }

  function regionChips(ids) {
    const counts = new Map();
    ids.forEach((id) => { const n = BG.nodeById(id); if (n) counts.set(n.region, (counts.get(n.region) || 0) + 1); });
    return h('div', null, [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([rid, c]) => h('span', { class: 'chip' }, h('i', { style: 'background:' + BG.regionById(rid).color }), regionName(rid) + ' · ' + c)));
  }
  function describeAction(a) {
    switch (a.op) {
      case 'add_node': return 'הוסף "' + a.label + '" (' + kindName(a.kind) + ') באזור ' + regionName(a.region || (BG.kindById(a.kind) || {}).home);
      case 'link': return 'חבר "' + labelOf(a.from) + '" ← ' + (a.rel || 'קשור ל') + ' → "' + labelOf(a.to) + '"';
      case 'move': return 'העבר "' + labelOf(a.node) + '" אל ' + regionName(a.region) + (a.kind ? ' (' + kindName(a.kind) + ')' : '');
      case 'update': return 'עדכן תיאור של "' + labelOf(a.node) + '"';
      case 'delete': return 'מחק את "' + labelOf(a.node) + '"';
      case 'export': return 'ייצוא ' + String(a.format).toUpperCase();
      default: return null;
    }
  }
  const labelOf = (ref) => { const n = BG.getNode(ref); return n ? n.label : String(ref); };

  function cleanActions(list) {
    const ok = [];
    for (const a of Array.isArray(list) ? list : []) {
      if (!a || typeof a !== 'object') continue;
      if (a.op === 'add_node' && a.label) ok.push(a);
      else if (a.op === 'link' && BG.getNode(a.from) && BG.getNode(a.to)) ok.push(a);
      else if (a.op === 'move' && BG.getNode(a.node) && BG.regionById(a.region)) ok.push(a);
      else if (a.op === 'update' && BG.getNode(a.node) && typeof a.summary === 'string') ok.push(a);
      else if (a.op === 'delete' && BG.getNode(a.node)) ok.push(a);
      else if (a.op === 'export' && BG.exporters[a.format]) ok.push(a);
    }
    return ok.slice(0, 60);
  }

  function showAnswer({ title, text, visited, used, actions }) {
    answerBox.textContent = '';
    answerBox.hidden = false;
    const acts = cleanActions(actions);
    const hl = (used && used.length ? used : visited) || [];
    answerBox.append(
      h('button', { class: 'x', title: 'סגור וניקוי סימון', onclick: () => { answerBox.hidden = true; BG.clearActivation(); }, text: '✕' }),
      h('h4', { text: title || 'תשובה' }),
      h('p', { text }),
      h('div', { class: 'muted', text: 'אזורי זיכרון שנעשה בהם שימוש:' }), regionChips(hl)
    );
    if (acts.length) {
      const boxes = acts.map((a) => { const cb = h('input', { type: 'checkbox' }); cb.checked = a.op !== 'delete'; return cb; });
      answerBox.append(h('div', { class: 'acts' }, h('b', { text: 'הצעות לשינוי בגרף – סמן מה להחיל:' }),
        acts.map((a, i) => h('label', null, boxes[i], describeAction(a))),
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', { class: 'primary', onclick: async () => { await applyActions(acts.filter((_, i) => boxes[i].checked)); answerBox.hidden = true; }, text: 'החל נבחרים' }),
          h('button', { onclick: () => { answerBox.hidden = true; }, text: 'התעלם' }))));
    }
  }

  async function applyActions(list) {
    if (!list.length) return;
    const exports = list.filter((a) => a.op === 'export'), edits = list.filter((a) => a.op !== 'export');
    const touched = new Set();
    if (edits.length) {
      BG.snapshot();
      BG.batch(() => {
        for (const a of edits) {
          if (a.op === 'add_node') {
            let n = BG.findByLabel(a.label);
            if (!n) n = BG.addNode({ label: a.label, kind: a.kind, region: a.region, summary: a.summary });
            touched.add(n.id);
            for (const l of a.links || []) { const t = BG.getNode(l.to); if (t) BG.addEdge(n.id, t.id, l.rel, 1); }
          } else if (a.op === 'link') { const x = BG.getNode(a.from), y = BG.getNode(a.to); if (x && y) { BG.addEdge(x.id, y.id, a.rel, a.w); touched.add(x.id); touched.add(y.id); } }
          else if (a.op === 'move') { const n = BG.getNode(a.node); if (n) { n.region = a.region; if (BG.kindById(a.kind)) n.kind = a.kind; touched.add(n.id); } }
          else if (a.op === 'update') { const n = BG.getNode(a.node); if (n) { n.summary = a.summary.slice(0, 500); touched.add(n.id); } }
          else if (a.op === 'delete') { const n = BG.getNode(a.node); if (n) BG.removeNode(n.id); }
        }
      });
      BG.layout.kick(1);
      BG.toast('הוחלו ' + edits.length + ' שינויים (↶ מבטל)', 'ok');
      if (touched.size) lightUp([...touched], 'new');
    }
    for (const a of exports) { try { BG.toast('הורד: ' + await BG.runExport(a.format), 'ok'); } catch (e) { BG.toast('הייצוא נכשל: ' + e.message, 'err'); } }
  }

  async function runCommand(request) {
    if (busy || !request.trim()) return;
    if (!BG.state.nodes.length) return BG.toast('הגרף ריק – הוסף קודם מקורות או טען דוגמה');
    setBusy(true);
    abortCtl = new AbortController();
    const hint = $('#hint');
    try {
      let seeds = [], intent = 'answer', note = '';
      if (BG.ai.ready()) {
        hint.textContent = 'ה-AI סורק את המוח…'; hint.classList.add('scan');
        const r = await BG.ai.seeds(request, indexFor(request), abortCtl.signal);
        seeds = (r.seeds || []).map((s) => { const n = BG.getNode(s); return n && n.id; }).filter(Boolean);
        intent = r.intent || 'answer'; note = r.note || '';
      } else seeds = localSeeds(request);
      hint.classList.remove('scan');
      if (!seeds.length) seeds = localSeeds(request);
      if (!seeds.length && !(BG.ai.ready() && intent !== 'answer')) { hint.textContent = ''; setBusy(false); return showAnswer({ title: 'לא נמצא', text: 'לא מצאתי בגרף משהו שקשור לבקשה.' + (BG.ai.ready() ? '' : ' (בלי מפתח AI החיפוש הוא לפי מילים בלבד.)'), visited: [], actions: [] }); }
      hint.textContent = note || 'עובר על האזורים הרלוונטיים…';
      const order = traversal(seeds, 26, 2);
      await walk(order);
      if (!BG.ai.ready()) {
        showAnswer({ title: 'בלי מפתח AI', text: 'סימנתי את הצמתים והאזורים הקרובים למילים בבקשה. כדי שה-AI יענה, יסדר וייצא – הוסף מפתח API בהגדרות (⚙).', visited: order.map((o) => o.id), actions: [] });
        return;
      }
      hint.textContent = 'ה-AI קורא את מה שנמצא ועונה…'; hint.classList.add('scan');
      const vis = order.map((o) => BG.nodeById(o.id));
      const idset = new Set(vis.map((v) => v.id));
      const edges = BG.state.edges.filter((e) => idset.has(e.from) && idset.has(e.to)).map((e) => ({ from: e.from, to: e.to, rel: e.rel }));
      const res = await BG.ai.work(request, vis, edges, abortCtl.signal);
      hint.classList.remove('scan');
      const used = (res.used || []).map((u) => { const n = BG.getNode(u); return n && n.id; }).filter(Boolean);
      if (used.length) { BG.clearActivation(); used.forEach((id) => BG.pulse(id, null, 0.8)); }
      showAnswer({ title: intent === 'modify' ? 'הצעה לשינוי' : 'תשובה', text: String(res.answer || '').trim() || '(ה-AI לא כתב תשובה)', visited: order.map((o) => o.id), used, actions: res.actions });
    } catch (e) {
      if (e.name === 'AbortError') BG.toast('הופסק');
      else { BG.toast(e.message, 'err'); }
    } finally {
      hint.classList.remove('scan'); hint.textContent = ''; renderStats(); setBusy(false);
    }
  }
  $('#cmd').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#cmdInput').value; $('#cmdInput').value = ''; runCommand(v); });

  async function organizeAll() {
    if (busy) return;
    if (!BG.ai.ready()) return BG.toast('סידור אוטומטי דורש מפתח API (⚙)', 'err');
    const nodes = BG.state.nodes.filter((n) => !BG.kindById(n.kind).source);
    if (nodes.length < 2) return BG.toast('אין מספיק צמתים לסידור');
    setBusy(true); abortCtl = new AbortController();
    const actions = [], labels = BG.state.nodes.map((n) => n.label), hint = $('#hint');
    try {
      BG.clearActivation();
      for (let i = 0; i < nodes.length; i += 50) {
        const batch = nodes.slice(i, i + 50);
        hint.textContent = 'ה-AI עובר על הצמתים ' + (i + 1) + '–' + (i + batch.length) + ' מתוך ' + nodes.length + '…'; hint.classList.add('scan');
        batch.forEach((n) => BG.pulse(n.id, null, 0.5));
        const r = await BG.ai.organize(batch, labels, abortCtl.signal);
        for (const m of r.moves || []) { const n = BG.getNode(m.id); if (n && BG.regionById(m.region) && (m.region !== n.region || (m.kind && m.kind !== n.kind))) actions.push({ op: 'move', node: n.id, region: m.region, kind: m.kind }); }
        for (const l of r.links || []) actions.push({ op: 'link', from: l.from, to: l.to, rel: l.rel, w: l.w });
        BG.clearActivation();
      }
      showAnswer({ title: 'סידור מחדש', text: actions.length ? 'ה-AI עבר על ' + nodes.length + ' צמתים והציע ' + actions.length + ' שינויים.' : 'לא נמצא מה לשפר – הכל נראה במקום.', visited: nodes.map((n) => n.id), used: [], actions });
      BG.clearActivation();
    } catch (e) { if (e.name !== 'AbortError') BG.toast(e.message, 'err'); }
    finally { hint.classList.remove('scan'); hint.textContent = ''; setBusy(false); }
  }

  // ---------- demo data ----------

    nodes: [
      ['ערך', 'יצירתיות', 'value', 'pfc', 'הצורך ליצור דברים חדשים ולא לחזור על אחרים'],
      ['ערך', 'מצוינות', 'value', 'pfc', 'לעשות כל דבר ברמה הגבוהה ביותר שאפשר'],
      ['ערך', 'חופש', 'value', 'pfc', 'לבחור לבד את הדרך, הזמן והעבודה'],
      ['מטרה', 'לבנות מוצר משלי', 'goal', 'pfc', 'להשיק אפליקציה שאנשים משתמשים בה'],
      ['הרגל', 'קפה ומסך בבוקר', 'habit', 'bg', 'פעולה אוטומטית שפותחת את היום בגלילה'],
      ['הרגל', 'כתיבה יומית', 'habit', 'bg', 'עשר דקות כתיבה לפני שהעולם מתעורר'],
      ['הרגל', 'דחיית משימות קשות', 'habit', 'bg', 'מעבר למשימה קלה כשמשהו מרגיש גדול'],
      ['רגש', 'חרדת ביצוע', 'emotion', 'amy', 'פחד שהתוצר לא יהיה טוב מספיק'],
      ['רגש', 'התלהבות', 'emotion', 'amy', 'דחיפה חזקה בתחילת רעיון חדש'],
      ['רגש', 'תסכול', 'emotion', 'amy', 'כשהתוצאה רחוקה ממה שדמיינתי'],
      ['זיכרון', 'הפרויקט הראשון שהצליח', 'memory', 'hip', 'הרגע שבו משהו שבניתי עבד אצל אחרים'],
      ['זיכרון', 'ביקורת מהמורה', 'memory', 'hip', 'הערה חדה שנשארה שנים'],
      ['מיומנות', 'תכנות', 'skill', 'cer', 'שליטה גוברת בבניית כלים בעצמי'],
      ['מיומנות', 'עיצוב ויזואלי', 'skill', 'cer', 'בחירת צבעים וקומפוזיציה'],
      ['ידע', 'גרפים וקשרים', 'concept', 'tem', 'ייצוג ידע כרשת של רעיונות מקושרים'],
      ['ידע', 'מערכת העצבים', 'fact', 'tem', 'תפקידים שונים לאזורים שונים במוח'],
      ['אדם', 'שותף לפרויקט', 'person', 'tem', 'מי שמסתכל על הדברים בזווית אחרת'],
      ['דימוי', 'מפת מוח כציור', 'image', 'occ', 'תמונה שבה כל אזור צבוע לפי תפקידו'],
      ['צורך', 'שינה סדירה', 'need', 'hyp', 'בלי שינה הכל נראה קשה יותר'],
      ['צורך', 'תנועה', 'need', 'hyp', 'הליכה פותחת את הראש'],
      ['פעולה', 'שליחת הגרסה הראשונה', 'action', 'mot', 'לפרסם לפני שהכל מושלם'],
      ['קשב', 'עבודה ממוקדת', 'space', 'par', 'מסך אחד, חלון אחד, שעה אחת'],
      ['מתח', 'שלמות מול מהירות', 'tension', 'acc', 'הרצון להשלים מתנגש בצורך להתקדם'],
      ['מצב', 'עייפות אחה״צ', 'state', 'stem', 'ירידת אנרגיה אחרי הצהריים']
    ],
    links: [
      ['מצוינות', 'חרדת ביצוע', 'מעוררת'], ['חרדת ביצוע', 'דחיית משימות קשות', 'מובילה ל'], ['דחיית משימות קשות', 'תסכול', 'יוצרת'],
      ['יצירתיות', 'התלהבות', 'מציתה'], ['התלהבות', 'לבנות מוצר משלי', 'מזינה'], ['חופש', 'לבנות מוצר משלי', 'מניע'],
      ['כתיבה יומית', 'יצירתיות', 'מזינה'], ['קפה ומסך בבוקר', 'עבודה ממוקדת', 'מפריע ל'], ['עבודה ממוקדת', 'תכנות', 'מאפשרת'],
      ['ביקורת מהמורה', 'חרדת ביצוע', 'מקור של'], ['הפרויקט הראשון שהצליח', 'מצוינות', 'חיזק את'], ['הפרויקט הראשון שהצליח', 'התלהבות', 'מעורר'],
      ['שלמות מול מהירות', 'מצוינות', 'נובע מ'], ['שלמות מול מהירות', 'שליחת הגרסה הראשונה', 'מעכב'], ['שליחת הגרסה הראשונה', 'לבנות מוצר משלי', 'מקדמת'],
      ['גרפים וקשרים', 'מערכת העצבים', 'מקביל ל'], ['מפת מוח כציור', 'גרפים וקשרים', 'מציגה'], ['עיצוב ויזואלי', 'מפת מוח כציור', 'יוצר'],
      ['שותף לפרויקט', 'שלמות מול מהירות', 'מאזן'], ['שינה סדירה', 'עייפות אחה״צ', 'מפחיתה'], ['תנועה', 'עבודה ממוקדת', 'משפרת'], ['עייפות אחה״צ', 'דחיית משימות קשות', 'מגבירה'],
      ['תכנות', 'לבנות מוצר משלי', 'כלי ל'], ['כתיבה יומית', 'קפה ומסך בבוקר', 'מתחרה ב']
    ]
  };
  function loadDemo() {
    BG.snapshot();
    BG.batch(() => {
      const m = new Map();
      for (const [, label, kind, region, summary] of DEMO.nodes) m.set(label, BG.addNode({ label, kind, region, summary }));
      for (const [a, b, rel] of DEMO.links) if (m.get(a) && m.get(b)) BG.addEdge(m.get(a).id, m.get(b).id, rel, 2);
    });
    BG.layout.kick(1);
    BG.toast('נטענה דוגמה – נסה: "מה גורם לי לדחות משימות?"', 'ok');
  }
  BG.loadDemo = loadDemo;

  function renderEmpty() {
    const has = BG.state.nodes.length > 0;
    const tail = $('#tab-add .demo');
    if (tail) tail.remove();
    if (!has) $('#tab-add').prepend(h('div', { class: 'demo drophint', style: 'margin:0 0 10px', onclick: loadDemo, text: 'הגרף ריק – לחץ לטעינת דוגמה קטנה (24 צמתים)' }));
  }

  // ---------- init ----------
  BG.on('change', () => { renderStats(); renderRegionsPanel(); if (BG.view.selected && !BG.nodeById(BG.view.selected)) BG.view.selected = null; renderNodePanel(); renderEmpty(); });
  BG.ai.loadSettings();
  BG.initView($('#stage'));
  renderAddPanel();
  renderNodePanel();
  renderRegionsPanel();
  if (!BG.restore()) { renderStats(); renderEmpty(); }
  BG.layout.kick(1);
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); BG.undo(); }
    if (e.key === 'Escape') { BG.clearActivation(); BG.select(null); }
  });
})(window.BG);

</script>
