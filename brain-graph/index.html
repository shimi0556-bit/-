<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אטלס המוח</title>
<style>
:root {
  --bg: #16161a; --panel: #1e1e24; --panel2: #25252d; --line: #33333d; --text: #e6e6ea; --mute: #9a9aa6;
  --accent: #8b7cf6; --hot: #ffd45e; --ok: #4ade80; --err: #ff6b6b;
  --r: 10px; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Heebo, "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 700; }
button.danger { border-color: #7a3040; color: #ff9b9b; }
button.small { padding: 2px 8px; font-size: 12px; }
input, select, textarea { background: #18181d; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { resize: vertical; min-height: 64px; }
label.f { display: block; margin: 10px 0 4px; color: var(--mute); font-size: 12px; }

.top { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 18px; white-space: nowrap; }
.brand small { font-weight: 400; color: var(--mute); font-size: 12px; margin-inline-start: 8px; }
.logo { color: var(--accent); }
#search { max-width: 260px; }
.actions { margin-inline-start: auto; display: flex; gap: 6px; flex-wrap: wrap; }

main { flex: 1; display: flex; min-height: 0; }
.side { width: 350px; flex: none; border-inline-end: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 10px 4px; color: var(--mute); }
.tab.on { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
.panel { display: none; padding: 12px 14px 20px; overflow: auto; flex: 1; min-height: 0; }
.panel.on { display: block; }
.panel h3 { margin: 4px 0 8px; font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.row > button { flex: none; }
.muted { color: var(--mute); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); font-size: 12px; margin: 2px; background: var(--panel2); }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.log { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.log div { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
.log .err { border-color: #7a3040; color: #ffb0b0; }
.log .ok { border-color: #1e6a3d; }
.drophint { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 14px; text-align: center; color: var(--mute); cursor: pointer; margin-top: 10px; }
.drophint:hover { border-color: var(--accent); color: var(--text); }
.hr { height: 1px; background: var(--line); margin: 14px 0; }
.links { list-style: none; margin: 0; padding: 0; }
.links li { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #1c2550; }
.links li span.rel { color: var(--mute); font-size: 12px; }
.links li a { color: var(--text); cursor: pointer; text-decoration: none; flex: 1; }
.links li a:hover { color: var(--hot); }
.region-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: var(--panel2); }
.region-row.on { border-color: var(--hot); }
.region-row b { display: block; }
.region-row i { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex: none; }
.region-row .n { margin-inline-start: auto; color: var(--mute); }

.stage { position: relative; flex: 1; min-width: 0; background: #16161a; overflow: hidden; }
#stage { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; cursor: grab; }
#stage.drag { cursor: grabbing; }
.hint { position: absolute; top: 10px; inset-inline-start: 12px; color: var(--mute); font-size: 12px; pointer-events: none; }
.cmd { position: absolute; bottom: 12px; inset-inline: 14px; display: flex; gap: 8px; background: #0d1330ee; border: 1px solid var(--line); border-radius: 12px; padding: 8px; backdrop-filter: blur(6px); }
.cmd input { border: 0; background: transparent; }
.answer { position: absolute; bottom: 66px; inset-inline: 14px; max-height: 46%; overflow: auto; background: #0f1633f2; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(6px); }
.answer h4 { margin: 0 0 6px; font-size: 13px; color: var(--hot); }
.answer p { margin: 6px 0; white-space: pre-wrap; }
.answer .acts { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.answer .acts label { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
.answer .acts input { width: auto; margin-top: 4px; }
.answer .x { position: absolute; top: 6px; inset-inline-end: 8px; border: 0; background: none; font-size: 16px; }
.drop { position: absolute; inset: 0; background: #6c8cff22; border: 3px dashed var(--accent); display: grid; place-items: center; font-size: 22px; pointer-events: none; }
.drop[hidden], .answer[hidden] { display: none; }
.scan { animation: scan 1s ease-in-out infinite alternate; }
@keyframes scan { from { opacity: .5 } to { opacity: 1 } }

.toasts { position: fixed; top: 64px; inset-inline-end: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(420px, 90vw); }
.toast { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: 0 4px 18px #0008; }
.toast.err { border-color: #7a3040; }
.toast.ok { border-color: #1e6a3d; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; width: min(520px, 94vw); max-height: 90vh; overflow: auto; }
dialog::backdrop { background: #000a; }
dialog h3 { margin-top: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.exp { text-align: start; padding: 10px 12px; }
.exp b { display: block; }
.exp span { color: var(--mute); font-size: 12px; }

@media (max-width: 860px) {
  main { flex-direction: column-reverse; }
  .side { width: 100%; max-height: 38vh; border-inline-end: 0; border-top: 1px solid var(--line); }
  .stage { min-height: 48vh; }
  .top { padding: 6px 10px; gap: 6px; }
  .actions button { padding: 4px 9px; }
  .brand small { display: none; }
  #search { max-width: none; flex: 1; min-width: 140px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .scan { animation: none; } }

.bubble { border-radius: 12px; padding: 8px 12px; margin: 8px 0; max-width: 92%; border: 1px solid var(--line); white-space: pre-wrap; }
.bubble b { display: block; font-size: 12px; margin-bottom: 2px; }
.bubble.atlas { background: #172052; margin-inline-end: auto; border-color: #3a4a96; }
.bubble.mapat { background: #2a1f3d; margin-inline-start: auto; border-color: #5b3f86; }
.bubble.sys { background: transparent; border-style: dashed; color: var(--mute); font-size: 12.5px; max-width: 100%; }
.frame { width: 100%; height: 260px; border: 1px solid var(--line); border-radius: 10px; background: #fff; margin-top: 8px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #666; margin-inline-end: 6px; }
.dot.on { background: var(--ok); }

.legend { position: absolute; top: 10px; inset-inline-end: 12px; display: flex; flex-direction: column; gap: 2px; align-items: stretch; max-height: 55%; overflow: auto; }
.lg { display: flex; align-items: center; gap: 7px; background: #0d1330cc; border: 1px solid transparent; border-radius: 8px; padding: 2px 9px; font-size: 12px; color: var(--mute); text-align: start; }
.lg i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.lg span { margin-inline-start: auto; opacity: .6; padding-inline-start: 8px; }
.lg:hover, .lg.on { color: var(--text); border-color: var(--line); }
@media (max-width: 860px) { .legend { display: none; } }

.hud { position: absolute; top: 10px; inset-inline-end: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
.hud button { font-size: 12px; background: rgba(30,30,36,.9); padding: 4px 9px; }
.hud button.on { background: #2d2a45; border-color: var(--accent); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; max-width: 260px; display: none; z-index: 3; }
.tip span { color: var(--mute); }
.legend { top: 46px !important; }

</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">◐</span> אטלס המוח <small id="stats"></small></div>
  <input id="search" type="search" placeholder="חיפוש בגרף…" autocomplete="off">
  <nav class="actions">
    <button id="btnAdd" class="primary" title="הוספת מסמך, קישור או טקסט">＋ מקור</button>
    <button id="btnOrganize" title="ה-AI עובר על כל הצמתים ומציע סידור וקשרים">✨ סדר הכל</button>
    <button id="btnExport" title="ייצוא ל-Photoshop, Canva ועוד">⇩ ייצוא</button>
    <button id="btnUndo" title="ביטול הפעולה האחרונה" disabled>↶</button>
    <button id="btnFit" title="מרכז את התצוגה">⌖</button>
    <button id="btnSettings" title="הגדרות AI">⚙</button>
  </nav>
</header>
<main>
  <aside class="side" id="side">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="add">הוספה</button>
      <button class="tab" data-tab="node">צומת</button>
      <button class="tab" data-tab="regions">אזורים</button>
      <button class="tab" data-tab="chat">שיחה</button>
    </div>
    <section class="panel on" id="tab-add"></section>
    <section class="panel" id="tab-node"></section>
    <section class="panel" id="tab-regions"></section>
    <section class="panel" id="tab-chat"></section>
  </aside>
  <section class="stage" id="stageWrap">
    <canvas id="stage" role="img" aria-label="גרף ידע בצורת מוח"></canvas>
    <div class="hud" id="hud">
      <button data-v="side" title="מבט מהצד">צד</button><button data-v="front" title="מבט מלפנים">חזית</button><button data-v="back" title="מבט מאחור">אחור</button><button data-v="top" title="מבט מלמעלה">מלמעלה</button><button data-v="bottom" title="מבט מלמטה">מלמטה</button><button id="autoBtn" title="סיבוב אוטומטי">⟳ סיבוב</button>
    </div>
    <div id="tip" class="tip"></div>
    <div class="hint" id="hint"></div>
    <div class="legend" id="legend"></div>
    <div class="answer" id="answer" hidden></div>
    <form class="cmd" id="cmd" autocomplete="off">
      <input id="cmdInput" placeholder="בקש מה-AI: 'מה הקשר בין ההרגלים שלי לערכים?'  ·  'הוסף רגש חדש'  ·  'ייצא ל-Photoshop'" aria-label="פקודה ל-AI">
      <button class="primary" id="cmdGo" type="submit">שלח</button>
      <button type="button" id="cmdStop" hidden>עצור</button>
    </form>
    <div class="drop" id="drop" hidden>שחרר כאן מסמכים להוספה למוח</div>
  </section>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script>
// Brain geometry, regions and node kinds. Front of the brain is on the right (RTL reading side).
window.BG = window.BG || {};
(function (BG) {
  'use strict';
  BG.W = 1000;
  BG.H = 700;

  BG.CEREBRUM = 'M196,330 C160,250 200,150 320,112 C430,80 560,76 660,96 C790,114 890,180 896,280 C900,350 872,402 820,418 C780,430 745,424 712,430 C700,450 680,470 640,474 C590,480 520,478 470,462 C420,448 380,440 330,432 C270,425 215,395 196,330 Z';
  BG.CEREBELLUM = 'M226,424 C262,414 392,428 440,452 C450,500 410,548 336,552 C262,554 206,500 226,424 Z';
  BG.STEM = 'M490,450 L580,450 C586,510 588,580 572,650 L506,650 C498,580 492,510 490,450 Z';
  // Procedural gyri: seeded random walks, clipped to the cortex when drawn.
  (function () {
    let s = 7;
    const rnd = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    BG.SULCI = [];
    for (let i = 0; i < 34; i++) {
      let x = 210 + rnd() * 680, y = 100 + rnd() * 360, a = rnd() * 6.283, d = 'M' + x.toFixed(0) + ',' + y.toFixed(0);
      for (let k = 0; k < 9; k++) { a += (rnd() - 0.5) * 1.5; x += Math.cos(a) * 13; y += Math.sin(a) * 13; d += ' L' + x.toFixed(0) + ',' + y.toFixed(0); }
      BG.SULCI.push(d);
    }
  })();

  // 30 regions. layer 'surface': a territory of the cortex (weighted Voronoi around a point or a strip `seg`);
  // 'deep': an ellipse carved out of the cortex (limbic / subcortical); 'own': hindbrain parts that have their own outline.
  // cx/cy/rx/ry/rot also give the size of the glow that lights up while the AI reads the region.
  const mk = (id, name, does, color, layer, cx, cy, rx, ry, extra) => Object.assign({ id, name, does, color, layer, cx, cy, rx, ry, rot: 0, w: 1 }, extra || {});
  BG.REGIONS = [
    // frontal (blues)
    mk('fpc', 'קוטב המצח', 'מטרות ארוכות טווח, חזון, זהות עצמית, תכנון העתיד', '#4f6bff', 'surface', 868, 270, 48, 80),
    mk('dlpfc', 'קליפת המצח הגבית', 'תכנון, זיכרון עבודה, חשיבה לוגית, ארגון והחלטות מחושבות', '#6f8cff', 'surface', 800, 180, 60, 55, { seg: [770, 130, 830, 235] }),
    mk('vmpfc', 'קליפת המצח התחתונה', 'ערכים, שיקול דעת מוסרי, הערכת תגמול וסיכון, החלטות רגשיות', '#8aa6ff', 'surface', 815, 372, 55, 38),
    mk('broca', 'אזור ברוקה', 'ניסוח ודיבור, הבעת מחשבות ורגשות במילים', '#5aa0ff', 'surface', 748, 332, 40, 32, { w: 0.8 }),
    mk('pmc', 'אזור קדם־מוטורי', 'תכנון תנועה, רצפי פעולות, יוזמה לפני ביצוע', '#4a86e8', 'surface', 712, 185, 28, 70, { seg: [720, 120, 705, 250], w: 0.6 }),
    mk('m1', 'קליפה מוטורית', 'ביצוע פעולה, תנועה, מעשים קונקרטיים', '#3b6fd4', 'surface', 652, 195, 26, 100, { seg: [665, 105, 640, 290], w: 0.55 }),
    // parietal (ambers)
    mk('s1', 'קליפה תחושתית', 'תחושות מגע וגוף, כאב, תחושה פיזית של מצבים', '#ffb84a', 'surface', 592, 192, 26, 98, { seg: [605, 100, 580, 285], w: 0.55 }),
    mk('spl', 'אונה קודקודית עליונה', 'קשב וריכוז, מרחב וניווט, תיאום עין־יד', '#ffc968', 'surface', 520, 140, 60, 40, { w: 1.1 }),
    mk('ipl', 'אונה קודקודית תחתונה', 'מספרים וחישוב, קריאה, שילוב בין חושים ומשמעות', '#f5a623', 'surface', 440, 210, 50, 48),
    mk('precun', 'פרקונאוס', 'התבוננות פנימית, דמיון, שוטטות מחשבות, תחושת עצמי', '#e8931a', 'surface', 505, 215, 36, 30, { w: 0.7 }),
    mk('tpj', 'צומת רקתי־קודקודי', 'הבנת אחרים, אמפתיה, נקודת מבט, גבול בין עצמי לאחר', '#ffd27f', 'surface', 455, 305, 38, 32, { w: 0.8 }),
    // occipital (pinks)
    mk('v1', 'קליפה חזותית ראשית', 'ראייה, תמונות, צבעים ותנועה חזותית', '#ff6fb5', 'surface', 230, 305, 28, 70, { seg: [232, 240, 230, 370], w: 0.7 }),
    mk('v2', 'קליפה חזותית משנית', 'זיהוי חפצים, פנים וצורות, דימויים ועיצוב', '#ff8fc8', 'surface', 300, 290, 42, 62, { w: 0.9 }),
    // temporal (greens)
    mk('wern', 'אזור ורניקה', 'הבנת שפה ושמיעה, משמעות של מילים ומשפטים', '#8fe35a', 'surface', 410, 380, 36, 28, { w: 0.8 }),
    mk('mtg', 'אונה רקתית אמצעית', 'ידע ועובדות, משמעות של מושגים, שמות', '#6fd04a', 'surface', 500, 410, 50, 30, { w: 0.9 }),
    mk('itg', 'אונה רקתית תחתונה', 'זיהוי פנים ואנשים, קטגוריות, ידע חזותי על העולם', '#a8e87a', 'surface', 585, 445, 46, 24, { w: 0.8 }),
    mk('tpole', 'קוטב רקתי', 'זיכרון אישי וחברתי, הכרה של אנשים קרובים ושל משמעות רגשית', '#4fc46a', 'surface', 690, 440, 36, 24, { w: 0.7 }),
    mk('insula', 'אינסולה', 'תחושות פנימיות בגוף, מודעות רגשית, גועל, חמלה', '#34d6a0', 'deep', 612, 378, 32, 17, { zf: [0.45, 0.7] }),
    // limbic / medial (purples & reds)
    mk('acc', 'קליפת החגורה הקדמית', 'מוטיבציה, מאמץ, התנגשות בין רצונות, ניטור שגיאות', '#b388ff', 'deep', 715, 212, 42, 20, { rot: -10 , zf: [0, 0.22] }),
    mk('pcc', 'קליפת החגורה האחורית', 'זיכרון אוטוביוגרפי, רפלקציה עצמית, חיבור בין זיכרון לעצמי', '#9a6ff0', 'deep', 505, 255, 34, 16, { zf: [0, 0.22] }),
    mk('amy', 'אמיגדלה', 'פחד, כעס, איום, המשמעות הרגשית של דברים', '#ff5a5a', 'deep', 692, 392, 30, 21, { zf: [0.45, 0.7] }),
    mk('hip', 'היפוקמפוס', 'זיכרונות ואירועים, סיפורים אישיים, למידה חדשה', '#4cc9ff', 'deep', 535, 372, 46, 17, { rot: -12 , zf: [0.45, 0.7] }),
    // subcortical (oranges & browns)
    mk('str', 'סטריאטום (גרעיני הבסיס)', 'הרגלים, שגרות, דפוסי פעולה אוטומטיים', '#ff8a3d', 'deep', 630, 262, 52, 30, { zf: [0.15, 0.4] }),
    mk('nac', 'גרעין האקומבנס', 'תגמול, חשק, הנאה, התמכרות', '#ff6a5a', 'deep', 702, 306, 28, 17, { zf: [0.15, 0.4] }),
    mk('thal', 'תלמוס', 'סינון מידע, קשב, מעבר בין מצבי ערנות', '#e0a060', 'deep', 560, 305, 38, 25, { zf: [0, 0.22] }),
    mk('hyp', 'היפותלמוס', 'צרכים בסיסיים, דחפים, רעב, שינה, בריאות הגוף', '#d4a373', 'deep', 622, 340, 34, 18, { zf: [0, 0.22] }),
    // hindbrain (teal & greys) - own outlines
    mk('cer', 'המוחון', 'מיומנויות, תרגול, למידה מוטורית, דיוק ושיפור מתמיד', '#7be0a0', 'own', 328, 490, 86, 46, { rot: 8 }),

      h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'danger', onclick: () => { if (confirm('לנקות את כל הגרף?')) { BG.snapshot(); BG.clearAll(); dlg.close(); } }, text: 'נקה הכל' }), h('button', { onclick: () => dlg.close(), text: 'סגור' }))

  // ---------- AI command: walk the memory, colour what is touched, then do the job ----------
  const answerBox = $('#answer');
  let busy = false;
  function setBusy(b) { busy = b; $('#cmdGo').disabled = b; $('#cmdStop').hidden = !b; $('#cmdInput').disabled = b; }
  $('#cmdStop').addEventListener('click', () => { if (abortCtl) abortCtl.abort(); });

  function indexFor(request) {
    const q = BG.norm(request).split(' ').filter((w) => w.length > 1);
    let nodes = BG.state.nodes.slice();
    if (nodes.length > 320) {
      const score = (n) => { const t = BG.norm(n.label + ' ' + n.summary); return q.reduce((s, w) => s + (t.includes(BG.key(w)) ? 3 : 0), 0) + (n.deg || 0) * 0.2; };
      nodes = nodes.sort((a, b) => score(b) - score(a)).slice(0, 320);
    }
    return nodes.map((n) => [n.id, n.label, n.region, n.kind, (n.summary || '').slice(0, 70)].join('|')).join('\n');
  }
  function localSeeds(request) {
    const q = BG.norm(request).split(' ').filter((w) => w.length > 1).map(BG.key);
    return BG.state.nodes.map((n) => { const t = BG.norm(n.label + ' ' + n.summary); return { id: n.id, s: q.reduce((s, w) => s + (t.includes(w) ? 1 : 0), 0) }; }).filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 5).map((x) => x.id);
  }
  function traversal(seeds, maxNodes, maxDepth) {
    const order = [], seen = new Set(), q = [];
    seeds.forEach((s) => { if (BG.nodeById(s) && !seen.has(s)) { seen.add(s); q.push({ id: s, via: null, d: 0 }); } });
    while (q.length && order.length < maxNodes) {
      const cur = q.shift();
      order.push(cur);
      if (cur.d >= maxDepth) continue;
      const nb = BG.edgesOf(cur.id).sort((a, b) => (b.w || 0) - (a.w || 0)).slice(0, 4);
      for (const e of nb) { const o = BG.otherEnd(e, cur.id); if (!seen.has(o)) { seen.add(o); q.push({ id: o, via: e.id, d: cur.d + 1 }); } }
    }
    return order;
  }
  async function walk(order) {
    BG.clearActivation();
    const ids = order.map((o) => o.id);
    BG.fitTo(ids.length > 1 ? ids : null);
    for (const step of order) { BG.pulse(step.id, step.via, 0.55); await BG.sleep(Math.max(80, Math.min(380, 3200 / order.length))); }
  }
  async function traverseFrom(seeds, title) {
    const order = traversal(seeds, 26, 2);
    await walk(order);
    showAnswer({ title, text: 'עברתי על ' + order.length + ' צמתים מסביב לנקודת ההתחלה. האזורים שהופעלו צבועים בגרף.', visited: order.map((o) => o.id), actions: [] });
  }

  function regionChips(ids) {
    const counts = new Map();
    ids.forEach((id) => { const n = BG.nodeById(id); if (n) counts.set(n.region, (counts.get(n.region) || 0) + 1); });
    return h('div', null, [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([rid, c]) => h('span', { class: 'chip' }, h('i', { style: 'background:' + BG.regionById(rid).color }), regionName(rid) + ' · ' + c)));
  }
  function describeAction(a) {
    switch (a.op) {
      case 'add_node': return 'הוסף "' + a.label + '" (' + kindName(a.kind) + ') באזור ' + regionName(a.region || (BG.kindById(a.kind) || {}).home);
      case 'link': return 'חבר "' + labelOf(a.from) + '" ← ' + (a.rel || 'קשור ל') + ' → "' + labelOf(a.to) + '"';
      case 'move': return 'העבר "' + labelOf(a.node) + '" אל ' + regionName(a.region) + (a.kind ? ' (' + kindName(a.kind) + ')' : '');
      case 'update': return 'עדכן תיאור של "' + labelOf(a.node) + '"';
      case 'delete': return 'מחק את "' + labelOf(a.node) + '"';
      case 'export': return 'ייצוא ' + String(a.format).toUpperCase();
      default: return null;
    }
  }
  const labelOf = (ref) => { const n = BG.getNode(ref); return n ? n.label : String(ref); };

  function cleanActions(list) {
    const ok = [];
    for (const a of Array.isArray(list) ? list : []) {
      if (!a || typeof a !== 'object') continue;
      if (a.op === 'add_node' && a.label) ok.push(a);
      else if (a.op === 'link' && BG.getNode(a.from) && BG.getNode(a.to)) ok.push(a);
      else if (a.op === 'move' && BG.getNode(a.node) && BG.regionById(a.region)) ok.push(a);
      else if (a.op === 'update' && BG.getNode(a.node) && typeof a.summary === 'string') ok.push(a);
      else if (a.op === 'delete' && BG.getNode(a.node)) ok.push(a);
      else if (a.op === 'export' && BG.exporters[a.format]) ok.push(a);
    }
    return ok.slice(0, 60);
  }

  function showAnswer({ title, text, visited, used, actions }) {
    answerBox.textContent = '';
    answerBox.hidden = false;
    const acts = cleanActions(actions);
    const hl = (used && used.length ? used : visited) || [];
    answerBox.append(
      h('button', { class: 'x', title: 'סגור וניקוי סימון', onclick: () => { answerBox.hidden = true; BG.clearActivation(); }, text: '✕' }),
      h('h4', { text: title || 'תשובה' }),
      h('p', { text }),
      h('div', { class: 'muted', text: 'אזורי זיכרון שנעשה בהם שימוש:' }), regionChips(hl)
    );
    if (acts.length) {
      const boxes = acts.map((a) => { const cb = h('input', { type: 'checkbox' }); cb.checked = a.op !== 'delete'; return cb; });
      answerBox.append(h('div', { class: 'acts' }, h('b', { text: 'הצעות לשינוי בגרף – סמן מה להחיל:' }),
        acts.map((a, i) => h('label', null, boxes[i], describeAction(a))),
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', { class: 'primary', onclick: async () => { await applyActions(acts.filter((_, i) => boxes[i].checked)); answerBox.hidden = true; }, text: 'החל נבחרים' }),
          h('button', { onclick: () => { answerBox.hidden = true; }, text: 'התעלם' }))));
    }
  }

  async function applyActions(list) {
    if (!list.length) return;
    const exports = list.filter((a) => a.op === 'export'), edits = list.filter((a) => a.op !== 'export');
    const touched = new Set();
    if (edits.length) {
      BG.snapshot();
      BG.batch(() => {
        for (const a of edits) {
          if (a.op === 'add_node') {
            let n = BG.findByLabel(a.label);
            if (!n) n = BG.addNode({ label: a.label, kind: a.kind, region: a.region, summary: a.summary });
            touched.add(n.id);
            for (const l of a.links || []) { const t = BG.getNode(l.to); if (t) BG.addEdge(n.id, t.id, l.rel, 1); }
          } else if (a.op === 'link') { const x = BG.getNode(a.from), y = BG.getNode(a.to); if (x && y) { BG.addEdge(x.id, y.id, a.rel, a.w); touched.add(x.id); touched.add(y.id); } }
          else if (a.op === 'move') { const n = BG.getNode(a.node); if (n) { n.region = a.region; if (BG.kindById(a.kind)) n.kind = a.kind; touched.add(n.id); } }
          else if (a.op === 'update') { const n = BG.getNode(a.node); if (n) { n.summary = a.summary.slice(0, 500); touched.add(n.id); } }
          else if (a.op === 'delete') { const n = BG.getNode(a.node); if (n) BG.removeNode(n.id); }
        }
      });
      BG.layout.kick(1);
      BG.toast('הוחלו ' + edits.length + ' שינויים (↶ מבטל)', 'ok');
      if (touched.size) lightUp([...touched], 'new');
    }
    for (const a of exports) { try { BG.toast('הורד: ' + await BG.runExport(a.format), 'ok'); } catch (e) { BG.toast('הייצוא נכשל: ' + e.message, 'err'); } }
  }

  async function runCommand(request) {
    if (busy || !request.trim()) return;
    if (!BG.state.nodes.length) return BG.toast('הגרף ריק – הוסף קודם מקורות או טען דוגמה');
    setBusy(true);
    abortCtl = new AbortController();
    const hint = $('#hint');
    try {
      let seeds = [], intent = 'answer', note = '';
      if (BG.ai.ready()) {
        hint.textContent = 'ה-AI סורק את המוח…'; hint.classList.add('scan');
        const r = await BG.ai.seeds(request, indexFor(request), abortCtl.signal);
        seeds = (r.seeds || []).map((s) => { const n = BG.getNode(s); return n && n.id; }).filter(Boolean);
        intent = r.intent || 'answer'; note = r.note || '';
      } else seeds = localSeeds(request);
      hint.classList.remove('scan');
      if (!seeds.length) seeds = localSeeds(request);
      if (!seeds.length && !(BG.ai.ready() && intent !== 'answer')) { hint.textContent = ''; setBusy(false); return showAnswer({ title: 'לא נמצא', text: 'לא מצאתי בגרף משהו שקשור לבקשה.' + (BG.ai.ready() ? '' : ' (בלי מפתח AI החיפוש הוא לפי מילים בלבד.)'), visited: [], actions: [] }); }
      hint.textContent = note || 'עובר על האזורים הרלוונטיים…';
      const order = traversal(seeds, 26, 2);
      await walk(order);
      if (!BG.ai.ready()) {
        showAnswer({ title: 'בלי מפתח AI', text: 'סימנתי את הצמתים והאזורים הקרובים למילים בבקשה. כדי שה-AI יענה, יסדר וייצא – הוסף מפתח API בהגדרות (⚙).', visited: order.map((o) => o.id), actions: [] });
        return;
      }
      hint.textContent = 'ה-AI קורא את מה שנמצא ועונה…'; hint.classList.add('scan');
      const vis = order.map((o) => BG.nodeById(o.id));
      const idset = new Set(vis.map((v) => v.id));
      const edges = BG.state.edges.filter((e) => idset.has(e.from) && idset.has(e.to)).map((e) => ({ from: e.from, to: e.to, rel: e.rel }));
      const res = await BG.ai.work(request, vis, edges, abortCtl.signal);
      hint.classList.remove('scan');
      const used = (res.used || []).map((u) => { const n = BG.getNode(u); return n && n.id; }).filter(Boolean);
      if (used.length) { BG.clearActivation(); used.forEach((id) => BG.pulse(id, null, 0.8)); }
      showAnswer({ title: intent === 'modify' ? 'הצעה לשינוי' : 'תשובה', text: String(res.answer || '').trim() || '(ה-AI לא כתב תשובה)', visited: order.map((o) => o.id), used, actions: res.actions });
    } catch (e) {
      if (e.name === 'AbortError') BG.toast('הופסק');
      else { BG.toast(e.message, 'err'); }
    } finally {
      hint.classList.remove('scan'); hint.textContent = ''; renderStats(); setBusy(false);
    }
  }
  $('#cmd').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#cmdInput').value; $('#cmdInput').value = ''; runCommand(v); });

  async function organizeAll() {
    if (busy) return;
    if (!BG.ai.ready()) return BG.toast('סידור אוטומטי דורש מפתח API (⚙)', 'err');
    const nodes = BG.state.nodes.filter((n) => !BG.kindById(n.kind).source);
    if (nodes.length < 2) return BG.toast('אין מספיק צמתים לסידור');
    setBusy(true); abortCtl = new AbortController();
    const actions = [], labels = BG.state.nodes.map((n) => n.label), hint = $('#hint');
    try {
      BG.clearActivation();
      for (let i = 0; i < nodes.length; i += 50) {
        const batch = nodes.slice(i, i + 50);
        hint.textContent = 'ה-AI עובר על הצמתים ' + (i + 1) + '–' + (i + batch.length) + ' מתוך ' + nodes.length + '…'; hint.classList.add('scan');
        batch.forEach((n) => BG.pulse(n.id, null, 0.5));
        const r = await BG.ai.organize(batch, labels, abortCtl.signal);
        for (const m of r.moves || []) { const n = BG.getNode(m.id); if (n && BG.regionById(m.region) && (m.region !== n.region || (m.kind && m.kind !== n.kind))) actions.push({ op: 'move', node: n.id, region: m.region, kind: m.kind }); }
        for (const l of r.links || []) actions.push({ op: 'link', from: l.from, to: l.to, rel: l.rel, w: l.w });
        BG.clearActivation();
      }
      showAnswer({ title: 'סידור מחדש', text: actions.length ? 'ה-AI עבר על ' + nodes.length + ' צמתים והציע ' + actions.length + ' שינויים.' : 'לא נמצא מה לשפר – הכל נראה במקום.', visited: nodes.map((n) => n.id), used: [], actions });
      BG.clearActivation();
    } catch (e) { if (e.name !== 'AbortError') BG.toast(e.message, 'err'); }
    finally { hint.classList.remove('scan'); hint.textContent = ''; setBusy(false); }
  }

    BG.layout.kick(1);
    BG.toast('נטענה דוגמה – נסה: "מה גורם לי לדחות משימות?"', 'ok');
  }
  BG.loadDemo = loadDemo;

  function renderEmpty() {
    const has = BG.state.nodes.length > 0;
    const tail = $('#tab-add .demo');
    if (tail) tail.remove();
    if (!has) $('#tab-add').prepend(h('div', { class: 'demo drophint', style: 'margin:0 0 10px', onclick: loadDemo, text: 'הגרף ריק – לחץ לטעינת דוגמה קטנה (24 צמתים)' }));
  }

  BG.ui = { showTab, indexFor, localSeeds, traversal, walk, describeAction, cleanActions, applyActions, regionChips, labelOf };

  // ---------- init ----------
  BG.on('change', () => { renderStats(); renderRegionsPanel(); if (BG.view.selected && !BG.nodeById(BG.view.selected)) BG.view.selected = null; renderNodePanel(); renderEmpty(); });
  BG.ai.loadSettings();
  BG.initView($('#stage'));
  renderAddPanel();
  renderNodePanel();
  renderRegionsPanel();
  if (!BG.restore()) { renderStats(); renderEmpty(); }
  BG.layout.kick(1);
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); BG.undo(); }
    if (e.key === 'Escape') { BG.clearActivation(); BG.select(null); }
  });
})(window.BG);

// A room where the AIs of several journals talk to each other. No bridge, no live connection:
// each journal is loaded from its export file (or from this browser's storage), and gets its own AI that knows only that data.
(function (BG) {
  'use strict';
  const h = BG.h, U = () => BG.ui;
  const R = (BG.room = { parts: [], busy: false });
  let abort = null, listEl, transcript, proposals, actEl, topicEl, roundsEl, atlasRow;

  // ---------- reading the different file formats ----------
  const TYPE_OUT = { emotion: 'emotion', person: 'person', thought: 'belief', trigger: 'belief', body: 'need', coping: 'behavior', insight: 'belief', concept: 'belief' };
  const TYPE_HE = { event: 'מקרה', emotion: 'רגש', person: 'אדם', trigger: 'טריגר', thought: 'מחשבה', body: 'תחושה בגוף', coping: 'התמודדות', insight: 'תובנה', concept: 'מושג', history: 'היסטוריה' };
  const isJournal = (d) => Array.isArray(d) && d.some((x) => x && x.id && x.type && 'title' in x);

  function parseAny(json) {
    if (isJournal(json)) return { kind: 'journal', items: json.filter((x) => x && x.id && x.type) };
    if (json && isJournal(json.items)) return { kind: 'journal', items: json.items };
    if (BG.mapat.isBackup(json)) return { kind: 'mapat', data: json };
    throw new Error('לא זיהיתי את הקובץ. צריך את קובץ הייצוא של המפה הנפשית או של מפת הנפש.');
  }

  // psychJournal items -> mapat backup shape (so it can be imported into the brain)
  function journalToMapat(items) {
    const real = items.filter((n) => !n.demo), by = new Map(real.map((n) => [n.id, n]));
    const cs = real.filter((n) => n.type !== 'event' && n.type !== 'history');
    const ids = new Set(cs.map((n) => n.id)), pairs = new Map();
    const add = (a, b) => { if (!a || !b || a === b || !ids.has(a) || !ids.has(b)) return; const k = [a, b].sort().join('|'); const o = pairs.get(k) || { a, b, n: 0 }; o.n++; pairs.set(k, o); };
    for (const e of real.filter((n) => n.type === 'event')) { const r = (e.refs || []).map((x) => x.id); for (let i = 0; i < r.length; i++) for (let j = i + 1; j < r.length; j++) add(r[i], r[j]); }
    return {
      app: 'mapat-hanefesh',
      concepts: cs.map((n) => ({ id: n.id, name: n.title, type: TYPE_OUT[n.type] || 'belief', note: n.text || '' })),
      relations: [...pairs.values()].sort((x, y) => y.n - x.n).slice(0, 200).map((p, i) => ({ id: 'r' + i, from: p.a, to: p.b, type: 'related', note: 'מופיעים יחד ב־' + p.n + ' מקרים' })),
      stories: real.filter((n) => n.type === 'event').map((e) => ({ id: e.id, title: e.title || 'מקרה', text: [e.text, e.lesson ? 'תובנה: ' + e.lesson : '', (e.refs || []).map((r) => by.get(r.id)).filter(Boolean).map((n) => '[[' + n.title + ']]').join(' ')].filter(Boolean).join('\n') }))
    };
  }

  // ---------- what each AI is allowed to know: a compact text of its own data ----------
  function journalDigest(items, limit) {
    let real = items.filter((n) => !n.demo);
    if (!real.length) real = items;
    const by = new Map(real.map((n) => [n.id, n]));
    const evs = real.filter((n) => n.type === 'event').sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    const out = []; let size = 0;
    for (const e of evs) {
      const g = {};
      for (const r of e.refs || []) { const n = by.get(r.id); if (n) (g[n.type] = g[n.type] || []).push(n.title + (r.v ? ' ' + r.v : '')); }
      const line = [String(e.date || '') + ' | ' + (e.title || 'מקרה'), e.text ? 'מה קרה: ' + e.text.replace(/\s+/g, ' ').slice(0, 220) : '',
        ...['emotion', 'person', 'trigger', 'thought', 'body', 'coping'].map((t) => g[t] ? TYPE_HE[t] + ': ' + g[t].join(', ') : ''), e.lesson ? 'תובנה: ' + e.lesson.replace(/\s+/g, ' ').slice(0, 160) : ''].filter(Boolean).join(' | ');
      if (size + line.length > limit) break;
      out.push(line); size += line.length;
    }
    const freq = new Map();
    for (const e of evs) for (const r of e.refs || []) freq.set(r.id, (freq.get(r.id) || 0) + 1);
    const pat = [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 18).map(([id, c]) => { const n = by.get(id); return n ? n.title + ' (' + TYPE_HE[n.type] + ') ×' + c : ''; }).filter(Boolean);
    const others = real.filter((n) => n.type === 'insight' || n.type === 'concept').slice(0, 20).map((n) => n.title + (n.text ? ': ' + n.text.slice(0, 80) : ''));
    return 'מקרים (מהחדש לישן):\n' + (out.reverse().join('\n') || '(אין)') + '\n\nדפוסים שחוזרים:\n' + (pat.join('; ') || '(אין)') + (others.length ? '\n\nתובנות ומושגים:\n' + others.join('\n') : '');
  }
  function mapatDigest(d, limit) {
    const concepts = Array.isArray(d.concepts) ? d.concepts : Object.values(d.concepts || {});
    const byId = new Map(concepts.map((c) => [c.id, c]));
    const HE = { value: 'ערכים', emotion: 'רגשות', belief: 'אמונות ומחשבות', need: 'צרכים', behavior: 'התנהגויות', person: 'אנשים' };
    const lines = Object.keys(HE).map((t) => { const l = concepts.filter((c) => c.type === t).slice(0, 40); return l.length ? HE[t] + ': ' + l.map((c) => c.name + (c.note ? ' (' + String(c.note).slice(0, 70) + ')' : '')).join('; ') : ''; }).filter(Boolean);
    const rels = (d.relations || []).slice(0, 70).map((r) => { const a = byId.get(r.from), b = byId.get(r.to); return a && b ? a.name + ' ' + r.type + ' ' + b.name : ''; }).filter(Boolean);
    const stories = (d.stories || []).slice(-8).map((s) => (s.title || '') + ': ' + String(s.text || '').replace(/\[\[([^\]|]*)\|?[^\]]*\]\]/g, '$1').slice(0, 260));
    return (lines.join('\n') + '\n\nקשרים:\n' + rels.join('\n') + '\n\nסיפורים אחרונים:\n' + stories.join('\n')).slice(0, limit);
  }
  const digestOf = (p) => (p.kind === 'journal' ? journalDigest(p.items, 7000) : mapatDigest(p.data, 7000));
  const countsOf = (p) => {
    if (p.kind === 'journal') { const r = p.items.filter((n) => !n.demo); return r.filter((n) => n.type === 'event').length + ' מקרים, ' + r.filter((n) => n.type !== 'event' && n.type !== 'history').length + ' פריטים'; }
    const c = Array.isArray(p.data.concepts) ? p.data.concepts.length : Object.keys(p.data.concepts || {}).length;
    return c + ' מושגים, ' + (p.data.stories || []).length + ' סיפורים';
  };

  // ---------- loading ----------
  function addPart(name, parsed) {
    const p = Object.assign({ id: 'q' + Date.now().toString(36) + R.parts.length, name, use: true, ai: null }, parsed);
    R.parts.push(p); listEl.append(partRow(p));
    return p;
  }
  async function loadFiles(files) {
    for (const f of files) {
      try { addPart(f.name.replace(/\.json$/i, ''), parseAny(JSON.parse(await f.text()))); }
      catch (e) { BG.toast(f.name + ': ' + e.message, 'err'); }
    }
  }
  function loadFromBrowser() {
    const keys = [['psychJournal.modern.v1', 'המפה הנפשית (שמורה בדפדפן)'], ['psychJournal.v1', 'המפה הנפשית (שמורה בדפדפן, גרסה ישנה)'], ['mapat-hanefesh.v1', 'מפת הנפש (שמורה בדפדפן)']];
    let found = 0;
    for (const [k, name] of keys) {
      try { const t = localStorage.getItem(k); if (t) { addPart(name, parseAny(JSON.parse(t))); found++; } } catch (e) { /* not readable or not the right shape */ }
    }
    if (!found) BG.toast('לא נמצא מידע של המפות בדפדפן הזה (הוא נשמר לפי כתובת הקובץ). אפשר לטעון את קובצי הייצוא שלהן.', 'err');
  }

  // ---------- one participant ----------
  function partRow(p) {
    const nameIn = h('input', { value: p.name }); nameIn.addEventListener('change', () => { p.name = nameIn.value.trim() || p.name; });
    const use = h('input', { type: 'checkbox', style: 'width:auto' }); use.checked = true; use.addEventListener('change', () => { p.use = use.checked; });
    // optional separate brain: lets one journal speak with Gemini and another with Claude, for example
    const prov = h('select', null, h('option', { value: '' }, 'אותה בינה של האטלס'), Object.entries(BG.PRESETS).map(([k, v]) => h('option', { value: k }, v.name)));
    const key = h('input', { type: 'password', placeholder: 'מפתח API לבינה הזו', dir: 'ltr', autocomplete: 'off' });
    const model = h('input', { placeholder: 'מודל', dir: 'ltr' });
    const sync = () => {
      if (!prov.value) { p.ai = null; return; }
      const pr = BG.PRESETS[prov.value];
      p.ai = { provider: prov.value, key: key.value.trim(), model: model.value.trim() || pr.model, base: pr.base };
    };
    prov.addEventListener('change', () => { model.value = prov.value ? BG.PRESETS[prov.value].model : ''; sync(); });
    key.addEventListener('input', sync); model.addEventListener('input', sync);
    p.el = h('div', { class: 'region-row', style: 'display:block;cursor:default' },
      h('div', { class: 'row' }, use, nameIn, h('button', { class: 'small danger', title: 'הסר', onclick: () => { R.parts = R.parts.filter((x) => x !== p); p.el.remove(); }, text: '✕' })),
      h('div', { class: 'muted', text: (p.kind === 'journal' ? 'המפה הנפשית' : 'מפת הנפש') + ' · ' + countsOf(p) }),
      h('details', null, h('summary', { class: 'muted', text: 'בינה משלה (ספק ומפתח נפרדים)' }), prov, h('div', { style: 'height:4px' }), key, h('div', { style: 'height:4px' }), model),
      h('div', { style: 'margin-top:6px' }, h('button', { class: 'small', onclick: () => {
        const s = BG.mapat.import(p.kind === 'journal' ? journalToMapat(p.items) : p.data);
        BG.toast(p.name + ' נכנסה לאטלס: ' + s.added + ' חדשים, ' + s.merged + ' אוחדו, ' + s.links + ' קשרים, ' + s.stories + ' סיפורים', 'ok');
      }, text: 'הכנס את הנתונים לאטלס' })));
    return p.el;
  }

  // ---------- the conversation ----------
  const personaFor = (p, others) =>
    'You are the AI of "' + p.name + '", a personal journal app. You know ONLY the user\'s own data below. You are in a dialogue with the AI of ' + others.map((o) => '"' + o.name + '"').join(' and ') +
    ', each of which knows different data about the same person. Goal: find real connections, contradictions and blind spots between what each of you knows about the user on the topic. ' +
    'Answer in Hebrew, 2-4 concrete sentences, name actual items from YOUR data, and either answer the last question or ask the other a concrete one. Say plainly when your data does not cover something. This is reflection, not diagnosis. Reply with JSON {"say":"..."}.';

  function addBubble(cls, label, text) {
    transcript.append(h('div', { class: 'bubble ' + cls }, label ? h('b', { text: label }) : null, text));
    const p = document.getElementById('tab-chat'); if (p) p.scrollTop = p.scrollHeight;
  }
  const histText = (hist) => hist.map((x) => x.name + ': ' + x.text).join('\n') || '(none yet)';

  // the brain takes part by reading its own memory about the topic (the regions it reads light up)
  async function atlasMemory(topic, last, signal) {
    const query = topic + ' ' + (last || '');
    let seeds = [];
    if (BG.ai.ready()) { try { const r = await BG.ai.seeds(query, U().indexFor(query), signal); seeds = (r.seeds || []).map((s) => { const n = BG.getNode(s); return n && n.id; }).filter(Boolean); } catch (e) { if (e.name === 'AbortError') throw e; } }
    if (!seeds.length) seeds = U().localSeeds(query);
    const order = U().traversal(seeds, 18, 2);
    if (order.length) await U().walk(order);
    return order.map((o) => BG.nodeById(o.id)).filter(Boolean).map((n) => '- ' + n.label + ' [' + (BG.regionById(n.region) || {}).name + '] ' + (n.summary || '')).join('\n') || '(nothing relevant)';
  }

  async function run(topic, rounds) {
    const active = R.parts.filter((p) => p.use);
    const withAtlas = atlasRow.cb.checked;
    const speakers = active.map((p) => ({ name: p.name, p, digest: digestOf(p), ai: p.ai }));
    if (withAtlas) speakers.push({ name: 'אטלס המוח', atlas: true });
    if (speakers.length < 2) return BG.toast('צריך לפחות שתי בינות: טען שתי מפות (או סמן גם את האטלס)', 'err');
    for (const s of speakers) if (!s.atlas && !((s.ai && s.ai.key) || BG.ai.ready())) return BG.toast('אין מפתח AI ל"' + s.name + '". הוסף מפתח בהגדרות (⚙) או "בינה משלה" לשורה שלה.', 'err');
    if (!BG.ai.ready()) return BG.toast('הסיכום נעשה בבינה של האטלס: צריך מפתח AI בהגדרות (⚙)', 'err');
    R.busy = true; abort = new AbortController(); updateAct();
    transcript.textContent = ''; proposals.textContent = '';
    const hist = [];
    try {
      for (let r = 1; r <= rounds; r++) {
        for (const s of speakers) {
          const others = speakers.filter((o) => o !== s);
          const last = hist.length ? hist[hist.length - 1].text : '';
          const data = s.atlas ? await atlasMemory(topic, last, abort.signal) : s.digest;
          const turn = await BG.ai.json({
            system: personaFor({ name: s.name }, others) + '\n\nYOUR DATA:\n' + data,
            user: 'Topic: ' + topic + '\n\nConversation so far:\n' + histText(hist) + '\n\n' +
              (!hist.length ? 'You speak first: open with the most relevant thing your data shows about the topic and ask the other a concrete question.'
                : r === rounds && s === speakers[speakers.length - 1] ? 'Final turn: say what you now think connects your data with theirs.' : 'Respond to the last message and move one step deeper.'),
            max: 600, signal: abort.signal, settings: s.ai || null
          });
          const say = String(turn.say || '').trim() || '(…)';
          hist.push({ name: s.name, text: say });
          addBubble(s.atlas ? 'atlas' : speakers.indexOf(s) % 2 === 0 ? 'mapat' : 'atlas', s.name, say);
        }
      }
      addBubble('sys', 'האטלס מסכם את השיחה…');
      const fin = await BG.ai.json({
        system: 'You moderate a dialogue between the AIs of several journals of one person, and also own "אטלס המוח", a brain-shaped knowledge graph. Reply with one JSON object, Hebrew text.',
        user: 'Topic: ' + topic + '\n\nDialogue:\n' + histText(hist) + '\n\nReturn JSON:\n' +
          '{"summary":"3-5 sentences: what connects the journals, what contradicts, what is missing",' +
          '"suggestions":{"<participant name>":["short concrete thing worth adding or examining in that journal"]},' +
          '"atlas_actions":[{"op":"add_node","label":"","kind":"","region":"","summary":"","links":[{"to":"existing label","rel":""}]}]}\n' +
          'Participants: ' + speakers.map((s) => s.name).join('; ') + '. At most 4 suggestions per participant and 6 atlas_actions; only what the dialogue supports.',
        max: 2200, signal: abort.signal
      });
      addBubble('sys', String(fin.summary || ''));
      showProposals(fin);
    } catch (e) {
      addBubble('sys', e.name === 'AbortError' ? 'השיחה נעצרה.' : '✗ ' + e.message);
    } finally { R.busy = false; BG.clearActivation(); BG.resetView(); updateAct(); }
  }

  function showProposals(fin) {
    proposals.textContent = '';
    const acts = U().cleanActions(fin.atlas_actions).filter((a) => a.op !== 'export' && a.op !== 'delete');
    const boxes = acts.map(() => { const cb = h('input', { type: 'checkbox' }); cb.checked = true; return cb; });
    const sug = fin.suggestions && typeof fin.suggestions === 'object' ? fin.suggestions : {};
    const names = Object.keys(sug).filter((k) => Array.isArray(sug[k]) && sug[k].length);
    if (names.length) {
      proposals.append(h('h3', { text: 'מה כדאי להוסיף או לבדוק בכל מפה' }));
      names.forEach((k) => proposals.append(h('div', { class: 'muted', style: 'margin:6px 0 2px;font-weight:700', text: k }), h('ul', { style: 'margin:0;padding-inline-start:18px' }, sug[k].slice(0, 5).map((t) => h('li', { text: String(t) })))));
    }
    if (acts.length) {
      proposals.append(h('h3', { text: 'הצעות לאטלס – סמן מה להחיל' }), acts.map((a, i) => h('label', { style: 'display:flex;gap:8px;align-items:flex-start;padding:3px 0' }, boxes[i], U().describeAction(a))),
        h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { class: 'primary', onclick: async () => { await U().applyActions(acts.filter((_, i) => boxes[i].checked)); proposals.textContent = ''; }, text: 'החל נבחרים' }),
          h('button', { onclick: () => { proposals.textContent = ''; }, text: 'התעלם' })));
    }
  }

  // ---------- panel ----------
  function updateAct() {
    actEl.textContent = '';
    actEl.append(R.busy ? h('button', { onclick: () => abort && abort.abort(), text: 'עצור' })
      : h('button', { class: 'primary', onclick: () => { const t = topicEl.value.trim(); if (!t) return BG.toast('כתוב נושא לשיחה'); run(t, +roundsEl.value); }, text: 'התחל שיחה' }));
  }
  function build() {
    const p = document.getElementById('tab-chat'); if (!p) return;
    listEl = h('div'); transcript = h('div'); proposals = h('div');
    const file = h('input', { type: 'file', multiple: true, accept: '.json,application/json', hidden: true });
    file.addEventListener('change', () => { loadFiles([...file.files]); file.value = ''; });
    topicEl = h('input', { id: 'chatTopic', placeholder: 'על מה הבינות ידברו? (למשל: למה אני נלחץ מביקורת)' });
    roundsEl = h('select', null, [1, 2, 3, 4, 5].map((n) => h('option', { value: n, selected: n === 3 }, n + ' סבבים')));
    actEl = h('div', { style: 'flex:none' });
    const acb = h('input', { type: 'checkbox', style: 'width:auto' });
    atlasRow = { cb: acb };
    p.append(
      h('h3', { text: 'שיחה בין הבינות' }),
      h('p', { class: 'muted', text: 'טוען את קובצי הייצוא של שתי המפות (בכל אחת: ייצוא / גיבוי). לכל מפה יש בינה משלה שמכירה רק את הנתונים שלה, והבינות מדברות ישירות זו עם זו, בלי חיבור ובלי אישורים. בסוף האטלס מסכם ומציע מה להוסיף.' }),
      h('div', { class: 'row' }, h('button', { class: 'primary', onclick: () => file.click(), text: 'טען קובצי ייצוא…' }), h('button', { onclick: loadFromBrowser, text: 'קרא מהדפדפן' })), file,
      listEl,
      h('label', { class: 'muted', style: 'display:block;margin:8px 0' }, acb, ' גם האטלס משתתף בשיחה (עם הזיכרון שלו, והאזורים נצבעים)'),
      h('div', { class: 'hr' }),
      h('label', { class: 'f', text: 'נושא לשיחה' }), topicEl,
      h('div', { class: 'row', style: 'margin-top:6px' }, roundsEl, actEl),
      transcript, proposals);
    updateAct();
  }
  // drop export files straight onto the chat panel
  BG.room.loadFiles = loadFiles;
  build();
})(window.BG);

</script>
