<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ראלי האיים</title>
    <meta name="description" content="ראלי האיים: משחק ראלי בתלת־ממד על מנוע שימוטרון. חמישה שלבים על חמישה איים, אספלט, חצץ וחול, נווט שמקריא פניות ושלושה כוכבים לכל שלב." />
  </head>
  <body>
    <canvas id="viewport" tabindex="0" aria-label="תצוגת המירוץ"></canvas>
    <div id="ui"></div>
    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="loader-card">
        <h1>ראלי האיים</h1>
        <p class="tag">חמישה שלבי ראלי · אספלט, חצץ וחול · הכול נבנה בזמן אמת</p>
        <div class="bar"><i></i></div>
        <div class="step">טוען…</div>
        <p class="err" hidden></p>
      </div>
    </div>
    <script type="module" src="/src/race/main.js"></script>
  </body>
</html>
