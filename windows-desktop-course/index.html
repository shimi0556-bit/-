<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קורס שולחן העבודה בווינדוס מלא — ממתחילים ועד מקצוענים</title>
<style>
  :root{
    --brand:#0078D4;
    --brand-dark:#005A9E;
    --brand-light:#E5F1FB;
    --blue:#0078D4;
    --ink:#232323;
    --muted:#666;
    --paper:#FAFAFA;
    --card:#FFFFFF;
    --border:#E1E4E8;
    --green:#1E8E3E;
    --green-bg:#E6F4EA;
    --red:#C23B22;
    --red-bg:#FCEAE6;
    --radius:14px;
    --sidebar-w:300px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Heebo","Arial Hebrew","Arial",sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.65;
  }
  a{color:var(--blue);}
  h1,h2,h3,h4{line-height:1.3; margin:0 0 .5em;}
  ::selection{background:var(--brand-light);}

  /* Layout */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
    background:#1B2733; color:#EAF0F6;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    padding:18px 16px 40px;
  }
  .sidebar .brand{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
    padding:4px 2px;
  }
  .brand .logo{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--brand),#50B0F0);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:18px;flex:none;
  }
  .brand .name{font-weight:700; font-size:15px;}
  .brand .sub{font-size:11.5px; color:#A6B4C2;}

  .progress-wrap{margin:10px 2px 18px;}
  .progress-label{display:flex; justify-content:space-between; font-size:12px; color:#B3C1CE; margin-bottom:5px;}
  .progress-bar{height:8px; background:#28394A; border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--brand),#6FC3F7); width:0%; transition:width .4s ease;}

  .search{
    width:100%; padding:8px 10px; border-radius:9px; border:1px solid #34495C;
    background:#22313F; color:#EAF0F6; font-size:13px; margin-bottom:14px;
  }
  .search::placeholder{color:#7E92A3;}

  .nav-group{margin-bottom:6px;}
  .nav-group > summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;
    padding:9px 8px; border-radius:9px; font-weight:700; font-size:13.5px;
    color:#EAF0F6;
  }
  .nav-group > summary::-webkit-details-marker{display:none;}
  .nav-group > summary:hover{background:#22313F;}
  .nav-group[open] > summary .chev{transform:rotate(90deg);}
  .chev{transition:transform .15s; font-size:11px; color:#B3C1CE;}
  .nav-group .badge{
    margin-inline-start:auto; font-size:10.5px; color:#B3C1CE;
    background:#22313F; padding:1px 7px; border-radius:99px;
  }
  .nav-links{list-style:none; margin:2px 0 10px; padding-inline-start:6px; border-inline-start:1px dashed #34495C;}
  .nav-links li{margin:1px 0;}
  .nav-links a{
    display:flex; align-items:center; gap:7px; text-decoration:none;
    color:#CBD8E4; font-size:13px; padding:6px 10px; border-radius:8px;
  }
  .nav-links a:hover{background:#22313F; color:#fff;}
  .nav-links a.active{background:var(--brand); color:#fff; font-weight:600;}
  .nav-links .dot{
    width:15px;height:15px;border-radius:50%;border:1.5px solid #5C7185;flex:none;
    font-size:10px; display:flex; align-items:center; justify-content:center; color:transparent;
  }
  .nav-links a.done .dot{background:var(--green); border-color:var(--green); color:#fff;}
  .extra-links{margin-top:14px; padding-top:14px; border-top:1px solid #34495C;}
  .extra-links a{
    display:flex; align-items:center; gap:8px; text-decoration:none; color:#CBD8E4;
    font-size:13px; padding:7px 10px; border-radius:8px;
  }
  .extra-links a:hover{background:#22313F; color:#fff;}
  .extra-links a.active{background:var(--brand); color:#fff;}

  /* Main */
  .main{flex:1; min-width:0; padding:34px 40px 90px; max-width:900px; margin:0 auto;}
  .section{display:none; animation:fade .25s ease;}
  .section.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .crumb{font-size:12.5px; color:var(--muted); margin-bottom:6px;}
  .lesson-title{font-size:28px; font-weight:800; margin-bottom:4px;}
  .lesson-meta{font-size:13px; color:var(--muted); margin-bottom:22px; display:flex; gap:14px; align-items:center;}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:18px;
  }
  .card h3{font-size:16px; color:var(--brand-dark); margin-bottom:8px;}
  .content-body p{margin:0 0 12px;}
  .content-body ul{margin:0 0 12px; padding-inline-start:22px;}
  .content-body li{margin-bottom:6px;}
  .content-body strong{color:var(--brand-dark);}
  code, kbd{
    background:#F1F3F5; border:1px solid var(--border); border-radius:5px;
    padding:1px 6px; font-size:.92em; font-family:Consolas,"Courier New",monospace;
  }
  kbd{box-shadow:0 1.5px 0 var(--border);}

  .tip-box{
    background:var(--brand-light); border:1px solid #C7E0F4; border-radius:12px;
    padding:14px 16px; margin:14px 0; font-size:14px;
  }
  .tip-box b{color:var(--brand-dark);}
  .try-box{
    background:#EAF7EF; border:1px solid #C3E6CE; border-radius:12px;
    padding:14px 16px; margin:14px 0; font-size:14px;
  }
  .try-box b{color:var(--green);}

  .quiz{background:#FBFDFE; border:1.5px dashed #B9D6EC;}
  .quiz h3{margin-bottom:12px;}
  .quiz .q{font-weight:600; margin-bottom:10px;}
  .quiz .opts{display:flex; flex-direction:column; gap:8px;}
  .quiz button.opt{
    text-align:right; padding:10px 14px; border-radius:9px; border:1px solid var(--border);
    background:#fff; cursor:pointer; font-size:14px; font-family:inherit;
  }
  .quiz button.opt:hover{border-color:var(--brand);}
  .quiz button.opt.correct{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  .quiz button.opt.wrong{background:var(--red-bg); border-color:var(--red); color:var(--red);}
  .quiz button.opt:disabled{cursor:default;}
  .quiz .explain{margin-top:10px; font-size:13.5px; color:var(--muted); display:none;}
  .quiz .explain.show{display:block;}

  .lesson-footer{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    margin-top:28px; padding-top:18px; border-top:1px solid var(--border);
  }
  .btn{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:none;
    border-radius:10px; padding:10px 16px; font-size:14px; font-weight:600; font-family:inherit;
    text-decoration:none;
  }
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-outline{background:#fff; border:1px solid var(--border); color:var(--ink);}
  .btn-outline:hover{border-color:var(--brand);}
  .btn-ghost{background:transparent; color:var(--muted); border:none; font-size:13px;}
  .mark-done{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted); cursor:pointer; user-select:none;}
  .mark-done input{width:17px; height:17px; accent-color:var(--green); cursor:pointer;}

  .hero{
    background:linear-gradient(135deg,var(--brand),#50B0F0);
    color:#fff; border-radius:20px; padding:44px 38px; margin-bottom:26px;
  }
  .hero h1{font-size:32px; margin-bottom:10px;}
  .hero p{font-size:15.5px; max-width:640px; opacity:.95;}
  .hero .stats{display:flex; gap:26px; margin-top:22px; flex-wrap:wrap;}
  .hero .stat b{display:block; font-size:22px;}
  .hero .stat span{font-size:12.5px; opacity:.9;}

  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:20px 0;}
  .grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:20px 0;}
  .mini-card{
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px;
    cursor:pointer;
  }
  .mini-card:hover{border-color:var(--brand);}
  .mini-card .n{font-size:12px; color:var(--muted);}
  .mini-card .t{font-weight:700; font-size:14.5px; margin:3px 0;}
  .mini-card .d{font-size:12.5px; color:var(--muted);}

  table.cheat{width:100%; border-collapse:collapse; font-size:13.5px; margin-bottom:20px;}
  table.cheat th, table.cheat td{border:1px solid var(--border); padding:8px 12px; text-align:right;}
  table.cheat th{background:var(--brand-light); color:var(--brand-dark);}
  table.cheat tr:nth-child(even){background:#FAFAFA;}

  .cert-box{
    background:var(--card); border:3px double var(--brand); border-radius:16px;
    padding:40px; text-align:center; margin-top:10px;
  }
  .cert-box h2{font-size:26px; color:var(--brand-dark);}
  .cert-name{font-size:24px; font-weight:800; margin:18px 0; border-bottom:2px solid var(--border); display:inline-block; padding-bottom:6px; min-width:280px;}
  .cert-input{padding:10px 14px; border:1px solid var(--border); border-radius:9px; font-size:15px; width:280px; text-align:center; font-family:inherit;}

  .topbar-mobile{display:none;}
  @media (max-width:900px){
    .app{flex-direction:column;}
    .sidebar{
      position:relative; height:auto; width:100%; flex:none;
      display:none;
    }
    .sidebar.open{display:block;}
    .topbar-mobile{
      display:flex; align-items:center; justify-content:space-between;
      background:#1B2733; color:#fff; padding:12px 16px; position:sticky; top:0; z-index:10;
    }
    .topbar-mobile button{background:var(--brand); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:13px;}
    .main{padding:24px 18px 70px;}
    .grid-3{grid-template-columns:1fr;}
    .grid-2{grid-template-columns:1fr;}
    .hero{padding:28px 22px;}
  }
  @media print{
    .sidebar,.topbar-mobile,.lesson-footer,.quiz{display:none !important;}
    .section{display:block !important;}
  }
</style>
</head>
<body>

<div class="topbar-mobile">
  <strong>🖥️ קורס שולחן העבודה</strong>
  <button id="toggleSidebar">☰ תפריט</button>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">W</div>
      <div>
        <div class="name">קורס שולחן העבודה בווינדוס</div>
        <div class="sub">ממתחילים ועד מקצוענים</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-label"><span>התקדמות</span><span id="progressPct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <input type="text" class="search" id="searchBox" placeholder="🔍 חיפוש נושא בקורס...">

    <nav id="navContainer"></nav>

    <div class="extra-links">
      <a href="#intro" data-route="intro">🏠 עמוד הבית</a>
      <a href="#cheatsheet" data-route="cheatsheet">⌨️ דף קיצורים להדפסה</a>
      <a href="#final-quiz" data-route="final-quiz">🎯 מבחן מסכם</a>
      <a href="#certificate" data-route="certificate">🎓 תעודת סיום</a>
    </div>
  </aside>

  <main class="main" id="mainContent">
    <!-- rendered by JS -->
  </main>
</div>

<script>
/* ======================= COURSE DATA ======================= */
const COURSE = [
  {
    id:"m1", title:"שלב 1 · מתחילים", icon:"🟢",
    lessons:[
      {
        id:"m1l1", title:"הכרת שולחן העבודה",
        content:`
          <p>שולחן העבודה (Desktop) הוא המסך הראשי שרואים אחרי ההתחברות לווינדוס — נקודת המוצא לכל עבודה במחשב.</p>
          <ul>
            <li><strong>אייקונים (סמלים)</strong> — קיצורי דרך לתוכניות, קבצים ותיקיות, מוצגים כתמונה קטנה + שם.</li>
            <li><strong>רקע שולחן העבודה (Wallpaper)</strong> — התמונה או הצבע שברקע, ניתן להחלפה בקלות.</li>
            <li><strong>לחיצה ימנית על הרקע</strong> — פותחת תפריט הקשר (Context Menu) עם אפשרויות כמו View, Sort by, New, Personalize.</li>
            <li><strong>לחיצה כפולה על אייקון</strong> — פותחת את התוכנית/הקובץ שהוא מייצג. לחיצה בודדת רק מסמנת (בוחרת) אותו.</li>
            <li><strong>פח המיחזור (Recycle Bin)</strong> — אייקון קבוע בפינת שולחן העבודה, מכיל קבצים שנמחקו ועדיין ניתנים לשחזור.</li>
          </ul>
        `,
        tip:`אם שולחן העבודה נראה "עמוס" מדי — לחיצה ימנית → View → אפשר לבטל את הצגת האייקונים זמנית כדי לראות רק את הרקע.`,
        quiz:{q:"מה ההבדל בין לחיצה בודדת ללחיצה כפולה על אייקון בשולחן העבודה?", options:["אין הבדל","לחיצה בודדת רק מסמנת את האייקון, לחיצה כפולה פותחת אותו","לחיצה כפולה מוחקת את האייקון"], correct:1, explain:"לחיצה בודדת בוחרת (מסמנת) את הפריט; רק לחיצה כפולה בפועל פותחת את התוכנית או הקובץ שמאחוריו."}
      },
      {
        id:"m1l2", title:"שורת המשימות (Taskbar)",
        content:`
          <p>שורת המשימות היא הפס לרוחב תחתית המסך (בברירת מחדל), תמיד גלוי, ומרכז את כל הניווט השוטף:</p>
          <ul>
            <li><strong>כפתור Start</strong> — בקצה (בווינדוס 11 בד"כ במרכז), פותח את תפריט ההתחלה.</li>
            <li><strong>תיבת חיפוש</strong> — חיפוש מיידי בתוכנות, קבצים והגדרות.</li>
            <li><strong>אפליקציות מוצמדות (Pinned)</strong> — סמלי תוכנות קבועים לגישה מהירה בלחיצה אחת.</li>
            <li><strong>אפליקציות פתוחות</strong> — כל תוכנית שרצה כרגע מופיעה כאן כדי לעבור אליה במהירות.</li>
            <li><strong>מגש המערכת (System Tray)</strong> — בפינה הנגדית: שעון, עוצמת קול, Wi-Fi, סוללה, והתראות.</li>
          </ul>
        `,
        tip:`לחיצה ימנית על תוכנית פתוחה בשורת המשימות מציעה אפשרויות מהירות כמו סגירה או פתיחת חלון חדש, בלי לעבור דרך התוכנית עצמה.`,
        quiz:{q:"היכן נמצא בדרך כלל השעון ואייקוני ההתראות?", options:["בפינת מגש המערכת (System Tray) בקצה שורת המשימות","בתוך תפריט Start בלבד","על שולחן העבודה"], correct:0, explain:"מגש המערכת מרכז שעון, עוצמת קול, רשת והתראות בקצה שורת המשימות, נגיש תמיד בלי לפתוח תוכנית."}
      },
      {
        id:"m1l3", title:"תפריט Start",
        content:`
          <p>תפריט ה-Start הוא שער הכניסה לכל התוכניות המותקנות במחשב, נפתח בלחיצה על כפתור Start או על מקש ה-Windows במקלדת.</p>
          <ul>
            <li><strong>אפליקציות מוצמדות</strong> — אריחים/סמלים שבחרתם לקבע לגישה מהירה.</li>
            <li><strong>כל התוכניות (All apps)</strong> — רשימה אלפביתית מלאה של כל מה שמותקן.</li>
            <li><strong>מומלצים לאחרונה</strong> — קבצים/תוכניות שנפתחו לאחרונה.</li>
            <li><strong>כפתור Power</strong> — כיבוי, הפעלה מחדש (Restart), ומצב שינה (Sleep).</li>
            <li>הקלדה ישירה בתוך תפריט Start מפעילה חיפוש מיידי — לא צריך ללחוץ קודם על תיבת חיפוש נפרדת.</li>
          </ul>
        `,
        tip:`הדרך המהירה ביותר לפתוח כל תוכנית: לחצו על מקש Windows והתחילו להקליד את שמה — היא תופיע תוך שנייה.`,
        quiz:{q:"מה הדרך המהירה ביותר למצוא תוכנית מותקנת דרך תפריט Start?", options:["לגלול ידנית ברשימה עד שמוצאים אותה","ללחוץ Windows ולהתחיל להקליד את השם","להתקין אותה מחדש"], correct:1, explain:"הקלדה ישירה בתפריט Start מפעילה חיפוש מיידי שמאתר את התוכנית תוך שבריר שנייה, מהיר בהרבה מגלילה ידנית."}
      },
      {
        id:"m1l4", title:"פתיחה, סגירה והזזת חלונות",
        content:`
          <p>כל תוכנית פתוחה מוצגת בתוך "חלון" — מלבן עם שלושה כפתורים בפינה העליונה:</p>
          <ul>
            <li><strong>מזער (Minimize, קו תחתון)</strong> — מסתיר את החלון לשורת המשימות מבלי לסגור אותו.</li>
            <li><strong>הגדל/שחזר (Maximize/Restore, ריבוע)</strong> — ממלא את כל המסך או חוזר לגודל הקודם.</li>
            <li><strong>סגור (Close, X)</strong> — סוגר את התוכנית לגמרי.</li>
            <li><strong>גרירה</strong> — לחיצה והחזקה על שורת הכותרת העליונה של החלון מזיזה אותו על המסך.</li>
            <li><strong>שינוי גודל</strong> — גרירת קצה/פינה של החלון משנה את מידותיו.</li>
            <li><kbd>Alt</kbd>+<kbd>Tab</kbd> — מעבר מהיר בין חלונות פתוחים.</li>
          </ul>
        `,
        tip:`אם חלון "נתקע" מחוץ לגבולות המסך — לחצו Alt+רווח כדי לפתוח תפריט חלון נסתר, ואז בחרו Move והשתמשו בחצים.`,
        quiz:{q:"מה עושה כפתור המזעור (Minimize) בחלון?", options:["סוגר את התוכנית לגמרי","מסתיר את החלון לשורת המשימות בלי לסגור אותו","מוחק את התוכן שבחלון"], correct:1, explain:"מזעור רק מסתיר את החלון זמנית — התוכנית ממשיכה לרוץ ברקע וניתן לפתוח אותה מחדש בלחיצה על שורת המשימות."}
      },
      {
        id:"m1l5", title:"קבצים ותיקיות בשולחן העבודה",
        content:`
          <p>שולחן העבודה הוא בעצם תיקייה רגילה במחשב, ולכן אפשר לנהל בו קבצים ותיקיות ככל תיקייה אחרת:</p>
          <ul>

/* ======================= STATE ======================= */
const STORAGE_KEY = "windows_desktop_course_progress_v1";
const CERT_KEY = "windows_desktop_course_cert_name_v1";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

const ALL_LESSONS = COURSE.flatMap(m => m.lessons.map(l => ({...l, moduleId:m.id, moduleTitle:m.title})));
const TOTAL = ALL_LESSONS.length;

/* ======================= RENDER SIDEBAR ======================= */
const navContainer = document.getElementById("navContainer");
COURSE.forEach((mod, idx) => {
  const details = document.createElement("details");
  details.className = "nav-group";
  details.open = idx === 0;
  const doneCount = () => mod.lessons.filter(l => state[l.id]).length;
  details.innerHTML = `
    <summary><span class="chev">▸</span> ${mod.icon} ${mod.title} <span class="badge" data-mod="${mod.id}">${doneCount()}/${mod.lessons.length}</span></summary>
    <ul class="nav-links">
      ${mod.lessons.map(l => `
        <li><a href="#${l.id}" data-route="${l.id}"><span class="dot">✓</span>${l.title}</a></li>
      `).join("")}
    </ul>
  `;
  navContainer.appendChild(details);
});

function refreshBadges(){
  COURSE.forEach(mod => {
    const badge = navContainer.querySelector(`.badge[data-mod="${mod.id}"]`);
    const doneCount = mod.lessons.filter(l => state[l.id]).length;
    if(badge) badge.textContent = `${doneCount}/${mod.lessons.length}`;
  });
  document.querySelectorAll(".nav-links a").forEach(a => {
    const id = a.dataset.route;
    a.classList.toggle("done", !!state[id]);
  });
  const doneTotal = ALL_LESSONS.filter(l => state[l.id]).length;
  const pct = Math.round((doneTotal/TOTAL)*100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";
}

function lessonSectionHTML(l, i, arr){
  const prev = arr[i-1];

  return `
  <section class="section" id="sec-${l.id}" data-route="${l.id}">
    <div class="crumb">${l.moduleTitle}</div>
    <div class="lesson-title">${l.title}</div>
    <div class="lesson-meta">
      <label class="mark-done">
        <input type="checkbox" data-lesson="${l.id}" ${state[l.id] ? "checked":""}>
        סמן שיעור זה כהושלם
      </label>
    </div>
    <div class="card content-body">${l.content}</div>
    ${l.tip ? `<div class="tip-box">💡 <b>טיפ:</b> ${l.tip}</div>` : ""}
    ${l.quiz ? renderQuiz(l.id, l.quiz) : ""}
    <div class="lesson-footer">
      ${prev ? `<a class="btn btn-outline" href="#${prev.id}" data-route="${prev.id}">→ ${prev.title}</a>` : `<span></span>`}

}

function renderQuiz(lessonId, quiz){

  </div>`;
}

  return `
  <section class="section" id="sec-final-quiz" data-route="final-quiz">
    <div class="lesson-title">🎯 מבחן מסכם</div>
    <p class="lesson-meta">ענו נכון על לפחות 80% מהשאלות כדי "לעבור" את המבחן ולפתוח את תעודת הסיום.</p>
    <div class="card" id="finalScoreCard" style="display:none;">
      <h3>התוצאה שלכם</h3>
      <div id="finalScoreText" style="font-size:18px; font-weight:700;"></div>
    </div>
    <div id="finalQuizList">
      ${items.map((l,i) => `
        <div class="card quiz" id="fq-${l.id}">
          <h3>שאלה ${i+1} — ${l.moduleTitle} · ${l.title}</h3>
          <div class="q">${l.quiz.q}</div>
          <div class="opts">
            ${l.quiz.options.map((opt,idx) => `<button class="opt" data-idx="${idx}">${opt}</button>`).join("")}
          </div>
          <div class="explain"></div>
        </div>
      `).join("")}
    </div>
    <div class="card">
      <button class="btn btn-primary" id="submitFinalQuiz">📝 בדקו את המבחן</button>
    </div>
  </section>`;
}

/* Certificate section */
const certificateHTML = `
<section class="section" id="sec-certificate" data-route="certificate">
  <div class="lesson-title">🎓 תעודת סיום</div>
  <p class="lesson-meta">השלימו את כל השיעורים כדי לפתוח את התעודה, הזינו שם והדפיסו/שמרו כ-PDF.</p>
  <div class="card" id="certGate">
    <p id="certGateText"></p>
  </div>
  <div class="cert-box" id="certBox" style="display:none;">
    <div style="font-size:34px;">🏆</div>
    <h2>תעודת הצטיינות</h2>
    <p>מוענקת בזאת ל</p>
    <input type="text" class="cert-input" id="certNameInput" placeholder="הקלידו את שמכם המלא">
    <p style="margin-top:18px;">על השלמה מוצלחת של<br><strong>קורס שולחן העבודה בווינדוס מלא — ממתחילים ועד מקצוענים</strong></p>
    <p style="color:var(--muted); font-size:13px; margin-top:16px;" id="certDate"></p>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="window.print()">🖨️ הדפסה / שמירה כ-PDF</button>
  </div>
</section>`;

/* Assemble all sections */
main.innerHTML = introHTML +
  ALL_LESSONS.map((l,i,arr) => lessonSectionHTML(l,i,arr)).join("") +
  cheatsheetHTML + finalQuizHTML() + certificateHTML;

/* ======================= INTERACTIONS ======================= */

// Quiz click handling (delegated)
document.addEventListener("click", (e) => {
  const btn = e.target.closest("button.opt");
  if(!btn) return;
  const quizCard = btn.closest(".quiz");
  if(quizCard.dataset.answered) return;
  quizCard.dataset.answered = "1";
  const idx = parseInt(btn.dataset.idx,10);
  const allOpts = quizCard.querySelectorAll("button.opt");
  const lessonId = quizCard.id.replace("quiz-","").replace("fq-","");
  const lessonData = ALL_LESSONS.find(l => l.id === lessonId);
  const quizData = lessonData ? lessonData.quiz : null;
  allOpts.forEach((b,i) => {
    b.disabled = true;
    if(quizData && i === quizData.correct) b.classList.add("correct");
    else if(i === idx) b.classList.add("wrong");
  });
  const explain = quizCard.querySelector(".explain");
  if(quizData){
    explain.textContent = (idx === quizData.correct ? "✅ נכון! " : "❌ לא מדויק. ") + quizData.explain;
    explain.classList.add("show");
  }
  quizCard.dataset.correct = (quizData && idx === quizData.correct) ? "1" : "0";

  // auto-mark lesson done on correct answer (only for per-lesson quiz cards)
  if(quizCard.id.startsWith("quiz-") && quizData && idx === quizData.correct){
    markDone(lessonId, true);
  }
});

// Mark-done checkboxes
document.addEventListener("change", (e) => {
  if(e.target.matches('input[type="checkbox"][data-lesson]')){
    markDone(e.target.dataset.lesson, e.target.checked);
  }
});
function markDone(id, val){
  state[id] = val;
  saveState();
  refreshBadges();
  document.querySelectorAll(`input[data-lesson="${id}"]`).forEach(cb => cb.checked = val);
  updateCertGate();
}

// Final quiz submit
document.addEventListener("click", (e) => {
  if(e.target.id !== "submitFinalQuiz") return;
  const cards = document.querySelectorAll("#finalQuizList .quiz");
  let answered = 0, correct = 0;
  cards.forEach(c => {
    if(c.dataset.answered){ answered++; if(c.dataset.correct === "1") correct++; }
  });
  const total = cards.length;
  const scoreCard = document.getElementById("finalScoreCard");
  const scoreText = document.getElementById("finalScoreText");
  scoreCard.style.display = "block";
  const pct = total ? Math.round((correct/total)*100) : 0;
  if(answered < total){
    scoreText.innerHTML = `ענית על ${answered} מתוך ${total} שאלות. אנא ענו על כל השאלות לפני בדיקת הציון הסופי.`;
  } else {
    const pass = pct >= 80;
    scoreText.innerHTML = `${correct}/${total} תשובות נכונות (${pct}%) — ${pass ? "🎉 עברתם בהצלחה! גשו לתעודת הסיום." : "כדאי לחזור על החומר ולנסות שוב."}`;
    state["final_quiz_pass"] = pass;
    saveState();
    updateCertGate();
  }
  scoreCard.scrollIntoView({behavior:"smooth", block:"center"});
});

function updateCertGate(){
  const doneTotal = ALL_LESSONS.filter(l => state[l.id]).length;
  const allDone = doneTotal === TOTAL;
  const gateText = document.getElementById("certGateText");
  const certBox = document.getElementById("certBox");
  const certGate = document.getElementById("certGate");
  if(!gateText) return;
  if(allDone){
    certGate.style.display = "none";
    certBox.style.display = "block";
    const savedName = localStorage.getItem(CERT_KEY) || "";
    const nameInput = document.getElementById("certNameInput");
    nameInput.value = savedName;
    document.getElementById("certDate").textContent = new Date().toLocaleDateString("he-IL");
  } else {
    certGate.style.display = "block";
    certBox.style.display = "none";
    gateText.textContent = `השלמתם ${doneTotal} מתוך ${TOTAL} שיעורים. סיימו את כל השיעורים (סימון "הושלם" בכל שיעור) כדי לפתוח את התעודה.`;
  }
}
document.addEventListener("input", (e) => {
  if(e.target.id === "certNameInput") localStorage.setItem(CERT_KEY, e.target.value);
});

/* ======================= ROUTER ======================= */
function showRoute(route){
  if(!route) route = "intro";
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  const target = document.getElementById("sec-" + route);
  if(target) target.classList.add("active");
  else document.getElementById("sec-intro").classList.add("active");

  document.querySelectorAll("[data-route]").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(`[data-route="${route}"]`).forEach(el => el.classList.add("active"));

  // auto-open the module containing this lesson
  const modEntry = ALL_LESSONS.find(l => l.id === route);
  if(modEntry){
    const grp = [...document.querySelectorAll(".nav-group")].find(g => g.querySelector(`a[data-route="${route}"]`));
    if(grp) grp.open = true;
  }
  window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"});
  if(route === "certificate" || route === "final-quiz") updateCertGate();

  // close mobile sidebar after navigation
  document.getElementById("sidebar").classList.remove("open");
}

// navigate() uses history.replaceState (not location.hash= or pushState)
// so the back button always exits the course instead of stepping through
// its own lesson history.
function navigate(route){
  history.replaceState(null, "", "#" + route);
  showRoute(route);
}

document.addEventListener("click", (e) => {
  const link = e.target.closest("[data-route]");
  if(link && link.tagName === "A"){
    e.preventDefault();
    navigate(link.dataset.route);
  }
  const jump = e.target.closest("[data-jump]");
  if(jump){
    navigate(jump.dataset.jump);
  }
});
window.addEventListener("hashchange", () => showRoute(location.hash.slice(1)));

/* Mobile sidebar toggle */
document.getElementById("toggleSidebar").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});

/* Search filter */
document.getElementById("searchBox").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".nav-links li").forEach(li => {
    const text = li.textContent.toLowerCase();
    li.style.display = text.includes(q) ? "" : "none";
  });
  document.querySelectorAll(".nav-group").forEach(g => { if(q) g.open = true; });
});

/* Init */
refreshBadges();
showRoute(location.hash.slice(1) || "intro");
</script>
</body>
</html>
