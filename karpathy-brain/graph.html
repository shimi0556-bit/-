<style>
/* Layout: full-height graph field; header strip on top; reading panel docked at the inline-start edge (bottom sheet on phones). */
:root {
  --bg: #eef1ee; --surface: #fbfcfa; --fg: #18211e; --muted: #5a6762; --line: #c9d1cc; --edge: rgba(40, 60, 54, .16);
  --rule: #c2410c; --principle: #0e7466; --method: #6d3fc6; --source: #45689c; --core: #a16207;
  --display: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --surface: #161e1c; --fg: #e3ebe7; --muted: #92a19b; --line: #2a3632; --edge: rgba(190, 215, 205, .13);
  --rule: #f97343; --principle: #2fb8a3; --method: #a78bfa; --source: #7d9fd6; --core: #e0a526; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #161e1c; --fg: #e3ebe7; --muted: #92a19b; --line: #2a3632; --edge: rgba(190, 215, 205, .13);
  --rule: #f97343; --principle: #2fb8a3; --method: #a78bfa; --source: #7d9fd6; --core: #e0a526; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-inline: 16px; padding-block: 12px; gap: 12px; box-sizing: border-box; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.35rem; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.stats { font-family: var(--mono); font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; text-align: end; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-inline-start: auto; }
.search { font: inherit; font-size: .88rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); width: 13rem; max-width: 100%; }
.search:focus-visible, .chip:focus-visible, .nb:focus-visible, .rule-link:focus-visible { outline: 2px solid var(--rule); outline-offset: 2px; }
.chip { font: inherit; font-size: .8rem; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); cursor: pointer; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }

.main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 12px; min-height: 0; }
.field { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
svg { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; direction: ltr; }
svg:active { cursor: grabbing; }
.edge { stroke: var(--edge); stroke-width: 1; }
.edge.hot { stroke: var(--fg); stroke-opacity: .55; stroke-width: 1.4; }
.node circle { stroke: var(--bg); stroke-width: 1.5; cursor: pointer; }
.node text { font-family: var(--mono); font-size: 10.5px; fill: var(--fg); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.node.kind-rule text { font-family: var(--body); font-weight: 600; font-size: 12.5px; }
.node.src-label text { opacity: 0; transition: opacity .15s; }
.zoomed .node.src-label text, .node.src-label.lit text { opacity: 1; }
.dim .node:not(.lit) { opacity: .16; }
.dim .edge:not(.hot) { stroke-opacity: .25; }
.node.sel circle { stroke: var(--fg); stroke-width: 2.5; }
.node.hidden, .edge.hidden { display: none; }
.hint { position: absolute; inset-inline-start: 10px; bottom: 8px; font-size: .74rem; color: var(--muted); background: color-mix(in srgb, var(--bg) 82%, transparent); padding: 2px 8px; border-radius: 4px; pointer-events: none; }

aside { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 16px 18px; overflow-y: auto; min-width: 0; min-height: 0; }
.kind-tag { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
aside h2 { font-family: var(--display); font-size: 1.12rem; margin: 2px 0 8px; line-height: 1.3; text-wrap: balance; direction: ltr; text-align: start; unicode-bidi: plaintext; }
aside p { margin: 0 0 12px; }
.ltr { direction: ltr; unicode-bidi: plaintext; text-align: start; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: .82rem; margin: 0 0 12px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; font-family: var(--mono); font-size: .78rem; direction: ltr; text-align: start; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
h3 { font-size: .78rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 14px 0 6px; }
.nbs { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.nb, .rule-link { font: inherit; font-size: .84rem; text-align: start; background: none; border: 0; padding: 4px 6px; border-radius: 5px; color: var(--fg); cursor: pointer; display: flex; gap: 8px; align-items: baseline; width: 100%; }
.nb:hover, .rule-link:hover { background: color-mix(in srgb, var(--line) 45%, transparent); }
.nb .dot, .rule-link .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); transform: translateY(-1px); }
.nb span:last-child { direction: ltr; unicode-bidi: plaintext; overflow-wrap: anywhere; }
a.open { display: inline-block; font-size: .84rem; color: var(--rule); margin-top: 6px; }
.back { font: inherit; font-size: .8rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; margin-bottom: 8px; }
.back:hover { color: var(--fg); }

@media (max-width: 760px) {
  .app { grid-template-rows: auto minmax(340px, 1fr); height: auto; min-height: 100%; }
  .main { grid-template-columns: 1fr; grid-template-rows: 62vh auto; }
  .field { order: -1; }
  .controls { margin-inline-start: 0; }
  .search { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .node.src-label text { transition: none; } }
</style>

const DATA = {"nodes": [{"id": "_hot.md", "title": "Hot page: how Karpathy thinks (read this first)", "kind": "core", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/_hot.md", "quotes": 0, "summary": "Compiled from 58 public sources (blogs 2011–2026, repo READMEs, the 2025 Dwarkesh interview). Everything here is an interpretation; quotes and evidence live in the linked pages. Don't present any of it as his words unless it's a quote from the wiki.", "degree": 14}, {"id": "methods/coding-with-llms.md", "title": "Coding with LLMs", "kind": "method", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/methods/coding-with-llms.md", "quotes": 5, "summary": "His stated workflow changed over time; the wiki keeps both positions with dates.", "degree": 6}, {"id": "methods/explain-to-learn.md", "title": "Explain to learn", "kind": "method", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/methods/explain-to-learn.md", "quotes": 3, "summary": "Explaining is a test of understanding: where the explanation breaks is where understanding is missing. Candidate rule.", "degree": 3}, {"id": "methods/llm-wiki.md", "title": "LLM wiki", "kind": "method", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/methods/llm-wiki.md", "quotes": 2, "summary": "The pattern from his gist, and the structure of this whole folder:", "degree": 1}, {"id": "methods/ramps-to-knowledge.md", "title": "Ramps to knowledge (how he teaches)", "kind": "method", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/methods/ramps-to-knowledge.md", "quotes": 5, "summary": "Education as an engineering problem: lay out a tangle of knowledge as a ramp where each step depends only on the previous one, never too hard and never trivial. Feeds rules 2, 4, 6.", "degree": 9}, {"id": "methods/recipe-for-training.md", "title": "Recipe for training neural nets", "kind": "method", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/methods/recipe-for-training.md", "quotes": 3, "summary": "From A Recipe for Training Neural Networks (2019). The method, compressed:", "degree": 6}, {"id": "methods/reproduce-from-scratch.md", "title": "Reproduce from scratch", "kind": "method", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/methods/reproduce-from-scratch.md", "quotes": 2, "summary": "Rebuild a known result, report exactly where your numbers do and don't match, then change one thing at a time and measure each change. Feeds rules 1, 3, 5.", "degree": 5}, {"id": "principles/build-to-understand.md", "title": "Build to understand", "kind": "principle", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/principles/build-to-understand.md", "quotes": 3, "summary": "Claim: you only understand what you can build; building exposes the gaps you didn't know you had. Feeds rule 1.", "degree": 13}, {"id": "principles/data-first.md", "title": "Data first", "kind": "principle", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/principles/data-first.md", "quotes": 3, "summary": "Claim: look at the data (and measure the human baseline) before touching the model. Candidate rule in rules.md.", "degree": 7}, {"id": "principles/everything-else-is-efficiency.md", "title": "Everything else is efficiency", "kind": "principle", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/principles/everything-else-is-efficiency.md", "quotes": 3, "summary": "Claim: the core idea of a system fits in a few hundred lines; the rest of a production codebase is efficiency. Teach and reason from the core. Feeds rules 2 and 7.", "degree": 14}, {"id": "principles/first-order-terms.md", "title": "First-order terms", "kind": "principle", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/principles/first-order-terms.md", "quotes": 3, "summary": "Claim: from his physics training: every system has a first-order approximation that explains most of it; find it, show it working, then add higher-order terms. Feeds rule 2.", "degree": 6}, {"id": "principles/ghosts-not-animals.md", "title": "Ghosts, not animals", "kind": "principle", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/principles/ghosts-not-animals.md", "quotes": 3, "summary": "Claim: LLMs come from imitating internet text, not from evolution or learning through experience, so they are a different kind of mind with jagged abilities: superhuman in places, oddly dumb in others.", "degree": 6}, {"id": "principles/leaky-abstractions.md", "title": "Leaky abstractions and silent failure", "kind": "principle", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/principles/leaky-abstractions.md", "quotes": 2, "summary": "Claim: neural-net tooling looks like plug-and-play APIs but isn't; errors don't raise, they quietly make results a bit worse. So you must understand what's under the abstraction and verify each step. Feeds rules 1, 4, 5.", "degree": 4}, {"id": "principles/march-of-nines.md", "title": "March of nines", "kind": "principle", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/principles/march-of-nines.md", "quotes": 2, "summary": "Claim: a demo that works 90% of the time is the first nine; each further nine costs about as much as the first. So he distrusts demos. Candidate rule; supports rule 5.", "degree": 4}, {"id": "principles/software-1-2-3.md", "title": "Software 1.0 / 2.0 / 3.0", "kind": "principle", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/principles/software-1-2-3.md", "quotes": 2, "summary": "Claim: 1.0 is code people write; 2.0 is neural-net weights found by optimization against data and objectives; 3.0 is programming LLMs through prompts and context.", "degree": 4}, {"id": "principles/verifiability.md", "title": "Verifiability", "kind": "principle", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/principles/verifiability.md", "quotes": 3, "summary": "Claim: classical software automates what you can specify; learned software automates what you can verify. Tasks with a cheap, automatic success signal improve fastest, which is why AI progress is jagged.", "degree": 5}, {"id": "rules.md", "title": "The seven rules", "kind": "core", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/rules.md", "quotes": 23, "summary": "How he builds and how he teaches, as rules an agent can follow. A rule is kept only if it shows up in at least two different original contexts (e.g. a blog post and an interview; a repost of the same talk counts once), each backed by an exact quote. The names follow the video that inspired this project; the evidence below is ours, checked against raw/ by tools/check_wiki.py.", "degree": 41}, {"id": "sources/animals-vs-ghosts.md", "title": "Animals vs Ghosts", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/sources/animals-vs-ghosts.md", "quotes": 0, "family": "bearblog", "type": "blog post", "date": "2025-10-01", "words": 1768, "attribution": "direct", "summary": "Reaction to the Sutton/Dwarkesh podcast: LLM pretraining is not animal-like learning from experience; it imitates internet text, producing ghost-like entities.", "degree": 1}, {"id": "sources/append-and-review.md", "title": "The append-and-review note", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/sources/append-and-review.md", "quotes": 1, "family": "bearblog", "type": "blog post", "date": "2025-03-19", "words": 740, "attribution": "direct", "summary": "His note-taking system: one single note, append at the top, review periodically. Structure costs more than it gives.", "degree": 1}, {"id": "sources/arxiv-sanity-lite.md", "title": "arxiv-sanity-lite (README)", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/sources/arxiv-sanity-lite.md", "quotes": 0, "family": "github", "type": "repo README", "date": "fetched 2026-10-11", "words": 359, "attribution": "direct", "summary": "A lighter from-scratch rewrite of arxiv-sanity: tag papers, get SVM-over-tfidf recommendations.", "degree": 0}, {"id": "sources/auto-grade-hn.md", "title": "Auto-grading decade-old Hacker News discussions with hindsight", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/sources/auto-grade-hn.md", "quotes": 0, "family": "bearblog", "type": "blog post", "date": "2025-12-10", "words": 1022, "attribution": "direct", "summary": "Using an LLM to grade 2015 HN comments for prescience.", "degree": 0}, {"id": "sources/autoresearch.md", "title": "autoresearch (README)", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/sources/autoresearch.md", "quotes": 1, "family": "github", "type": "repo README", "date": "fetched 2026-10-11", "words": 1225, "attribution": "direct", "summary": "An agent runs small LLM-training experiments overnight: edit, train 5 minutes, keep or discard, repeat. Verifiability turned into a loop.", "degree": 1}, {"id": "sources/backprop.md", "title": "Yes you should understand backprop", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/sources/backprop.md", "quotes": 1, "family": "medium", "type": "blog post (Medium)", "date": "2016-12-19", "words": 1635, "attribution": "direct", "summary": "Why CS231n made students write backward passes by hand: vanishing sigmoid gradients, dead ReLUs, exploding RNN gradients, and a real DQN clipping bug are all failures you can only see if you understand the backward pass.", "degree": 5}, {"id": "sources/biohacking-lite.md", "title": "Biohacking Lite", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/sources/biohacking-lite.md", "quotes": 0, "family": "blog", "type": "blog post", "date": "2020-06-11", "words": 5277, "attribution": "direct", "summary": "A year of studying metabolism, diet, sleep and fasting, with self-measurement.", "degree": 0}, {"id": "sources/blockchain.md", "title": "A from-scratch tour of Bitcoin in Python", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/sources/blockchain.md", "quotes": 1, "family": "blog", "type": "blog post", "date": "2021-06-21", "words": 12552, "attribution": "direct", "summary": "Implements Bitcoin primitives (keys, signatures, addresses, transactions) from scratch in pure Python and broadcasts a real transaction, explicitly to understand it by building it.", "degree": 4}, {"id": "sources/breaking-convnets.md", "title": "Breaking Linear Classifiers on ImageNet", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5j3jkt/karpathy-brain/wiki/sources/breaking-convnets.md", "quotes": 0, "family": "blog", "type": "blog post", "date": "2015-03-30", "words": 3505, "attribution": "direct", "summary": "Adversarial examples explained with linear classifiers: the problem is linearity in high dimensions, not deep nets specifically.", "degree": 0}, {"id": "sources/build-nanogpt.md", "title": "build-nanogpt (README)", "kind": "source", "url": "https://github.com/shimi0556-bit/-/blob/claude/charming-lamport-5 node.on("mouseenter", (e, d) => light(d.id)).on("mouseleave", () => light(selected))
  .on("click", (e, d) => select(d.id))
  .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(d.id); } });
svg.on("click", e => { if (e.target === svg.node()) select(null); });

function applyVisibility() {
  node.classed("hidden", d => !visible.has(d.kind));
  edge.classed("hidden", d => !visible.has(d.source.kind) || !visible.has(d.target.kind));
}

// search
document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { light(selected); return; }
  const hits = new Set(nodes.filter(n => (n.title + " " + (n.summary || "")).toLowerCase().includes(q)).map(n => n.id));
  field.classList.add("dim");
  node.classed("lit", d => hits.has(d.id));
  edge.classed("hot", false);
});

// panel
const panel = document.getElementById("panel");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function nbButton(n) {
  return `<li><button class="nb" type="button" data-id="${esc(n.id)}" style="--c:${cssVar(n.kind)}"><span class="dot"></span><span>${esc(n.title)}</span></button></li>`;
}
function home() {
  const rules = nodes.filter(n => n.kind === "rule").sort((a, b) => a.title.localeCompare(b.title));
  panel.innerHTML = `
    <div class="kind-tag" style="--c:${cssVar("core")}">karpathy-brain / wiki</div>
    <h2 style="direction:rtl;text-align:start">איך לקרוא את הגרף</h2>
    <p>כל צומת הוא עמוד בוויקי. קו בין שני צמתים אומר שאחד מקשר לשני או מצטט את המקור שלו. הכללים (כתום) מחוברים לכל מקור שמגבה אותם, כך שאפשר לראות על כמה ראיות כל כלל נשען.</p>
    <p>צמתים גדולים יותר = יותר חיבורים. הראיון אצל Dwarkesh והפוסט Recipe הם המרכזים הכבדים ביותר.</p>
    <h3>שבעת הכללים</h3>
    <ul class="nbs">${rules.map(r => `<li><button class="rule-link" type="button" data-id="${esc(r.id)}" style="--c:${cssVar("rule")}"><span class="dot"></span><span class="ltr">${esc(r.title)} <span style="font-family:var(--mono);color:var(--muted);font-size:.74rem">${nbrs.get(r.id).size - 1}</span></span></button></li>`).join("")}</ul>
    <p style="font-size:.84rem;color:var(--muted)">${nodes.filter(n => n.degree === 0).length} מקורות עדיין לא מחוברים לשום עמוד (יתומים, כמו בגרף של Obsidian). אלה פוסטים פחות רלוונטיים להוראה, למשל biohacking ו-chemical hygiene.</p>
    <h3>הכי מחוברים</h3>
    <ul class="nbs">${[...nodes].filter(n => n.kind === "source").sort((a, b) => b.degree - a.degree).slice(0, 6).map(nbButton).join("")}</ul>`;
}
function select(id) {
  selected = id;
  node.classed("sel", d => d.id === id);
  light(id);
  if (!id) { home(); return; }
  const n = byId.get(id);
  const ns = [...nbrs.get(id)].map(x => byId.get(x)).sort((a, b) => Object.keys(KINDS).indexOf(a.kind) - Object.keys(KINDS).indexOf(b.kind) || b.degree - a.degree);
  const meta = [];
  if (n.kind === "source") {
    meta.push(["סוג", n.type], ["תאריך", n.date], ["מילים", fmt.format(n.words)], ["משפחה", FAMILY[n.family] || n.family], ["ייחוס", n.attribution]);
  }
  if (n.quotes) meta.push(["ציטוטים", n.quotes]);
  meta.push(["חיבורים", n.degree]);
  panel.innerHTML = `
    <button class="back" type="button" id="back">→ חזרה לסקירה</button>
    <div class="kind-tag" style="--c:${cssVar(n.kind)}">${KINDS[n.kind].he} · ${KINDS[n.kind].en}</div>
    <h2>${esc(n.title)}</h2>
    ${n.summary ? `<p class="ltr">${esc(n.summary)}</p>` : ""}
    <dl class="meta">${meta.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <a class="open" href="${esc(n.url)}" target="_blank" rel="noopener">פתיחת העמוד ב-GitHub ←</a>
    <h3>מחובר אל (${ns.length})</h3>
    <ul class="nbs">${ns.map(nbButton).join("")}</ul>`;
  document.getElementById("back").onclick = () => select(null);
}
panel.addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (b) select(b.dataset.id);
});
home();
applyVisibility();
</script>
